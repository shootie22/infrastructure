apiVersion: apps/v1
kind: Deployment
metadata:
  name: yeetus-net
  namespace: yeetus-net
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yeetus-net
  template:
    metadata:
      labels:
        app: yeetus-net
    spec:
      containers:
        - name: caddy
          image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
          args:
            - caddy
            - file-server
            - --root
            - /srv
            - --listen
            - :8080
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /srv
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # Traefik needs a moment to stop sending requests here (#89).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
      volumes:
        - name: site
          configMap:
            name: yeetus-net-site
      # One copy per site, so either site can serve it alone (#89).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: yeetus-net
  # No third site for a surge pod, so replace one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
