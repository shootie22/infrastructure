apiVersion: apps/v1
kind: Deployment
metadata:
  name: yeetus-net
  namespace: yeetus-net
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yeetus-net
  template:
    metadata:
      labels:
        app: yeetus-net
    spec:
      containers:
        - name: caddy
          image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
          args:
            - caddy
            - file-server
            - --root
            - /srv
            - --listen
            - :8080
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: site
              mountPath: /srv
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: site
          configMap:
            name: yeetus-net-site
