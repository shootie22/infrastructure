# Caddy serving the page fetch.sh keeps (site.yaml). Nothing on disk, so one
# copy per site and either can serve it alone (#89).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubitrix
  namespace: cubitrix
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cubitrix
  template:
    metadata:
      annotations:
        # The hash of what it reads (scripts/check-config-hash): a change to site.yaml restarts it; both containers read it only at start.
        config-hash: "7aac2bb7c00f"
      labels:
        app.kubernetes.io/name: cubitrix
    spec:
      priorityClassName: service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: caddy
          image: caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          ports:
            - {name: http, containerPort: 8080}
          # Ready once there's a page to serve: the first fetch has finished.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # The official Caddy binary carries this file capability.
              add: [NET_BIND_SERVICE]
          # Traefik needs a moment to stop sending requests here (#89).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - {name: caddyfile, mountPath: /etc/caddy, readOnly: true}
            - {name: site, mountPath: /srv/site, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: runtime-config, mountPath: /config}
        - name: fetch
          image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [sh, /etc/fetch/fetch.sh]
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: fetch, mountPath: /etc/fetch, readOnly: true}
            - {name: site, mountPath: /srv/site}
      volumes:
        # Mounts of one ConfigMap, so neither file is in what's served.
        - name: caddyfile
          configMap:
            name: cubitrix-site
            items:
              - {key: Caddyfile, path: Caddyfile}
        - name: fetch
          configMap:
            name: cubitrix-site
            items:
              - {key: fetch.sh, path: fetch.sh}
        - name: site
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: cubitrix
  # No third site for a surge pod, so replace one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
