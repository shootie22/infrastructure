apiVersion: v1
kind: Namespace
metadata:
  name: github-commit-sync
  annotations:
    hub.radunenu.com/description: Mirrors Gitea commits to GitHub's contribution graph
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-commit-sync
  namespace: github-commit-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: github-commit-sync
  template:
    metadata:
      labels:
        app: github-commit-sync
    spec:
      automountServiceAccountToken: false
      # The service runs as PID 1 and shells out to git, whose helpers it never
      # reaps. Zombies piled up until the pod hit its process limit and every
      # sync failed with "fork/exec /usr/bin/git: resource temporarily
      # unavailable" (silently, from early October). With a shared process
      # namespace the pause container is PID 1 and reaps them.
      shareProcessNamespace: true
      # The image is arm64 only: mixi or minima, moving 30 s after its node
      # stops answering.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [mixi, minima]}
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.0.10
        searches:
          - github-commit-sync.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "1"
      containers:
        - name: github-commit-sync
          image: git.radunenu.com/radu/github-commit-sync:v0.2.0@sha256:59751a30d88a9692fb0225328e299b2f4ce4db4dcb444e9cd3a11ae9ccbc1527
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: github-commit-sync-env
          # Every name and address I commit as. Gitea's commits API ignores an
          # author filter, so v0.2.0 matches these itself (name, email or Gitea
          # login), and skips pull mirrors and forks. Set here, not in the
          # secret: it's not secret, and env wins over envFrom.
          env:
            - name: GITEA_AUTHORS
              value: "radu,Radu N.,Radu Nenu,hello@radunenu.com,me@yeetus.net"
          ports:
            - name: http
              containerPort: 6424
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: github-commit-sync
  namespace: github-commit-sync
spec:
  selector:
    app: github-commit-sync
  ports:
    - name: http
      port: 6424
      targetPort: http
