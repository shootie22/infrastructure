apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
spec:
  selector:
    matchLabels:
      app: tailnet-dns
  template:
    metadata:
      labels:
        app: tailnet-dns
      annotations:
        config-revision: "2"
    spec:
      # Both API servers, one copy each (#149); Headscale's split DNS lists
      # both tailnet addresses.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [fuji, thinkcentre]}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # This node's tailnet address into the Corefile. Fails (and retries)
        # until tailscale0 has one.
        - name: corefile
          image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: [/bin/sh, -ec]
          args:
            - |
              ip=$(ip -4 addr show dev tailscale0 | awk '/inet /{split($2, a, "/"); print a[1]; exit}')
              [ -n "$ip" ]
              sed "s/TAILNET_IP/$ip/g" /config/Corefile > /run/coredns/Corefile
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: corefile, mountPath: /run/coredns}
      containers:
        - name: coredns
          image: coredns/coredns:1.14.7@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/run/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ready
              port: 8181
            periodSeconds: 10
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /health
              port: 8081
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: corefile
              mountPath: /run/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tailnet-dns
        - name: corefile
          emptyDir: {}
