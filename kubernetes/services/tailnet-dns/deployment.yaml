apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailnet-dns
  namespace: tailnet-dns
spec:
  selector:
    matchLabels:
      app: tailnet-dns
  template:
    metadata:
      labels:
        app: tailnet-dns
      annotations:
        config-revision: "3"
    spec:
      # Both API servers, one copy each (#149); Headscale's split DNS lists
      # both tailnet addresses.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [fuji, thinkcentre]}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # This node's tailnet address into the Corefile. Fails (and retries)
        # until tailscale0 has one.
        - name: corefile
          image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: [/bin/sh, -ec]
          args:
            - |
              ip=$(ip -4 addr show dev tailscale0 | awk '/inet /{split($2, a, "/"); print a[1]; exit}')
              [ -n "$ip" ]
              sed "s/TAILNET_IP/$ip/g" /config/Corefile > /run/coredns/Corefile
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: corefile, mountPath: /run/coredns}
      containers:
        - name: coredns
          image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
          imagePullPolicy: IfNotPresent
          args: ["-conf", "/run/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
          readinessProbe:
            httpGet:
              host: 127.0.0.1
              path: /ready
              port: 8181
            periodSeconds: 10
          livenessProbe:
            httpGet:
              host: 127.0.0.1
              path: /health
              port: 8081
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: corefile
              mountPath: /run/coredns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tailnet-dns
        - name: corefile
          emptyDir: {}
