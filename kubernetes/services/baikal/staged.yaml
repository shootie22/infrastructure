apiVersion: v1
kind: Namespace
metadata:
  name: baikal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baikal
  namespace: baikal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: baikal
  template:
    metadata:
      labels:
        app: baikal
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy and takes over when this site is gone (dotfiles
      # modules/nixos/site-failover).
      nodeSelector:
        ha.radunenu.com/baikal: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: baikal
          image: ckulka/baikal:0.10.1-nginx@sha256:045918423df00a3f9ec793a819b9acdb055d338b75387926b7d93d753ac1e93a
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: specific
              mountPath: /var/www/baikal/Specific
            - name: config
              mountPath: /var/www/baikal/config
      volumes:
        - name: specific
          hostPath:
            path: /srv/ha/baikal/Specific
            type: Directory
        - name: config
          hostPath:
            path: /srv/ha/baikal/config
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: baikal
  namespace: baikal
spec:
  selector:
    app: baikal
  ports:
    - name: http
      port: 80
      targetPort: http
