# Gitea Actions runners for every repo on git.radunenu.com, friends' included.
#
# Each CI job runs in its own Kata VM (a pod in ci-jobs): a Gitea runner that
# takes exactly one job, a rootless Docker daemon it runs the job in, and
# nothing else. When the job ends the pod ends, and the VM with it.
#
# The dispatcher here keeps one such pod waiting per node. It holds the
# registration token and registers an ephemeral runner for each pod; the pod
# only gets the resulting .runner file, whose credentials Gitea revokes as
# soon as a job is assigned. So nothing in a VM can register runners or pick
# up other jobs. The dispatcher runs no workflow code.
#
# (The runner's own Kubernetes backend would be simpler, but it runs steps
# through `kubectl exec` with stdin, and with Kata the output after the first
# write gets lost.)
apiVersion: v1
kind: Namespace
metadata:
  name: ci-runner
  labels:
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    hub.radunenu.com/description: Starts a Kata VM per CI job, each with a one-job Gitea runner
---
# Privileged here only because the Docker sidecar needs it inside its VM;
# the ci-jobs-sandboxed policy (cluster.yaml) keeps every pod in a VM.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-jobs
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    hub.radunenu.com/description: CI job pods, one Kata VM each
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
  namespace: ci-runner
---
# Starts and removes job pods and their .runner Secrets, in ci-jobs only. It
# can't read Secrets back or exec into pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher
  namespace: ci-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # A failed runner's last lines, which it logs before the pod goes.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher
  namespace: ci-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: ci-runner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcher
  namespace: ci-runner
data:
  # One line per node: node, its runs-on labels, the Docker sidecar's CPU and
  # memory limit (the job runs there), and the filesystem holding the node's
  # container layers (/var/lib/rancher), which a job fills (dispatch.sh).
  # fuji gets 2 of its 4 cores, not 3: it's Matrix's home and Synapse runs on one thread (docs/matrix/
  # architecture.md, "Gitea runners on the same nodes"). mixi's 3584Mi (was
  # 2560Mi): cubitrix's arm64 release build needs one rustc of about 2.7 GB
  # for cubitrix-matrix/matrix-sdk even at -j 1, and Docker and cargo take
  # their share of the limit too. On mixi's 8 GB that leaves Ollama (1Gi
  # requested, 4Gi at most) its room while idle; if it loads a model during
  # a failover, the CI pod (priority -100) is what gets evicted.
  slots: |
    thinkcentre linux-amd64:docker://docker.gitea.com/runner-images:ubuntu-latest,linux-amd64-thinkcentre:docker://docker.gitea.com/runner-images:ubuntu-latest 2 6Gi /home
    fuji linux-amd64:docker://docker.gitea.com/runner-images:ubuntu-latest,linux-amd64-fuji:docker://docker.gitea.com/runner-images:ubuntu-latest 2 8Gi /
    mixi linux-arm64:docker://docker.gitea.com/runner-images:ubuntu-latest,linux-arm64-mixi:docker://docker.gitea.com/runner-images:ubuntu-latest 3 3584Mi /

  register.yaml: |
    runner:
      file: /work/.runner

  dispatch.sh: |
    set -u
    K=/opt/kubectl/bin/kubectl
    ns=ci-jobs
    # A job takes up to 23 GB of the thinkcentre's /home while it runs
    # (2026-10-20), and kubelet evicts pods once a disk is under 5% free. On
    # top of a disk that was 11% free, that evicted nearly every pod there. So
    # a job pod starts on a node only if the disk keeps 10% free plus this
    # much. Prometheus not answering doesn't hold CI up.
    PROM=http://prometheus.monitoring.svc.cluster.local:9090
    NEED=$((35 * 1024 * 1024 * 1024))
    declare -A held
    urlencode() {
      local s=$1 i c out=
      for ((i = 0; i < ${#s}; i++)); do
        c=${s:i:1}
        case $c in [a-zA-Z0-9._~-]) out+=$c ;; *) printf -v c '%%%02X' "'$c"; out+=$c ;; esac
      done
      printf '%s' "$out"
    }
    # The node's spare room in bytes, beyond 10% free; empty if unknown.
    room() {
      local m="node=\"$1\",mountpoint=\"$2\""
      wget -qO- -T 10 "$PROM/api/v1/query?query=$(urlencode "node_filesystem_avail_bytes{$m} - 0.10 * node_filesystem_size_bytes{$m}")" 2>/dev/null |
        sed -n 's/.*"value":\[[^,]*,"\([^"]*\)"\].*/\1/p'
    }
    while true; do
      while read -r node labels cpu mem fs; do
        [ -n "$node" ] || continue
        name="ci-$node"
        # Empty only when the pod is really gone; an API error skips the node
        # for this round (k3s restarts), so a live pod's Secret stays put.
        if ! state=$($K -n $ns get pod "$name" --ignore-not-found -o jsonpath='{.status.phase} {.status.containerStatuses[?(@.name=="runner")].state.terminated.reason}'); then
          continue
        fi
        read -r phase exited <<<"$state"
        # How each container ended, before the pod (and that record) goes: a
        # runner killed mid-job leaves only a cut-off log in Gitea otherwise.
        if [ -n "${exited:-}" ] || [ "$phase" = Failed ]; then
          echo "$name ended: $($K -n $ns get pod "$name" -o jsonpath='{range .status.containerStatuses[*]}{.name}={.state.terminated.reason}/{.state.terminated.exitCode} {end}' 2>/dev/null)"
          # And why, when the runner failed: its last lines.
          case "${exited:-}" in Completed) ;; *) $K -n $ns logs "$name" -c runner --tail=15 2>/dev/null | sed "s/^/  $name runner: /" ;; esac
        fi
        # Done once the runner has exited, even if the Docker sidecar lingers.
        [ -n "${exited:-}" ] && phase=Succeeded
        case "$phase" in
          Pending|Running) continue ;;
          Succeeded) $K -n $ns delete pod "$name" --wait=true || continue ;;
          Failed)
            echo "$name failed, starting a new one in a minute"
            $K -n $ns delete pod "$name" --wait=true || continue
            sleep 60 ;;
        esac
        r=$(room "$node" "${fs:-/}")
        if [ -n "$r" ] && awk -v r="$r" -v n="$NEED" 'BEGIN { exit !(r < n) }'; then
          [ -n "${held[$node]:-}" ] || echo "$name held back: $node's ${fs:-/} would go under 10% free with a job on it"
          held[$node]=1
          continue
        fi
        [ -z "${held[$node]:-}" ] || echo "$name: $node has room again"
        unset "held[$node]"
        $K -n $ns delete secret "$name" --ignore-not-found >/dev/null || continue
        rm -f /work/.runner
        if ! gitea-runner register --no-interactive --ephemeral \
            --config /etc/dispatcher/register.yaml --instance https://git.radunenu.com \
            --token-file /secrets/token --name "$name" --labels "$labels" >/dev/null; then
          echo "registering $name failed"; sleep 30; continue
        fi
        if ! $K -n $ns create secret generic "$name" --from-file=runner=/work/.runner >/dev/null; then
          rm -f /work/.runner; continue
        fi
        rm -f /work/.runner
        sed -e "s/__NAME__/$name/g" -e "s/__NODE__/$node/g" -e "s/__CPU__/$cpu/g" -e "s/__MEM__/$mem/g" \
          /etc/dispatcher/job-pod.yaml | $K -n $ns create -f - >/dev/null && echo "$name waiting for a job"
      done < /etc/dispatcher/slots
      sleep 10
    done

  job-pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: __NAME__
      labels: {app: ci-job}
    spec:
      restartPolicy: Never
      runtimeClassName: kata
      priorityClassName: ci-job
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # Public resolvers, not cluster DNS: a job learns nothing about the
      # cluster's services.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["1.1.1.1", "9.9.9.9"]
      # Gitea through Traefik inside the cluster, not through Cloudflare,
      # which turns away request bodies over 100 MB (image layers).
      hostAliases:
        - ip: "10.43.120.87" # traefik.kube-system
          hostnames: ["git.radunenu.com", "git.yeetus.net"]
      nodeSelector:
        kubernetes.io/hostname: __NODE__
      initContainers:
        # Docker's overlayfs can't sit on the virtiofs-shared volume, so it
        # gets an ext4 disk image there instead, which the VM's kernel
        # mounts. Ubuntu's image has mkfs; Docker's don't.
        - name: format
          image: docker.io/library/ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          command: ["sh", "-c", "truncate -s 28G /disk/docker.img && mkfs.ext4 -q -F -E lazy_itable_init=1,lazy_journal_init=1 /disk/docker.img"]
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: docker-disk, mountPath: /disk}
        # Rootless Docker, which the runner runs the job in. Privileged
        # inside the VM (for its user namespaces), but the daemon and every
        # container it starts run as an unprivileged user in the VM.
        # Kata shares image files over virtiofs, which drops file
        # capabilities, so root gives newuidmap/newgidmap the setuid bit
        # instead, sets up the devices the VM's /dev lacks, mounts the disk,
        # then hands over to the rootless user for good.
        - name: docker
          image: docker.io/library/docker:29.9.0-dind-rootless@sha256:54155db4950e2f9af3bb829fcfe627030576fc7ae235018be63175fca7326171
          restartPolicy: Always
          command:
            - sh
            - -c
            - |
              set -e
              chmod u+s "$(command -v newuidmap)" "$(command -v newgidmap)"
              [ -c /dev/net/tun ] || { mkdir -p /dev/net && mknod -m 0666 /dev/net/tun c 10 200; }
              [ -e /dev/loop-control ] || mknod /dev/loop-control c 10 237
              [ -b /dev/loop0 ] || mknod /dev/loop0 b 7 0
              losetup /dev/loop0 /disk/docker.img
              mkdir -p /home/rootless/.local/share/docker
              mount -t ext4 /dev/loop0 /home/rootless/.local/share/docker
              chown rootless:rootless /run/user/1000 /home/rootless/.local/share/docker
              chmod 700 /run/user/1000
              exec su rootless -s /bin/sh -c 'export HOME=/home/rootless XDG_RUNTIME_DIR=/run/user/1000 PATH=/home/rootless/bin:$PATH; exec dockerd-entrypoint.sh dockerd --host=unix:///run/user/1000/docker.sock'
          securityContext:
            privileged: true
            runAsUser: 0
          startupProbe:
            exec:
              command: ["test", "-S", "/run/user/1000/docker.sock"]
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            limits: {cpu: "__CPU__", memory: __MEM__}
          volumeMounts:
            - {name: docker-run, mountPath: /run/user/1000}
            - {name: docker-disk, mountPath: /disk}
      containers:
        # One job, then it exits and the pod (and VM) ends.
        - name: runner
          image: docker.io/gitea/runner:5.0.0@sha256:328b8dad8de80a19dab6c5c61292c1d624cd3460c25a5c0067e95c11318657ca
          # The .runner file and the config come in as variables, not
          # volumes: Kata syncs Secret and ConfigMap volumes into the VM with
          # a watcher, which doesn't work with QEMU running rootless.
          command:
            - sh
            - -c
            - |
              umask 077
              printf '%s' "$RUNNER_FILE" > /data/.runner
              printf '%s' "$RUNNER_CONFIG" > /data/config.yaml
              unset RUNNER_FILE
              cd /data && exec gitea-runner daemon --once --config /data/config.yaml
          env:
            - {name: HOME, value: /data}
            - name: RUNNER_FILE
              valueFrom: {secretKeyRef: {name: __NAME__, key: runner}}
            - name: RUNNER_CONFIG
              valueFrom: {configMapKeyRef: {name: job-runner, key: config.yaml}}
            - {name: DOCKER_HOST, value: "unix:///run/user/1000/docker.sock"}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: docker-run, mountPath: /run/user/1000}
            - {name: data, mountPath: /data}
      volumes:
        # Inside the VM's memory: the Docker socket.
        - name: docker-run
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: docker-disk
          emptyDir: {sizeLimit: 30Gi}
        - name: data
          emptyDir: {sizeLimit: 2Gi}
---
# The runner inside each job VM.
apiVersion: v1
kind: ConfigMap
metadata:
  name: job-runner
  namespace: ci-jobs
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 1
      timeout: 3h
    # Only this VM's cache: empty for every job, shared with nothing.
    cache:
      enabled: true
      dir: /data/cache
    container:
      docker_host: unix:///run/user/1000/docker.sock
      privileged: false
      valid_volumes: []
      # Job containers get Docker's /etc/hosts, not the pod's.
      options: --add-host=git.radunenu.com:10.43.120.87 --add-host=git.yeetus.net:10.43.120.87
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
  namespace: ci-runner
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ci-dispatcher}
  template:
    metadata:
      labels: {app: ci-dispatcher}
      # Bump when the dispatcher ConfigMap changes.
      annotations: {config: "8"}
    spec:
      serviceAccountName: dispatcher
      enableServiceLinks: false
      hostAliases:
        - ip: "10.43.120.87" # traefik.kube-system
          hostnames: ["git.radunenu.com", "git.yeetus.net"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dispatcher
          image: docker.io/gitea/runner:5.0.0@sha256:328b8dad8de80a19dab6c5c61292c1d624cd3460c25a5c0067e95c11318657ca
          command: ["bash", "/etc/dispatcher/dispatch.sh"]
          env:
            - {name: HOME, value: /work}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/dispatcher, readOnly: true}
            - {name: token, mountPath: /secrets, readOnly: true}
            - {name: kubectl, mountPath: /opt/kubectl, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: dispatcher}
        - name: token
          secret: {secretName: runner-registration}
        # kubectl straight from its official image.
        - name: kubectl
          image:
            reference: registry.k8s.io/kubectl:v1.36.3@sha256:6e4fce3c83651edb91b74bc67701c5cd263dd8aa3cd4254b1798d6425a5ab789
        - name: work
          emptyDir: {sizeLimit: 16Mi}
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
