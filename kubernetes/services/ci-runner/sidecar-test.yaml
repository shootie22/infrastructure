# Temporary: what the Kata guest offers for Docker's storage (loop, FUSE,
# overlay). Removed once CI jobs run.
apiVersion: batch/v1
kind: Job
metadata:
  name: sidecar-test-3
  namespace: ci-jobs
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app: ci-sidecar-test}
    spec:
      restartPolicy: Never
      runtimeClassName: kata
      priorityClassName: ci-job
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: thinkcentre
      containers:
        - name: docker
          image: docker.io/library/docker:29.9.0-dind-rootless@sha256:54155db4950e2f9af3bb829fcfe627030576fc7ae235018be63175fca7326171
          command:
            - sh
            - -c
            - |
              echo "== devices:"; grep -E "loop|blkext|fuse|misc" /proc/devices
              echo "== filesystems:"; grep -E "overlay|fuse|ext4|tmpfs|xfs|btrfs" /proc/filesystems | tr '\n' ' '; echo
              echo "== block:"; ls /sys/block
              echo "== modules dir:"; ls /sys/module | grep -E "^(loop|fuse|overlay|virtio_blk|tun)$" | tr '\n' ' '; echo
              echo "== tools:"; for t in fuse-overlayfs mkfs.ext4 losetup mkfs.xfs slirp4netns pasta vpnkit; do printf '%s=%s ' $t "$(command -v $t || echo -)"; done; echo
              echo "== mounts:"; grep -E " /disk | / " /proc/mounts
              mknod /dev/loop-control c 10 237 2>&1; mknod /dev/loop0 b 7 0 2>&1
              truncate -s 1G /disk/t.img; losetup /dev/loop0 /disk/t.img; echo "losetup rc=$?"
              mkdir -p /dev/fuse-test; [ -c /dev/fuse ] || mknod /dev/fuse c 10 229; ls -l /dev/fuse
              echo "== cmdline: $(cat /proc/cmdline)"
              echo "== done"
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: docker-disk, mountPath: /disk}
      volumes:
        - name: docker-disk
          emptyDir: {sizeLimit: 2Gi}
