# Grafana's database: users, sessions and preferences, one instance in each
# site (#148). Nothing in it has to survive: dashboards and datasources come
# from ConfigMaps and roles from Keycloak, so it started empty and has no
# dumps.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: monitoring
  annotations:
    # Where the primary belongs (docs/ha/decisions.md, 2026-10-21): Grafana's visitors come in through RO.
    # site-failover switches it back there by itself.
    placement.radunenu.com/home: ro
spec:
  priorityClassName: platform-critical
  instances: 2
  # A primary that stops answering is only replaced after 5 minutes:
  # the replicas are asynchronous, so a promotion can lose the last
  # writes, and on 2026-11-19 a 2.5-minute mesh outage on the
  # thinkcentre failed eight databases over (docs/incidents/
  # 2026-11-19-mesh-restart-failovers.md). A site that's really gone
  # still fails over, 5 minutes later.
  failoverDelay: 300
  # Rides out a k3s restart instead of the isolation check killing a
  # healthy primary after 30 s; still stops one really cut off before the
  # other site may promote (matrix/database.yaml, docs/matrix/failure-modes.md).
  livenessProbeTimeout: 240
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  # The hourly dump reads the replica. Without this the primary vacuums away
  # rows the dump is still reading, and the replica cancels it ("conflict
  # with recovery"): every hour while the primaries sat across the WAN after
  # 2026-10-20's failover. Reloads without a restart.
  postgresql:
    parameters:
      hot_standby_feedback: "on"
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
  resources:
    requests: {cpu: 25m, memory: 192Mi}
  storage:
    size: 1Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
