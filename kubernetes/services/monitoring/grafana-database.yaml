# Grafana's database: users, sessions and preferences, one instance in each
# site (#148). Nothing in it has to survive: dashboards and datasources come
# from ConfigMaps and roles from Keycloak, so it started empty and has no
# dumps.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: grafana-db
  namespace: monitoring
  annotations:
    # Where the primary belongs (docs/ha/decisions.md, 2026-10-21): Grafana's visitors come in through RO.
    # site-failover switches it back there by itself.
    placement.radunenu.com/home: ro
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  # The hourly dump reads the replica. Without this the primary vacuums away
  # rows the dump is still reading, and the replica cancels it ("conflict
  # with recovery"): every hour while the primaries sat across the WAN after
  # 2026-10-20's failover. Reloads without a restart.
  postgresql:
    parameters:
      hot_standby_feedback: "on"
  bootstrap:
    initdb:
      database: grafana
      owner: grafana
  storage:
    size: 1Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
