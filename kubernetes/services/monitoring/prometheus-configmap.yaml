apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.rules

    alerting:
      alertmanagers:
        - static_configs:
            # Both, so either site alone still gets alerts out (#148).
            - targets:
                - alertmanager-0.alertmanager-peers.monitoring.svc:9093
                - alertmanager-1.alertmanager-peers.monitoring.svc:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [prometheus.monitoring.svc:9090]

      - job_name: kubernetes-apiserver
        scheme: https
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [default]
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kubernetes
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: https

      - job_name: kubernetes-services
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_monitoring_radunenu_com_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_service_annotation_monitoring_radunenu_com_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_monitoring_radunenu_com_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: kubernetes_service

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_monitoring_radunenu_com_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_monitoring_radunenu_com_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_monitoring_radunenu_com_port]
            action: replace
            target_label: __address__
            separator: ";"
            regex: (.+);(.+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # CloudNativePG's exporter on every database instance (#49).
      - job_name: cnpg
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            regex: .+
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            target_label: cnpg_cluster
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # The etcd members (k3s --etcd-expose-metrics), over Nebula (#49).
      - job_name: etcd
        static_configs:
          - targets: [10.99.0.1:2381]
            labels: {member: edge}
          - targets: [10.99.0.2:2381]
            labels: {member: fuji}
          - targets: [10.99.0.3:2381]
            labels: {member: thinkcentre}

      - job_name: kubelet
        scheme: https
        kubernetes_sd_configs:
          - role: node
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - action: replace
            target_label: __address__
            replacement: kubernetes.default.svc:443
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      - job_name: kubelet-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        relabel_configs:
          - action: replace
            target_label: __address__
            replacement: kubernetes.default.svc:443
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter
          - source_labels: [__meta_kubernetes_endpoint_node_name]
            target_label: node

      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: kube-state-metrics

      - job_name: grafana
        static_configs:
          - targets: [grafana.monitoring.svc:3000]

      - job_name: blackbox-http
        metrics_path: /probe
        scrape_interval: 30s
        scrape_timeout: 15s
        params:
          module: [http_reachable]
        static_configs:
          - targets:
              - https://mon.radunenu.com
              - https://hs.radunenu.com
              - https://call.nuke.zip
              - https://c.nuke.zip
              - https://share.radunenu.com/__lbheartbeat__
              # The tailnet's relay on the edge (#38).
              - https://derp.radunenu.com/generate_204
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115

      # The failover checkers' status pages and the alert relays' health, over
      # Nebula. Each one only matters on the day it's needed, so a dead one
      # has to show up before that.
      - job_name: ha-checkers
        metrics_path: /probe
        scrape_interval: 60s
        scrape_timeout: 15s
        params:
          module: [http_reachable]
        static_configs:
          - targets: [http://10.99.0.1:9180/, http://10.99.0.4:9180/]
            labels: {checker: ro-failover}
          - targets: [http://10.99.0.1:9181/, http://10.99.0.4:9181/, http://10.99.0.2:9181/]
            labels: {checker: nameservers}
          - targets: [http://10.99.0.4:9182/, http://10.99.0.2:9182/]
            labels: {checker: element-front}
          - targets: [http://10.99.0.1:9190/health, http://10.99.0.4:9190/health]
            labels: {checker: alert-relay}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115

      # The public status page (radunenu.com/status/, through status-api, #151):
      # every Ingress with a homepage name, probed under that name, so services
      # appear and disappear with their deployments. The annotation
      # radunenu.com/status: hidden keeps one off the page.
      - job_name: status-ingress
        metrics_path: /probe
        scrape_interval: 60s
        scrape_timeout: 15s
        params:
          module: [http_reachable]
        kubernetes_sd_configs:
          - role: ingress
        relabel_configs:
          - source_labels: [__meta_kubernetes_ingress_annotation_gethomepage_dev_name]
            regex: .+
            action: keep
          - source_labels: [__meta_kubernetes_ingress_annotation_radunenu_com_status]
            regex: hidden
            action: drop
          # www. names are the same site twice.
          - source_labels: [__address__]
            regex: www\..*
            action: drop
          - source_labels: [__meta_kubernetes_ingress_scheme, __address__, __meta_kubernetes_ingress_path]
            regex: (.+);(.+);(.+)
            replacement: ${1}://${2}${3}
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - source_labels: [__meta_kubernetes_ingress_annotation_gethomepage_dev_name]
            target_label: status_name
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115

      # The rest of the status page: what has no Ingress with a homepage name
      # (the old APIs' endpoints, the Matrix front ends on hetzy).
      - job_name: status-extra
        metrics_path: /probe
        scrape_interval: 60s
        scrape_timeout: 15s
        params:
          module: [http_reachable]
        static_configs:
          - targets: [https://kronorite.com]
            labels: {status_name: Kronorite.com}
          - targets: [https://news.kronorite.com/news.php]
            labels: {status_name: "Legacy API v1 - Kronorite News"}
          - targets: [https://stats.kronorite.com/mazegame/leaderboard.php]
            labels: {status_name: "Legacy API v2 - Quickmaze"}
          - targets: [https://stats.kronorite.com/cowo/leaderboard.php]
            labels: {status_name: "Legacy API v2 - Cowo Bot"}
          - targets: [https://stats.kronorite.com/cowo-igad/leaderboard.php]
            labels: {status_name: "Legacy API v2 - Cowo IGAD Bot"}
          - targets: [https://stats.kronorite.com/polyspace/leaderboard.php]
            labels: {status_name: "Legacy API v2 - Polyspace"}
          - targets: [https://stats.kronorite.com/vtol/2/leaderboard.php]
            labels: {status_name: "Legacy API v2.5 - VTOL"}
          - targets: [https://stats.kronorite.com/vtol/1/leaderboard.php]
            labels: {status_name: "Legacy API v2.5 - VTOL (Divided Skies)"}
          - targets: [https://api.byradu.com/dicekatana/leaderboard.php]
            labels: {status_name: "Legacy API v3 - Dice Katana"}
          - targets: [https://api.byradu.com/fsp/downloads/latest.php]
            labels: {status_name: "Legacy API v3 - Feedback Survey Plugin"}
          - targets: [https://api-old.radunenu.com/health-check.html]
            labels: {status_name: Old Legacy API}
          - targets: [https://nuke.zip]
            labels: {status_name: "Matrix (nuke.zip)"}
          - targets: [https://a.nuke.zip/livekit/sfu/]
            labels: {status_name: Element Call stack}
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox-exporter.monitoring.svc:9115

      # The edge's HAProxy: can it still reach Traefik in RO and DK?
      - job_name: edge-haproxy
        static_configs:
          - targets: [100.64.0.9:8404]
            labels:
              host: edge
              site: edge

      # comin on each NixOS server (dotfiles modules/nixos/comin.nix).
      - job_name: comin
        static_configs:
          - targets: [100.64.0.1:4243]
            labels: { host: fuji }
          - targets: [100.64.0.2:4243]
            labels: { host: mixi }
          - targets: [100.64.0.4:4243]
            labels: { host: thinkcentre }
          - targets: [100.64.0.8:4243]
            labels: { host: minima-vm }
          - targets: [100.64.0.9:4243]
            labels: { host: edge }

      # Nebula on each server (dotfiles modules/nixos/nebula-mesh.nix), scraped
      # over the mesh itself: a host that can't be reached there is down here.
      - job_name: nebula
        static_configs:
          - targets: [10.99.0.1:8101]
            labels: { host: edge }
          - targets: [10.99.0.2:8101]
            labels: { host: fuji }
          - targets: [10.99.0.3:8101]
            labels: { host: thinkcentre }
          - targets: [10.99.0.4:8101]
            labels: { host: mixi }
          - targets: [10.99.0.5:8101]
            labels: { host: minima }

      - job_name: cadvisor
        static_configs:
          - targets: [100.64.0.5:9101]
            labels:
              host: hetzner
              site: hetzner
              role: app-host
              os: linux

      - job_name: http-servers
        static_configs:
          - targets: [100.64.0.5:9102]
            labels:
              host: hetzner
              site: hetzner
              role: app-host
              os: linux
              service: nginx
              webserver: nginx

      - job_name: synapse
        metrics_path: /synapse/metrics
        static_configs:
          - targets: [100.64.0.5:9103]
            labels:
              host: hetzner
              site: hetzner
              role: matrix
              service: synapse
              stack: matrix
              os: linux

      - job_name: livekit
        metrics_path: /livekit/metrics
        static_configs:
          - targets: [100.64.0.5:9103]
            labels:
              host: livekit
              site: external
              role: rtc
              os: linux
              service: livekit

      - job_name: livekit-quality
        metrics_path: /livekit-quality/metrics
        static_configs:
          - targets: [100.64.0.5:9103]
            labels:
              host: livekit
              site: external
              role: rtc
              os: linux
              service: livekit-quality

      - job_name: node-exporter-hetzner
        static_configs:
          - targets: [100.64.0.5:9100]
            labels:
              host: hetzner
              site: hetzner
              role: app-host
              os: linux
        relabel_configs:
          - target_label: job
            replacement: node-exporter

  platform.rules: |
    groups:
      - name: kubernetes-container-resources
        interval: 30s
        rules:
          - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
            expr: |
              sum by (node, namespace, pod, container) (
                rate(container_cpu_usage_seconds_total{job="kubelet-cadvisor", namespace!="", pod!="", container!="", container!="POD"}[5m])
              )
          - record: node_namespace_pod_container:container_memory_working_set_bytes:max
            expr: |
              max by (node, namespace, pod, container) (
                container_memory_working_set_bytes{job="kubelet-cadvisor", namespace!="", pod!="", container!="", container!="POD"}
              )

      - name: kubernetes-workload-owners
        interval: 30s
        rules:
          - record: namespace_workload_pod:kube_pod_owner:relabel
            labels:
              workload_type: deployment
            expr: |
              max by (namespace, workload, pod) (
                label_replace(
                  label_replace(
                    kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"},
                    "replicaset", "$1", "owner_name", "(.*)"
                  )
                  * on (namespace, replicaset) group_left(owner_name)
                    topk by (namespace, replicaset) (
                      1,
                      max by (namespace, replicaset, owner_name) (
                        kube_replicaset_owner{job="kube-state-metrics", owner_kind="Deployment"}
                      )
                    ),
                  "workload", "$1", "owner_name", "(.*)"
                )
              )
          - record: namespace_workload_pod:kube_pod_owner:relabel
            labels:
              workload_type: replicaset
            expr: |
              max by (namespace, workload, pod) (
                label_replace(
                  label_replace(
                    kube_pod_owner{job="kube-state-metrics", owner_kind="ReplicaSet"},
                    "replicaset", "$1", "owner_name", "(.*)"
                  )
                  * on (namespace, replicaset) group_left(owner_name)
                    topk by (namespace, replicaset) (
                      1,
                      max by (namespace, replicaset, owner_name) (
                        kube_replicaset_owner{job="kube-state-metrics", owner_kind=""}
                      )
                    ),
                  "workload", "$1", "replicaset", "(.*)"
                )
              )
          - record: namespace_workload_pod:kube_pod_owner:relabel
            labels:
              workload_type: daemonset
            expr: |
              max by (namespace, workload, pod) (
                label_replace(
                  kube_pod_owner{job="kube-state-metrics", owner_kind="DaemonSet"},
                  "workload", "$1", "owner_name", "(.*)"
                )
              )
          - record: namespace_workload_pod:kube_pod_owner:relabel
            labels:
              workload_type: statefulset
            expr: |
              max by (namespace, workload, pod) (
                label_replace(
                  kube_pod_owner{job="kube-state-metrics", owner_kind="StatefulSet"},
                  "workload", "$1", "owner_name", "(.*)"
                )
              )
          - record: namespace_workload_pod:kube_pod_owner:relabel
            labels:
              workload_type: job
            expr: |
              max by (namespace, workload, pod) (
                label_replace(
                  kube_pod_owner{job="kube-state-metrics", owner_kind="Job"},
                  "workload", "$1", "owner_name", "(.*)"
                )
              )
          - record: namespace_workload_pod:kube_pod_owner:relabel
            labels:
              workload_type: staticpod
            expr: |
              max by (namespace, workload, pod) (
                label_replace(
                  kube_pod_owner{job="kube-state-metrics", owner_kind="Node"},
                  "workload", "$1", "pod", "(.+)"
                )
              )
          - record: namespace_workload_pod:kube_pod_owner:relabel
            labels:
              workload_type: barepod
            expr: |
              max by (namespace, workload, pod) (
                label_replace(
                  kube_pod_owner{job="kube-state-metrics", owner_kind="", owner_name=""},
                  "workload", "$1", "pod", "(.+)"
                )
              )

      - name: kubernetes-workload-resources
        interval: 30s
        rules:
          - record: namespace_workload:container_cpu_usage_seconds_total:sum_rate5m
            expr: |
              sum by (namespace, workload, workload_type) (
                node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
                * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
              )
          - record: namespace_workload:container_memory_working_set_bytes:sum
            expr: |
              sum by (namespace, workload, workload_type) (
                node_namespace_pod_container:container_memory_working_set_bytes:max
                * on (namespace, pod) group_left(workload, workload_type)
                  namespace_workload_pod:kube_pod_owner:relabel
              )

      - name: homelab-actionable-alerts
        rules:
          # Always firing. Alertmanager sends it to healthchecks.io every minute;
          # if it stops, the alerting pipeline itself is broken.
          - alert: Watchdog
            expr: vector(1)
            labels:
              severity: none
            annotations:
              summary: The alerting pipeline is working
          - alert: KubernetesNodeUnavailable
            expr: kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true"} == 0
            for: 10m
            labels:
              severity: critical
              # Repeats on the phone until acknowledged (docs/ha/alerting.md).
              page: "true"
            annotations:
              summary: Kubernetes node {{ $labels.node }} is unavailable
              description: The node has not reported Ready for at least ten minutes.
          - alert: PrometheusTargetDown
            expr: up{job=~"prometheus|grafana|kubernetes-apiserver|kube-state-metrics|node-exporter|kubelet|kubelet-cadvisor|kubernetes-services"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Prometheus target {{ $labels.job }}/{{ $labels.instance }} is down
              description: A core scrape target has failed continuously for ten minutes.
          - alert: KubernetesDeploymentReplicasUnavailable
            expr: kube_deployment_spec_replicas{job="kube-state-metrics"} > kube_deployment_status_replicas_available{job="kube-state-metrics"}
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas
              description: Available replicas have remained below desired replicas for fifteen minutes.
          - alert: KubernetesStatefulSetReplicasUnavailable
            expr: kube_statefulset_replicas{job="kube-state-metrics"} > kube_statefulset_status_replicas_ready{job="kube-state-metrics"}
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has unavailable replicas
              description: Ready replicas have remained below desired replicas for fifteen minutes.
          - alert: KubernetesDaemonSetPodsUnavailable
            expr: kube_daemonset_status_number_unavailable{job="kube-state-metrics"} > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has unavailable pods
              description: One or more desired DaemonSet pods have been unavailable for fifteen minutes.
          - alert: KubernetesPodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{job="kube-state-metrics", reason="CrashLoopBackOff"}[5m]) >= 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is crash looping
              description: The container has remained in CrashLoopBackOff for fifteen minutes.
          - alert: KubernetesPodUnschedulable
            expr: max_over_time(kube_pod_status_unschedulable{job="kube-state-metrics"}[10m]) == 1
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot be scheduled
              description: Kubernetes has been unable to schedule this pod for fifteen minutes.
          - alert: NodeRootFilesystemCriticallyLow
            expr: |
              node_filesystem_avail_bytes{job="node-exporter", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{job="node-exporter", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"} < 0.08
              and on (node, device, mountpoint)
              node_filesystem_readonly{job="node-exporter", mountpoint="/", fstype!~"tmpfs|overlay|squashfs"} == 0
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Root filesystem on {{ $labels.node }} is critically low
              description: Less than 8% of the root filesystem has been available for fifteen minutes.
          # The edge passes traffic to Traefik in RO (fuji) and DK (thinkcentre).
          # If a site's path is down, failover to it would go nowhere.
          - alert: EdgeBackendDown
            expr: haproxy_server_status{job="edge-haproxy", proxy="traefik-https", state="UP"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "The edge can't reach Traefik on {{ $labels.server }}"
              description: HAProxy's health check for this site has been failing for five minutes.
          - alert: EdgeMetricsUnreachable
            expr: up{job="edge-haproxy"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Prometheus can't reach the edge's HAProxy
              description: Either the edge or the tailnet path to it is down.
          # comin deploys the dotfiles repo to the NixOS servers. A failure means
          # a host stays on its old config while main has moved on.
          - alert: CominDeploymentFailed
            expr: comin_last_deployment_failed == 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "comin couldn't switch {{ $labels.host }} to the latest config"
              description: Check `comin status` and `journalctl -u comin` on the host.
          - alert: CominBuildFailed
            expr: comin_last_build_failed == 1 or comin_last_eval_failed == 1
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "main doesn't build for {{ $labels.host }}"
              description: The host keeps running its previous config until a fixed commit lands.
          - alert: CominFetchFailing
            expr: comin_last_fetch_failed == 1
            for: 2h
            labels:
              severity: warning
            annotations:
              summary: "comin on {{ $labels.host }} can't fetch the dotfiles repo"
              description: No new config reaches this host until fetching works again.
          # Fetching that stopped without failing: the thinkcentre's comin went
          # quiet after the clock jumped back on its first NixOS boot (2026-10-05).
          - alert: CominNotFetching
            expr: sum by (host) (increase(comin_fetch_count[1h])) == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "comin on {{ $labels.host }} hasn't fetched in over an hour"
              description: Restart it (`systemctl restart comin`); comin-unstick should do that by itself.
          # etcd across the three sites (#49, #25).
          - alert: EtcdMemberDown
            expr: up{job="etcd"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "etcd on {{ $labels.member }} doesn't answer"
              description: The cluster still has its majority with the other two; one more gone and the API stops.
          - alert: EtcdNoLeader
            expr: etcd_server_has_leader{job="etcd"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "etcd on {{ $labels.member }} has no leader"
              description: Cut off from the majority, or the majority is gone.
          - alert: EtcdFrequentLeaderChanges
            expr: increase(etcd_server_leader_changes_seen_total{job="etcd"}[1h]) > 4
            labels:
              severity: warning
            annotations:
              summary: "etcd changed leaders {{ $value | humanize }} times in an hour ({{ $labels.member }})"
              description: Usually the links between the sites; see the etcd timeouts (#25).
          - alert: EtcdSlowDisk
            expr: histogram_quantile(0.99, rate(etcd_disk_wal_fsync_duration_seconds_bucket{job="etcd"}[10m])) > 0.5
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "etcd's disk on {{ $labels.member }} is slow ({{ $value | humanizeDuration }} at the 99th percentile)"
              description: etcd waits for every write to reach the disk; slow disks cause leader changes.

          # Site failover (dotfiles site-failover, #49): each service runs on
          # exactly one of fuji and the thinkcentre.
          - alert: SiteFailoverServiceNotRunning
            expr: sum by (service) (site_failover_active) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service }} runs on neither fuji nor the thinkcentre"
              description: No node holds its label, or the one that does can't run it (cluster lost, folder missing). docs/ha/runbooks/site-failover.md
          - alert: SiteFailoverServiceTwice
            expr: sum by (service) (site_failover_active) > 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.service }} runs on both fuji and the thinkcentre"
              description: Should never happen (the fence and the label). Check the labels and stop one by hand.
          - alert: SiteFailoverMoved
            expr: site_failover_active == 1 and changes(site_failover_active[15m]) > 0
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.service }} moved to {{ $labels.node }}"
              description: Its node or site went away and the other one took over on the last copy. It stays there; the old node is the standby once it's back.
          - alert: SiteFailoverClusterLost
            expr: site_failover_cluster_reachable == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.node }} can't reach the cluster"
              description: Its services with files are fenced (stopped) there; the other site takes them over.

          # Replicated Postgres (CNPG, #49).
          - alert: PostgresInstanceMissing
            expr: count by (namespace, cnpg_cluster) (cnpg_collector_up == 1) < 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.cnpg_cluster }} has only one Postgres instance up"
              description: The database runs without its copy in the other site; a second failure would take it down.
          - alert: PostgresReplicationLag
            expr: max by (namespace, cnpg_cluster) (cnpg_pg_replication_lag) > 300
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.cnpg_cluster }}'s replica is {{ $value | humanizeDuration }} behind"
              description: A failover now would lose that much.
          - alert: PostgresPrimarySwitched
            expr: changes(cnpg_pg_replication_in_recovery[15m]) > 0 and cnpg_pg_replication_in_recovery == 0
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.cnpg_cluster }}: {{ $labels.pod }} is the primary now"
              description: CNPG promoted the replica (its site or node went away, or a switchover). Nothing to do if that was expected.

          # Copies of service folders to the other site (dotfiles standby-copy,
          # #142). Every 10 minutes normally; a stale copy means a failover
          # would lose more than that.
          - alert: StandbyCopyStale
            expr: time() - standby_copy_last_success_timestamp_seconds > 3600
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Standby copy {{ $labels.copy }} to {{ $labels.to }} is over an hour old"
              description: Check `journalctl -u standby-copy-{{ $labels.copy }}` on the sending host.
          # The servers' own overlay (dotfiles lib/nebula.nix, #141). Scraped from
          # fuji over the mesh, so this also means fuji can't reach the host there.
          - alert: NebulaHostUnreachable
            expr: up{job="nebula"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.host }} isn't reachable over Nebula"
              description: Check `systemctl status nebula@mesh` on the host, and whether fuji or the edge (the lighthouses) are up.
          - alert: CominUnreachable
            expr: up{job="comin"} == 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus can't reach comin on {{ $labels.host }}"
              description: Either comin stopped, or the host or the tailnet path to it is down.
          # Certificates from cert-manager. Renewal normally happens 30 days
          # before expiry, so 14 days left means renewal has been failing.
          - alert: CertificateExpiringSoon
            expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 86400
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in less than 14 days"
              description: cert-manager hasn't renewed it. Check the Certificate and its CertificateRequest.
          - alert: CertificateNotReady
            expr: certmanager_certificate_ready_status{condition="False"} == 1
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready"
              description: The certificate has been failing to issue or renew for an hour.
          # Certificates the blackbox probes see, including ones outside cert-manager.
          - alert: ProbedCertificateExpiringSoon
            expr: probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 7 * 86400
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "The certificate of {{ $labels.instance }} expires in less than 7 days"
              description: Seen by the in-cluster blackbox probe.
          # Early warning, so a filling disk gets noticed days before it becomes
          # critical (thinkcentre's 31 GB root reached 92% unnoticed, 2026-10-02).
          - alert: NodeFilesystemFillingUp
            expr: |
              node_filesystem_avail_bytes{job="node-exporter", mountpoint=~"/|/boot|/boot/efi", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_size_bytes{job="node-exporter", mountpoint=~"/|/boot|/boot/efi", fstype!~"tmpfs|overlay|squashfs"} < 0.20
              and on (node, device, mountpoint)
              node_filesystem_readonly{job="node-exporter", mountpoint=~"/|/boot|/boot/efi", fstype!~"tmpfs|overlay|squashfs"} == 0
            for: 30m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.mountpoint }} on {{ $labels.node }} is over 80% full"
              description: Less than 20% has been free for thirty minutes.
          # Send uploads (up to 50 GiB each, kept up to 14 days) share this disk
          # with Gitea repositories and /home/main/storage.
          - alert: ThinkcentreStorageDiskLow
            expr: |
              node_filesystem_avail_bytes{job="node-exporter", node="thinkcentre", mountpoint="/home/main/storage"} < 250 * 1024 ^ 3
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: The 4 TB storage disk on thinkcentre has less than 250 GiB free
              description: Check /home/main/storage/send-uploads; Send uploads expire within 14 days.
          # The public probes only see that the page loads; Element Web loaded its
          # page while half its files 404'd on 2026-10-03. element-web-check
          # loads everything every 10 minutes; three failed runs in a row alert.
          - alert: ElementWebBroken
            expr: time() - kube_cronjob_status_last_successful_time{namespace="element-web", cronjob="element-web-check"} > 1800
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Element Web doesn't load completely
              description: element-web-check hasn't passed for 30 minutes. Its job logs list the files that failed. Two replicas on different builds is the usual cause; restarting the deployment fixes that.
          # Scheduled jobs: the latest run of a CronJob failed (or none has
          # ever succeeded), it isn't running now, and no later run has
          # fixed it. Old failed Jobs kept in the history don't count, only
          # the current state.
          - alert: CronJobFailed
            expr: |
              (
                (kube_cronjob_status_last_schedule_time > kube_cronjob_status_last_successful_time)
                or
                (kube_cronjob_status_last_schedule_time unless on (namespace, cronjob) kube_cronjob_status_last_successful_time)
              )
              and on (namespace, cronjob) (kube_cronjob_status_active == 0)
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Scheduled job {{ $labels.namespace }}/{{ $labels.cronjob }} failed its last run"
              description: Its latest run didn't succeed and nothing is running now. The failed Job's pod log says why (kubectl -n {{ $labels.namespace }} get jobs, then logs of the newest one).
          # Jobs started by hand or by other tools, not by a CronJob.
          - alert: JobFailed
            expr: kube_job_status_failed > 0 unless on (namespace, job_name) kube_job_owner{owner_kind="CronJob"}
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"
              description: A one-off Job failed. Read its pod's log, fix and rerun it, or delete the Job once it no longer matters.
          - alert: HACheckerDown
            expr: probe_success{job="ha-checkers"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.checker }} at {{ $labels.instance }} doesn't answer"
              description: A failover checker or alert relay is down, so that switch (or that way out for alerts) won't happen when it's needed. Check its service with systemctl and journalctl on that host.
          - alert: PublicEndpointProbeFailed
            expr: probe_success{job="blackbox-http"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Public endpoint {{ $labels.instance }} is unreachable from Fuji
              description: The in-cluster HTTP/TLS probe has failed for five minutes.
  synapse-v2.rules: |
    groups:
      - name: synapse
        rules:
          - record: synapse_federation_client_sent
            labels: {type: EDU}
            expr: synapse_federation_client_sent_edus_total + 0
          - record: synapse_federation_client_sent
            labels: {type: PDU}
            expr: synapse_federation_client_sent_pdu_destinations_count_total + 0
          - record: synapse_federation_client_sent
            labels: {type: Query}
            expr: sum(synapse_federation_client_sent_queries) by (job)
          - record: synapse_federation_server_received
            labels: {type: EDU}
            expr: synapse_federation_server_received_edus_total + 0
          - record: synapse_federation_server_received
            labels: {type: PDU}
            expr: synapse_federation_server_received_pdus_total + 0
          - record: synapse_federation_server_received
            labels: {type: Query}
            expr: sum(synapse_federation_server_received_queries) by (job)
          - record: synapse_federation_transaction_queue_pending
            labels: {type: EDU}
            expr: synapse_federation_transaction_queue_pending_edus + 0
          - record: synapse_federation_transaction_queue_pending
            labels: {type: PDU}
            expr: synapse_federation_transaction_queue_pending_pdus + 0
