          "pluginVersion": "12.4.1",
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "avg(kube_node_status_condition{job=\"kube-state-metrics\",condition=\"Ready\",status=\"true\"})",
              "legendFormat": "Node Readiness",
              "range": false,
              "refId": "A",
              "instant": true
