          "panels": [],
          "title": "Immediate health",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Share of Kubernetes nodes reporting Ready; 100% is healthy.",
