apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-tailnet-proxy-config
  namespace: monitoring
data:
  nginx.conf: |
    events {}

    http {
      server {
        listen 100.64.0.1:3101;
        server_name _;

        location = /loki/api/v1/push {
          allow 100.64.0.4;
          allow 100.64.0.5;
          deny all;

          proxy_pass http://loki.monitoring.svc:3100;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
          return 404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-tailnet-proxy
  namespace: monitoring
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki-tailnet-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki-tailnet-proxy
    spec:
      priorityClassName: service
      nodeSelector:
        kubernetes.io/hostname: fuji
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nginx
          image: nginx:alpine@sha256:fed7e14be83cbd2661a75cdc5b872d936cf155d46c327084d30b8df19ae88d72
          ports:
            - name: loki-push
              containerPort: 3101
              hostPort: 3101
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: loki-tailnet-proxy-config
