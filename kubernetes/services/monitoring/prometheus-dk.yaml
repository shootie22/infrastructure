# A second Prometheus, on the thinkcentre (#148): same config and rules as
# the one on fuji, so alerts still go out when RO is down. Both send to both
# Alertmanagers, which send each alert once. Short history (3 days); Grafana
# reads the one on fuji. Its own label, so the `prometheus` Service never
# mixes the two.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus-dk
  namespace: monitoring
spec:
  serviceName: prometheus-dk
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-dk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-dk
        # Both Prometheuses, for prometheus-local (services.yaml).
        monitoring.radunenu.com/prometheus: "true"
    spec:
      priorityClassName: platform-critical
      serviceAccountName: prometheus
      nodeSelector:
        kubernetes.io/hostname: thinkcentre
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=3d
            - --web.listen-address=0.0.0.0:9090
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 200m
              memory: 1792Mi
            limits:
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
        - name: config-reloader
          image: quay.io/prometheus-operator/prometheus-config-reloader:v0.94.2@sha256:a1897c67478bc23434534e91ad3855280771196b1daf17144db9dbcb655bef71
          args:
            - --watched-dir=/etc/prometheus
            - --reload-url=http://127.0.0.1:9090/-/reload
            - --listen-address=:8080
          ports:
            - name: reloader
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: prometheus-config
            items:
              - key: prometheus.yml
                path: prometheus.yml
              - key: platform.rules
                path: rules/platform.rules
              - key: synapse-v2.rules
                path: rules/synapse-v2.rules
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-dk
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-dk
spec:
  selector:
    app.kubernetes.io/name: prometheus-dk
  ports:
    - name: http
      port: 9090
      targetPort: http
