# The status page's API (#151), in place of Pinga: radunenu.com's stats
# updater reads it like it read Pinga, and it answers from Prometheus's
# status probes (prometheus-configmap.yaml, jobs status-ingress and
# status-extra). Two copies, one per site.
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-api
  namespace: monitoring
data:
  status-api.py: |
    """The status page's API (#151), in place of Pinga.

    radunenu.com's stats updater asks for two things, as it did of Pinga:
      GET /api/v1/services?compact=1          every service, its last status
      GET /api/v1/services/<id>/checks?limit=N its recent checks, newest first
    With &full=1 the first also has each service's group and description (the
    homepage annotations), its uptime over 24 hours and 7 days, and its uptime
    and response time for each of the last 24 hours (hours_start says when the
    first of them began).
    Both come from Prometheus's probes (jobs status-ingress and status-extra),
    so a service appears here as soon as it has an Ingress with a homepage name.
    A service's id is a checksum of its URL, so it stays the same.

    Asks the Prometheus in RO first and the one in DK if that doesn't answer.
    """

    import hmac
    import json
    import os
    import time
    import urllib.parse
    import urllib.request
    import zlib
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    TOKEN = os.environ["STATUS_API_TOKEN"]
    PROMETHEUS = os.environ.get("PROMETHEUS", "http://prometheus.monitoring.svc:9090,http://prometheus-dk.monitoring.svc:9090").split(",")
    JOBS = 'job=~"status-ingress|status-extra"'
    # How long the service takes to answer, without DNS, connecting and the
    # TLS handshake: the probes go out and back through RO's router with a
    # fresh handshake every time, which says more about the path than about
    # the service.
    ANSWER = f'probe_http_duration_seconds{{{JOBS},phase=~"processing|transfer"}}'
    STEP = 60  # the probes' interval


    def query(path, params):
        last = None
        for base in PROMETHEUS:
            try:
                url = f"{base}/api/v1/{path}?{urllib.parse.urlencode(params)}"
                with urllib.request.urlopen(url, timeout=10) as r:
                    body = json.load(r)
                if body.get("status") == "success":
                    return body["data"]["result"]
            except Exception as e:  # the next Prometheus, then give up
                last = e
        raise RuntimeError(f"no Prometheus answered: {last}")


    def service_id(target):
        return zlib.crc32(target.rstrip("/").lower().encode()) & 0x7FFFFFFF


    def iso(ts):
        return datetime.fromtimestamp(float(ts), timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")


    def uptime(window):
        # Share of successful probes, counted over every series of a target
        # (its labels can change, which starts a new series).
        return (f"sum by (instance) (sum_over_time(probe_success{{{JOBS}}}[{window}]))"
                f" / sum by (instance) (count_over_time(probe_success{{{JOBS}}}[{window}]))")


    def by_instance(result):
        return {r["metric"]["instance"]: r for r in result}


    def ratio(r):
        return round(float(r["value"][1]), 5) if r else None


    def hourly(expr, end, scale=1.0, digits=5):
        """expr for each of the last 24 clock hours, the current one last,
        per target. The last hour is the one still going."""
        span = {"start": end - 23 * 3600, "end": end, "step": 3600}
        out = {}
        for r in query("query_range", {"query": expr, **span}):
            values = {round(float(ts)): float(v) for ts, v in r["values"]}
            out[r["metric"]["instance"]] = [
                round(values[t] * scale, digits) if t in values else None
                for t in range(round(end) - 23 * 3600, round(end) + 1, 3600)
            ]
        return out


    def services(full=False):
        up = query("query", {"query": f"probe_success{{{JOBS}}}"})
        took = {r["metric"]["instance"]: r["value"] for r in query("query", {"query": f"sum by (instance) ({ANSWER})"})}
        columns = ["id", "name", "kind", "target", "enabled", "last_status", "last_latency_ms", "last_checked_at"]
        extra = {}
        if full:
            # ?full=1: what the status page shows besides the current status.
            # The DK Prometheus keeps 3 days, so while RO's is away "7 days"
            # is really 3.
            columns += ["group", "description", "uptime_24h", "uptime_7d", "hourly_uptime", "hourly_latency_ms"]
            end = (int(time.time()) // 3600 + 1) * 3600  # the end of the current hour
            day = by_instance(query("query", {"query": uptime("24h")}))
            week = by_instance(query("query", {"query": uptime("7d")}))
            hours_up = hourly(uptime("1h"), end)
            hours_took = hourly(f'sum by (instance) (max by (instance, phase) (avg_over_time({ANSWER}[1h])))',
                                end, scale=1000, digits=0)
            extra["hours_start"] = iso(end - 24 * 3600)
        rows, seen = [], set()
        for r in sorted(up, key=lambda r: r["metric"].get("status_name", "")):
            target = r["metric"]["instance"]
            if target in seen:
                continue
            seen.add(target)
            ts, value = r["value"]
            ok = value == "1"
            latency = round(float(took[target][1]) * 1000) if ok and target in took else None
            row = [service_id(target), r["metric"].get("status_name", target), "http", target, True,
                   "up" if ok else "down", latency, iso(ts)]
            if full:
                row += [r["metric"].get("status_group", ""), r["metric"].get("status_description", ""),
                        ratio(day.get(target)), ratio(week.get(target)),
                        hours_up.get(target, [None] * 24),
                        [None if v is None else int(v) for v in hours_took.get(target, [None] * 24)]]
            rows.append(row)
        return {"columns": columns, "count": len(rows), "rows": rows, **extra}


    def checks(sid, limit):
        targets = [r["metric"]["instance"] for r in query("query", {"query": f"probe_success{{{JOBS}}}"})]
        target = next((t for t in targets if service_id(t) == sid), None)
        if target is None:
            return None
        end = time.time()
        span = {"start": end - STEP * limit, "end": end, "step": STEP}
        sel = f'{{{JOBS},instance="{target}"}}'
        success = query("query_range", {"query": f"max(probe_success{sel})", **span})
        took = query("query_range", {"query": f'sum(probe_http_duration_seconds{{{JOBS},instance="{target}",phase=~"processing|transfer"}})', **span})
        durations = {ts: v for ts, v in (took[0]["values"] if took else [])}
        out = []
        for ts, v in (success[0]["values"] if success else []):
            ok = v == "1"
            out.append({"Status": "up" if ok else "down",
                        "LatencyMS": round(float(durations[ts]) * 1000) if ok and ts in durations else None,
                        "CheckedAt": iso(ts)})
        out.reverse()  # newest first, like Pinga
        return {"checks": out[:limit]}


    class Handler(BaseHTTPRequestHandler):
        def reply(self, code, body):
            data = json.dumps(body).encode()
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            self.wfile.write(data)

        def do_GET(self):
            url = urllib.parse.urlsplit(self.path)
            parts = [p for p in url.path.split("/") if p]
            if parts == ["healthz"]:
                return self.reply(200, {"status": "ok"})
            given = self.headers.get("Authorization", "")
            if not hmac.compare_digest(given.encode(), f"Bearer {TOKEN}".encode()):
                return self.reply(401, {"error": "unauthorized"})
            try:
                if parts == ["api", "v1", "services"]:
                    full = urllib.parse.parse_qs(url.query).get("full", ["0"])[0] == "1"
                    return self.reply(200, services(full))
                if len(parts) == 5 and parts[:3] == ["api", "v1", "services"] and parts[4] == "checks" and parts[3].isdigit():
                    limit = int(urllib.parse.parse_qs(url.query).get("limit", ["16"])[0])
                    result = checks(int(parts[3]), max(1, min(limit, 500)))
                    return self.reply(200, result) if result else self.reply(404, {"error": "no such service"})
            except Exception as e:
                return self.reply(502, {"error": str(e)})
            self.reply(404, {"error": "not found"})

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-api
  namespace: monitoring
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: status-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-api
      annotations:
        # Bump when status-api.py changes.
        config-revision: "3"
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: status-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status-api
          image: docker.io/library/python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          command: [python3, /app/status-api.py]
          envFrom:
            - secretRef: {name: status-api}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
      volumes:
        - name: code
          configMap:
            name: status-api
---
apiVersion: v1
kind: Service
metadata:
  name: status-api
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: status-api
  ports:
    - {name: http, port: 8080, targetPort: http}
