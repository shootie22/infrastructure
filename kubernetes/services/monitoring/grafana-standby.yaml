# The second Grafana, and the empty provisioning it uses instead of the
# dashboard and datasource files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning-none
  namespace: monitoring
data:
  none.yml: |
    apiVersion: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-standby
  namespace: monitoring
spec:
  # The second Grafana (#148): same database, same config, but it doesn't
  # load dashboards or datasources itself (grafana-provisioning-none), it
  # shows what the main one (workloads.yaml) keeps in the database. If the
  # main one is down, everything stays; only changes to dashboards wait.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-standby
  template:
    metadata:
      # Bump when its ConfigMaps change: it only reads them at start.
      annotations:
        config-revision: "2"
      labels:
        app.kubernetes.io/name: grafana-standby
        monitoring.radunenu.com/grafana: "true"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [fuji, thinkcentre]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  monitoring.radunenu.com/grafana: "true"
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      # Start once the database answers, instead of crashing into restart
      # backoff after a failover (as Keycloak did, #159).
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
          command: ["sh", "-c"]
          args:
            - until pg_isready -q -h grafana-db-rw -p 5432 -d grafana; do sleep 2; done
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.4.1@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_SERVER_DOMAIN
              value: mon.radunenu.com
            - name: GF_SERVER_ROOT_URL
              value: https://mon.radunenu.com
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_BASIC_ENABLED
              value: "false"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: Keycloak
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN
              value: "true"
            - name: GF_METRICS_ENABLED
              value: "true"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/observability/platform-overview.json
            - name: GF_DATABASE_TYPE
              value: postgres
            - name: GF_DATABASE_HOST
              value: grafana-db-rw:5432
            - name: GF_DATABASE_NAME
              value: grafana
            - name: GF_DATABASE_SSL_MODE
              value: require
            - name: GF_DATABASE_USER
              valueFrom:
                secretKeyRef: {name: grafana-db-app, key: username}
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: grafana-db-app, key: password}
          envFrom:
            - secretRef:
                name: grafana-auth
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Up to 10 minutes to start: after an upgrade Grafana migrates its
          # database first, and from the site without the primary every
          # statement crosses the WAN. The liveness probe killed it halfway.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provisioning
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        # Only plugins and caches now; the old SQLite file stays in the
        # grafana-data claim (pvc.yaml) for a while, unused.
        - name: data
          emptyDir: {}
        - name: datasources
          configMap:
            name: grafana-provisioning-none
        - name: dashboard-provisioning
          configMap:
            name: grafana-provisioning-none
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboard-edge
                  items:
                    - key: edge.json
                      path: archive/edge.json
              - configMap:
                  name: grafana-dashboard-fleet-overview
                  items:
                    - key: fleet-overview.json
                      path: archive/fleet-overview.json
              - configMap:
                  name: grafana-dashboard-livekit
                  items:
                    - key: livekit.json
                      path: applications/livekit.json
              - configMap:
                  name: grafana-dashboard-logs
                  items:
                    - key: logs.json
                      path: archive/logs.json
              - configMap:
                  name: grafana-dashboard-services
                  items:
                    - key: services.json
                      path: archive/services.json
              - configMap:
                  name: grafana-dashboard-synapse
                  items:
                    - key: synapse.json
                      path: applications/synapse.json
              - configMap:
                  name: grafana-dashboard-platform-overview
                  items:
                    - key: platform-overview.json
                      path: observability/platform-overview.json
              - configMap:
                  name: grafana-dashboard-nodes
                  items:
                    - key: nodes.json
                      path: observability/nodes.json
              - configMap:
                  name: grafana-dashboard-kubernetes-workloads
                  items:
                    - key: kubernetes-workloads.json
                      path: observability/kubernetes-workloads.json
              - configMap:
                  name: grafana-dashboard-pod-drilldown
                  items:
                    - key: pod-drilldown.json
                      path: observability/pod-drilldown.json
              - configMap:
                  name: grafana-dashboard-kubernetes-logs
                  items:
                    - key: kubernetes-logs.json
                      path: observability/kubernetes-logs.json
              - configMap:
                  name: grafana-dashboard-traefik
                  items:
                    - key: traefik.json
                      path: observability/traefik.json
              - configMap:
                  name: grafana-dashboard-observability-stack
                  items:
                    - key: observability-stack.json
                      path: observability/observability-stack.json
