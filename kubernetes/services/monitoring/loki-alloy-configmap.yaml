apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  config.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
    limits_config:
      retention_period: 14d
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "kubernetes_pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex = sys.env("KUBE_NODE_NAME")
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
        separator = ";"
        regex = "([^;]+);.*|;([^;]+)"
        target_label = "app"
        replacement = "$1$2"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.kubernetes_pods.output
      forward_to = [loki.write.default.receiver]
    }

    loki.relabel "auth_journal" {
      forward_to = []

      rule {
        source_labels = ["__journal_syslog_facility"]
        regex         = "4|10"
        action        = "keep"
      }
    }

    loki.source.journal "auth" {
      path          = "/run/log/journal"
      max_age       = "12h"
      relabel_rules = loki.relabel.auth_journal.rules
      labels        = {
        job  = "auth",
        host = sys.env("KUBE_NODE_NAME"),
      }
      forward_to = [loki.write.default.receiver]
    }

    // What explains a host in trouble, for the on-call agent
    // (kubernetes/services/oncall) and Grafana: the kernel's log at notice
    // and worse (the fuji NIC hang of 2026-10-29 was only there), every
    // unit's warnings and errors, and everything the units this setup runs
    // itself write (comin, failover, standby copies, Nebula, the relay):
    // their stdout is priority 6, and it's what says what they did. k3s
    // writes a lot, so of its lines only warnings and errors are kept
    // (loki.process below). NixOS keeps the journal in /var/log/journal.
    loki.relabel "node_journal" {
      forward_to = []

      // Auth goes on its own, above.
      rule {
        source_labels = ["__journal_syslog_facility"]
        regex         = "4|10"
        action        = "drop"
      }
      rule {
        source_labels = ["__journal__systemd_unit"]
        target_label  = "unit"
      }
      // systemd's own lines about a unit ("comin.service: Failed with
      // result 'exit-code'") come from init.scope and name it in UNIT.
      rule {
        source_labels = ["__journal__systemd_unit", "__journal_unit"]
        separator     = ";"
        regex         = "init\\.scope;(.+)"
        target_label  = "unit"
        replacement   = "$1"
      }
      rule {
        source_labels = ["__journal__transport", "unit", "__journal_priority"]
        separator     = ";"
        regex         = "kernel;[^;]*;[0-5]|[^;]*;(k3s|comin|comin-unstick|switch-guard|deploy-gate|site-failover|standby-copy-[^;]*|nebula@[^;]*|alert-relay|failover-checker|front-checker|ns-checker|edge-tunnel)\\.service;[0-6]|[^;]*;[^;]*;[0-4]"
        action        = "keep"
      }
      rule {
        source_labels = ["__journal_priority_keyword"]
        target_label  = "level"
      }
    }

    loki.source.journal "node" {
      path          = "/var/log/journal"
      max_age       = "12h"
      relabel_rules = loki.relabel.node_journal.rules
      labels        = {
        job  = "node-journal",
        host = sys.env("KUBE_NODE_NAME"),
      }
      forward_to = [loki.process.node_journal.receiver]
    }

    // k3s logs every request at info; keep its warnings and errors (logfmt,
    // etcd's JSON, klog's W and E lines).
    loki.process "node_journal" {
      stage.match {
        selector = "{unit=\"k3s.service\"}"

        stage.drop {
          expression = "level=(info|debug|trace)|\"level\":\"(info|debug)\"|^[ID][0-9]{4} "
        }
      }
      forward_to = [loki.write.default.receiver]
    }

    // Both Lokis, fuji's and DK's (#148).
    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
      endpoint {
        url = "http://loki-dk.monitoring.svc:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-events-config
  namespace: monitoring
data:
  config.alloy: |
    loki.source.kubernetes_events "cluster" {
      job_name   = "kubernetes-events"
      log_format = "logfmt"
      forward_to = [loki.write.default.receiver]
    }

    // Both Lokis, fuji's and DK's (#148).
    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
      endpoint {
        url = "http://loki-dk.monitoring.svc:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-exporter-config
  namespace: monitoring
data:
  blackbox.yml: |
    modules:
      http_reachable:
        prober: http
        timeout: 10s
        http:
          method: GET
          valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308]
          follow_redirects: false
          preferred_ip_protocol: ip4
          ip_protocol_fallback: true
