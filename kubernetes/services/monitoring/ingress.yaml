apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Grafana
    gethomepage.dev/icon: grafana.png
    gethomepage.dev/description: Metrics and logs
    gethomepage.dev/weight: "100"
    gethomepage.dev/siteMonitor: http://grafana.monitoring.svc.cluster.local:3000/api/health
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mon.radunenu.com
      secretName: grafana-tls
  rules:
    - host: mon.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
