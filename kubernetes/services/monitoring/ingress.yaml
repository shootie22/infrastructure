apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Grafana
    gethomepage.dev/icon: grafana.png
    gethomepage.dev/description: Metrics and logs
    gethomepage.dev/weight: "100"
    gethomepage.dev/siteMonitor: http://grafana.monitoring.svc.cluster.local:3000/api/health
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mon.yeetus.net
      secretName: grafana-tls
  rules:
    - host: mon.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
# mon.radunenu.com moved to mon.yeetus.net: the old name redirects there
# with the path kept. The new name doesn't match, so it passes straight
# through.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-yeetus
  namespace: monitoring
spec:
  redirectRegex:
    regex: ^https?://mon\.radunenu\.com/(.*)$
    replacement: https://mon.yeetus.net/${1}
    permanent: true
---
# mon.radunenu.com, the old name: redirects to the new one (to-yeetus). No
# homepage annotation, so the status probes only check the new name. Its own
# certificate: grafana-tls only has mon.yeetus.net, and Cloudflare turned
# the old name away (526) when it got that one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-old-name
  namespace: monitoring
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: monitoring-to-yeetus@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mon.radunenu.com
      secretName: grafana-old-tls
  rules:
    - host: mon.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
