# Alertmanager: sends Prometheus alerts to the alert relay on the edge, which
# puts them on the phone (docs/ha/alerting.md). The Watchdog alert, always
# firing, goes to healthchecks.io every minute instead; silence there means
# Prometheus or Alertmanager stopped, and healthchecks.io alerts directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: relay
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: [alertname="Watchdog"]
          receiver: healthchecks
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m

    receivers:
      - name: relay
        webhook_configs:
          # The edge over Nebula, so alerts don't depend on Headscale.
          - url: http://10.99.0.1:9190/alertmanager
            send_resolved: true
          # mixi's standby relay gets everything too, and sends it on only
          # while the edge's doesn't answer (#156).
          - url: http://10.99.0.4:9190/alertmanager
            send_resolved: true
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secret/healthchecks_url
            send_resolved: false
---
# Two, one on fuji and one on the thinkcentre (#148), clustered: both
# Prometheuses send every alert to both, and the cluster sends it once.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  serviceName: alertmanager-peers
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
      annotations:
        config-revision: "3"
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [fuji, thinkcentre]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: alertmanager
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.1@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
            - --cluster.listen-address=0.0.0.0:9094
            - --cluster.advertise-address=$(POD_IP):9094
            - --cluster.peer=alertmanager-0.alertmanager-peers.monitoring.svc:9094
            - --cluster.peer=alertmanager-1.alertmanager-peers.monitoring.svc:9094
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          ports:
            - name: http
              containerPort: 9093
            - name: cluster-tcp
              containerPort: 9094
              protocol: TCP
            - name: cluster-udp
              containerPort: 9094
              protocol: UDP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true
            - name: secret
              mountPath: /etc/alertmanager/secret
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secret
          secret:
            secretName: alertmanager
        # Silences and notification state only; losing them on a restart is fine.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
# Lets the two find each other by name.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager-peers
  namespace: monitoring
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - {name: cluster-tcp, port: 9094, protocol: TCP}
    - {name: cluster-udp, port: 9094, protocol: UDP}
