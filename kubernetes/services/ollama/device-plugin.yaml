# Exposes Minima's GPU render node (Venus: Vulkan over virtio-gpu to the Mac's
# M4) as the schedulable resource devic.es/gpu, so Ollama gets the device
# without running privileged. Only this small plugin needs privileges.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gpu-device-plugin
  namespace: ollama
  labels:
    app.kubernetes.io/name: gpu-device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-device-plugin
    spec:
      # minima, and mixi (the M1's GPU under Asahi, #150).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [minima, mixi]}
      priorityClassName: system-node-critical
      containers:
        - name: plugin
          # squat/generic-device-plugin publishes only commit tags; pin the
          # multi-arch digest (includes arm64).
          image: docker.io/squat/generic-device-plugin@sha256:8dc84958301f054bf72d9753a7a2c9af3d6642a9844b34d1171b3f2cdb4a15f6
          args:
            - --device
            - |
              name: gpu
              groups:
                - paths:
                    - path: /dev/dri/renderD128
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
