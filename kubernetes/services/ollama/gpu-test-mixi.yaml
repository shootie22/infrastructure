# One-off test for #150: does the same image run Ollama on mixi's M1 GPU
# (Asahi, Mesa's Honeykrisp Vulkan driver)? Read the result with
#   kubectl -n ollama logs job/ollama-gpu-test-mixi
# Removed once the replica is planned.
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-gpu-test-mixi
  namespace: ollama
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1200
  ttlSecondsAfterFinished: 172800
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: mixi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: test
          image: git.radunenu.com/radu/ollama-vulkan:v0.34.4-3@sha256:cbe467d4b34be4297a1da9426937f713f5728bf75b51c63284cfab2381bf0d9e
          command: [/bin/sh, -c]
          args:
            - |
              echo "== vulkaninfo"; vulkaninfo --summary 2>&1 | sed -n '/Devices:/,$p' | head -30
              echo "== ollama"; ollama serve > /tmp/serve.log 2>&1 &
              sleep 8
              ollama pull qwen3:0.6b > /dev/null 2>&1 && echo pulled
              ollama run qwen3:0.6b "Say hi in five words." --verbose 2>&1 | tail -12
              echo "== ollama ps"; ollama ps
              echo "== serve log (GPU lines)"; grep -iE "vulkan|gpu|offload|library" /tmp/serve.log | head -20
          env:
            - {name: OLLAMA_MODELS, value: /models}
          resources:
            limits:
              memory: 4Gi
              devic.es/gpu: 1
          volumeMounts:
            - {name: models, mountPath: /models}
      volumes:
        - name: models
          emptyDir: {}
