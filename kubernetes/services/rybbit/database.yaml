# Rybbit's Postgres (accounts and site settings; the events are in
# ClickHouse): one instance in each site (#31). Imported from the old single
# Postgres (postgres in staged.yaml), which stays until the move is checked.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rybbit-pg
  namespace: rybbit
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  bootstrap:
    initdb:
      database: analytics
      owner: rybbit
      import:
        type: microservice
        databases: [analytics]
        source:
          externalCluster: old
  externalClusters:
    - name: old
      connectionParameters:
        host: postgres
        user: rybbit
        dbname: analytics
        sslmode: disable
      password: {name: rybbit-env, key: POSTGRES_PASSWORD}
  storage:
    size: 2Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
---
# Hourly dump into fuji's Borg folder (#32), as for Vaultwarden and Keycloak.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rybbit-pg-dump
  namespace: rybbit
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: fuji
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=rybbit-pg-ro
                  pg_isready -q -h $host || host=rybbit-pg-r
                  pg_dump -h $host -U rybbit -d analytics -Fc -f /backup/rybbit.dump.tmp
                  mv /backup/rybbit.dump.tmp /backup/rybbit.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: rybbit-pg-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/pg-dumps
                type: Directory
