# yeetus-api (source: git.yeetus.net/radu/yeetus, apps/api; it was yippie-api):
# profile pictures for Yeetus Network and Network Admin, set as each user's
# `picture` attribute, and Home's list of services with their status. Served
# under auth.yeetus.net/yeetus/ (and the old /yippie/, ingress.yaml) so the
# account page reaches it without CORS. Its Postgres is yeetus-api-db.yaml; its
# Keycloak client (yeetus-api, both realms) is in realms.yaml, with the secret
# in yeetus-api.sops.yaml and config-cli.sops.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yeetus-api
  namespace: keycloak
spec:
  # One per site; it keeps nothing itself.
  replicas: 2
  selector:
    matchLabels:
      app: yeetus-api
  template:
    metadata:
      labels:
        app: yeetus-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: yeetus-api
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: yeetus-api
          image: git.radunenu.com/radu/yeetus-api:main@sha256:90e8f16aa4c1efe89d2710b393d788eb47881ce8dc2822600828d41856215b0a
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: yeetus-api-db-app, key: uri}
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: ISSUER_BASE
              value: https://auth.yeetus.net
            # network-yippie becomes network-yeetus with the realm rename.
            - name: REALMS
              value: network-yippie,network-admin
            - name: PUBLIC_URL
              value: https://auth.yeetus.net/yeetus
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: yeetus-api-env, key: CLIENT_SECRET}
            # Home's list of services (home-catalog.yaml) and where its up/down comes from.
            - name: CATALOG_FILE
              value: /config/catalog.yaml
            - name: PROMETHEUS
              value: http://prometheus.monitoring.svc:9090,http://prometheus-dk.monitoring.svc:9090
            - name: HOME_ORIGIN
              value: https://yeetus.net,https://hub.yeetus.net,https://hub.radunenu.com
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /yeetus/healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /yeetus/healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: catalog, mountPath: /config, readOnly: true}
      volumes:
        - name: catalog
          configMap:
            name: home-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: yeetus-api
  namespace: keycloak
spec:
  selector:
    app: yeetus-api
  ports:
    - name: http
      port: 8080
      targetPort: http
