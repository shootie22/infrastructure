# Keycloak's Postgres: one instance in each site (#31). Imported on 6 Oct from
# the old single Postgres, removed on 11 Oct (#162).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
  annotations:
    # Where the primary belongs (docs/ha/decisions.md, 2026-10-21): Keycloak has a pod in each site; visitors come in through RO.
    # site-failover switches it back there by itself.
    placement.radunenu.com/home: ro
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  # The hourly dump reads the replica. Without this the primary vacuums away
  # rows the dump is still reading, and the replica cancels it ("conflict
  # with recovery"): every hour while the primaries sat across the WAN after
  # 2026-10-20's failover. Reloads without a restart.
  postgresql:
    parameters:
      hot_standby_feedback: "on"
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  storage:
    size: 2Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
---
# Hourly dump into fuji's Borg folder (#32), as for Vaultwarden.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-db-dump
  namespace: keycloak
spec:
  schedule: "19 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: fuji
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=keycloak-db-ro
                  pg_isready -q -h $host || host=keycloak-db-r
                  pg_dump -h $host -U keycloak -d keycloak -Fc -f /backup/keycloak.dump.tmp
                  mv /backup/keycloak.dump.tmp /backup/keycloak.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: keycloak-db-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/pg-dumps
                type: Directory
