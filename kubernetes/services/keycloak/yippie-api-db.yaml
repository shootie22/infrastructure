# yippie-api's Postgres: profile pictures (and later app passwords). One
# instance in each site, like keycloak-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: yippie-api-db
  namespace: keycloak
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  bootstrap:
    initdb:
      database: yippie
      owner: yippie
  storage:
    size: 1Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
---
# Hourly dump into fuji's Borg folder (#32), as for Keycloak.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: yippie-api-db-dump
  namespace: keycloak
spec:
  schedule: "21 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: fuji
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=yippie-api-db-ro
                  pg_isready -q -h $host || host=yippie-api-db-r
                  pg_dump -h $host -U yippie -d yippie -Fc -f /backup/yippie-api.dump.tmp
                  mv /backup/yippie-api.dump.tmp /backup/yippie-api.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: yippie-api-db-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/pg-dumps
                type: Directory
