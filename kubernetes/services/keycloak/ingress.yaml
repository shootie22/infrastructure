apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Keycloak
    gethomepage.dev/icon: keycloak.png
    gethomepage.dev/description: Identity administration
    gethomepage.dev/weight: "300"
    gethomepage.dev/siteMonitor: http://keycloak.keycloak.svc.cluster.local:9000/health/ready
    traefik.ingress.kubernetes.io/router.middlewares: keycloak-old-realm-name@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.yeetus.net
      # Renewed by cert-manager (certificate.yaml).
      secretName: auth-radunenu-com-le
  rules:
    - host: auth.yeetus.net
      http:
        paths:
          # yeetus-api: profile pictures and Home's list (yeetus-api.yaml),
          # also on its old prefix /yippie/ for now.
          - path: /yeetus/
            pathType: Prefix
            backend:
              service:
                name: yeetus-api
                port:
                  number: 8080
          - path: /yippie/
            pathType: Prefix
            backend:
              service:
                name: yeetus-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
# auth.radunenu.com, the old name: still served as is, so old links, clones
# and apps keep working. No homepage annotation, so the status probes only
# check the new name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-old-name
  namespace: keycloak
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: keycloak-old-realm-name@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.radunenu.com
      secretName: auth-radunenu-com-le
  rules:
    - host: auth.radunenu.com
      http:
        paths:
          # yeetus-api: profile pictures and Home's list (yeetus-api.yaml),
          # also on its old prefix /yippie/ for now.
          - path: /yeetus/
            pathType: Prefix
            backend:
              service:
                name: yeetus-api
                port:
                  number: 8080
          - path: /yippie/
            pathType: Prefix
            backend:
              service:
                name: yeetus-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
# The realm was network-yippie until 11 Oct; old bookmarks (the account page)
# go to its new name. Everything else passes straight through.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: old-realm-name
  namespace: keycloak
spec:
  redirectRegex:
    regex: ^https?://([^/]+)/realms/network-yippie/(.*)$
    replacement: https://${1}/realms/network-yeetus/${2}
    permanent: true
