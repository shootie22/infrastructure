# yeetus-api's Postgres: profile pictures (and later app passwords). One
# instance in each site, like keycloak-db. Started on 11 Oct as a copy of
# yippie-api-db (the name before the rename), which is gone now.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: yeetus-api-db
  namespace: keycloak
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  bootstrap:
    initdb:
      database: yeetus
      owner: yeetus
      # Copied yippie-api-db's database once, at creation. Only read at
      # bootstrap, so the missing source does nothing now.
      import:
        type: microservice
        databases: [yippie]
        source:
          externalCluster: yippie-api-db
  externalClusters:
    - name: yippie-api-db
      connectionParameters:
        host: yippie-api-db-rw
        user: yippie
        dbname: yippie
        sslmode: require
      password:
        name: yippie-api-db-app
        key: password
  storage:
    size: 1Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
---
# Hourly dump into fuji's Borg folder (#32), as for Keycloak.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: yeetus-api-db-dump
  namespace: keycloak
spec:
  schedule: "23 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: fuji
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=yeetus-api-db-ro
                  pg_isready -q -h $host || host=yeetus-api-db-r
                  pg_dump -h $host -U yeetus -d yeetus -Fc -f /backup/yeetus-api.dump.tmp
                  mv /backup/yeetus-api.dump.tmp /backup/yeetus-api.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: yeetus-api-db-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/pg-dumps
                type: Directory
