# Keycloak's realms as code (#56), applied by config-cli.yaml every 10
# minutes. Only what's written here is managed: a realm setting, client or
# group left out stays as it was made in the admin UI. Nothing is ever
# deleted: take something out of here, then delete it in the admin UI.
#
# Client secrets don't go here: write $(env:SOME_SECRET) and put SOME_SECRET
# in config-cli.sops.yaml.
#
# Which realm a service goes in: docs/ha/keycloak-sso.md#realms.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realms
  namespace: keycloak
data:
  # Keycloak's own admin realm. Only the admin account and config-cli, never
  # apps or other users. Can't be renamed.
  master.yaml: |
    realm: master
    displayName: Keycloak Admin
    # The admin console's sign-in in the red admin look, like network-admin.
    # If it ever breaks, config-cli (client credentials, no login page) can
    # still set it back.
    loginTheme: yeetus
    emailTheme: yeetus
    # Like network-admin: no "keep me signed in" for the admin console.
    # "Forgot?" stays, master sends email too.
    rememberMe: false
  # Admin tools only I use: Grafana, Hub, Legacy. Access by a role per app.
  network-admin.yaml: |
    realm: network-admin
    displayName: Network Admin
    enabled: true
    # Same pages with a red card, so it never looks like the everyday account.
    loginTheme: yeetus
    accountTheme: yeetus
    emailTheme: yeetus
    rememberMe: false
    # Keycloak's default profile plus `picture`, set by yeetus-api like in
    # network-yeetus. Only I am in this realm, so the rest stays editable.
    attributes:
      userProfileEnabled: "true"
    userProfile:
      attributes:
        - name: username
          displayName: "${username}"
          validations:
            length: {min: 3, max: 255}
            username-prohibited-characters: {}
            up-username-not-idn-homograph: {}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: email
          displayName: "${email}"
          validations:
            email: {}
            length: {max: 255}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: firstName
          displayName: "${firstName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: lastName
          displayName: "${lastName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: picture
          displayName: Picture
          validations:
            length: {max: 2048}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
      groups:
        - name: user-metadata
          displayHeader: User metadata
          displayDescription: Attributes, which refer to user metadata
    clients:
      # yeetus-api.yaml, same as in network-yeetus (same secret).
      - clientId: yeetus-api
        name: yeetus-api
        enabled: true
        publicClient: false
        secret: $(env:YEETUS_API_SECRET)
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
      # kubernetes/services/cubitrix-reports: GlitchTip's own sign-in, for
      # Cubitrix's crash reports. The secret is in
      # cubitrix-reports-client.sops.yaml and, same value, in
      # cubitrix-reports/secret.sops.yaml; scripts/create-cubitrix-reports-secret.sh
      # makes both. Whoever signs in owns it all there, so only this realm.
      - clientId: cubitrix-reports
        name: Cubitrix reports
        description: cubitrix-reports.yeetus.net, Cubitrix's crash reports (GlitchTip)
        enabled: true
        publicClient: false
        secret: $(env:CUBITRIX_REPORTS_OIDC_SECRET)
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://cubitrix-reports.yeetus.net/accounts/oidc/keycloak/login/callback/"]
        webOrigins: ["https://cubitrix-reports.yeetus.net"]
        attributes:
          pkce.code.challenge.method: S256
      # kubernetes/services/legacy: oauth2-proxy in front of legacy.yeetus.net.
      # The secret is in legacy-client.sops.yaml and, same value, in
      # legacy/secret.sops.yaml; scripts/create-legacy-oauth2-secret.sh makes
      # both. The role access is given to my user by hand in the admin UI.
      - clientId: legacy
        name: Legacy
        description: legacy.yeetus.net, the old pages and APIs
        enabled: true
        publicClient: false
        secret: $(env:LEGACY_OAUTH2_SECRET)
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://legacy.yeetus.net/oauth2/callback"]
        webOrigins: ["https://legacy.yeetus.net"]
        attributes:
          pkce.code.challenge.method: S256
        protocolMappers:
          # oauth2-proxy rejects tokens without its own client in aud.
          - name: audience
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: legacy
              id.token.claim: "false"
              access.token.claim: "true"
    roles:
      client:
        legacy:
          - name: access
            description: May open legacy.yeetus.net
    users:
      - username: service-account-yeetus-api
        serviceAccountClientId: yeetus-api
        enabled: true
        clientRoles:
          realm-management: [view-users, manage-users]
  # Everyone else (friends, family, my everyday account) and the services
  # they use. Access by a group per app.
  network-yeetus.yaml: |
    realm: network-yeetus
    displayName: Yeetus Network
    enabled: true
    # Everyone has a short username (the same as on Gitea) and can sign in
    # with it or their email. Apps go by the username, so it isn't the email.
    registrationEmailAsUsername: false
    # Lets admins rename users (Keycloak 26 locks usernames for admins too
    # without it). Users still can't: the profile below allows admins only.
    editUsernameAllowed: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    # The Yeetus login and account pages and emails (git.yeetus.net/radu/yeetus).
    # Need the yeetus-keycloak image; without it Keycloak uses its own pages.
    # The SMTP settings are set in the admin console, not here: config-cli
    # would replace them and drop the password.
    loginTheme: yeetus
    accountTheme: yeetus
    emailTheme: yeetus
    rememberMe: true
    # Email and username: only an admin changes them. Joplin and the email
    # matching in the other apps trust the email Keycloak sends, so letting
    # people edit theirs would let them sign in as someone else
    # (docs/ha/sso-migration.md). The rest is Keycloak's default profile.
    attributes:
      userProfileEnabled: "true"
    userProfile:
      attributes:
        - name: username
          displayName: "${username}"
          validations:
            length: {min: 3, max: 255}
            username-prohibited-characters: {}
            up-username-not-idn-homograph: {}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
        - name: email
          displayName: "${email}"
          validations:
            email: {}
            length: {max: 255}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
        - name: firstName
          displayName: "${firstName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: lastName
          displayName: "${lastName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        # Address of the profile picture, set by yeetus-api when someone
        # uploads one on the account page. The standard `picture` claim.
        - name: picture
          displayName: Picture
          validations:
            length: {max: 2048}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
      groups:
        - name: user-metadata
          displayHeader: User metadata
          displayDescription: Attributes, which refer to user metadata
    clients:
      # Home (kubernetes/services/home): signs people in quietly to show their
      # services first. Public, PKCE; the person's groups go in the ID token.
      # No gate: everyone in the realm may see Home.
      - clientId: home
        name: Home
        description: yeetus.net (Home)
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://yeetus.net/*", "https://hub.yeetus.net/*", "https://hub.radunenu.com/*"]
        webOrigins: ["https://yeetus.net", "https://hub.yeetus.net", "https://hub.radunenu.com"]
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://yeetus.net/*##https://hub.yeetus.net/*##https://hub.radunenu.com/*"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "false"
              userinfo.token.claim: "true"
              introspection.token.claim: "false"
      # yeetus-api.yaml: profile pictures. Only a service account, which may
      # read and change users (to set `picture`).
      - clientId: yeetus-api
        name: yeetus-api
        enabled: true
        publicClient: false
        secret: $(env:YEETUS_API_SECRET)
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
      # Audiobookshelf (books.yeetus.net, #59). Its OIDC settings live in its
      # own web UI (Settings, Authentication), with this client's secret.
      # Behind the gate below: only the audiobooks group gets in.
      - clientId: audiobookshelf
        name: Audiobooks
        description: books.yeetus.net
        enabled: true
        publicClient: false
        secret: $(env:AUDIOBOOKSHELF_SECRET)
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - https://books.yeetus.net/auth/openid/callback
          - https://books.yeetus.net/auth/openid/mobile-redirect
          # Audiobookshelf puts its /audiobookshelf/ prefix in front by default
          # (it serves the same app there), and has no setting for it here.
          - https://books.yeetus.net/audiobookshelf/auth/openid/callback
          - https://books.yeetus.net/audiobookshelf/auth/openid/mobile-redirect
        webOrigins: ["https://books.yeetus.net"]
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://books.yeetus.net/*"
        authenticationFlowBindingOverrides:
          browser: gate audiobookshelf
      # Joplin Server (n.yeetus.net, #231): SAML, since that's what it speaks.
      # It finds the user by the `email` attribute; `displayName` only names
      # an account it creates. Its side is in joplin/staged.yaml. Gated like
      # the others: only the notes group gets in.
      - clientId: joplin
        name: Notes
        description: n.yeetus.net
        protocol: saml
        enabled: true
        frontchannelLogout: true
        redirectUris: ["https://n.yeetus.net/api/saml"]
        attributes:
          saml.assertion.signature: "true"
          saml.server.signature: "true"
          saml.client.signature: "false"
          saml.authnstatement: "true"
          saml_name_id_format: email
          saml.force.name.id.format: "true"
          saml_assertion_consumer_url_post: https://n.yeetus.net/api/saml
          saml.signature.algorithm: RSA_SHA256
        protocolMappers:
          - name: email
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config: {user.attribute: email, attribute.name: email, attribute.nameformat: Basic}
          - name: displayName
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config: {user.attribute: firstName, attribute.name: displayName, attribute.nameformat: Basic}
        authenticationFlowBindingOverrides:
          browser: gate joplin
      # Vaultwarden (vw.yeetus.net, #66). Its side is SSO_* in
      # vaultwarden/staged.yaml. Bitwarden's apps check the access token
      # every 5 minutes, so it lives 10 here (Vaultwarden's own advice).
      # offline_access comes with the realm's optional scopes; listing scopes
      # here would replace the defaults.
      - clientId: vaultwarden
        name: Passwords
        description: vw.yeetus.net
        enabled: true
        publicClient: false
        secret: $(env:VAULTWARDEN_SECRET)
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://vw.yeetus.net/identity/connect/oidc-signin"]
        webOrigins: ["https://vw.yeetus.net"]
        attributes:
          pkce.code.challenge.method: S256
          access.token.lifespan: "600"
        authenticationFlowBindingOverrides:
          browser: gate vaultwarden
      # Matrix (yeetus.net, #139). The client is MAS (matrix/mas.yaml and the
      # provider in matrix/secrets.sops.yaml), which turns the Keycloak
      # username into @username:yeetus.net. The ID at the end of the redirect
      # URI is that provider's (scripts/create-matrix-secrets.sh).
      - clientId: matrix
        name: Matrix
        description: chat.yeetus.net
        enabled: true
        publicClient: false
        secret: $(env:MATRIX_SECRET)
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://account.yeetus.net/upstream/callback/01M4Y0DJAF93XBH0ATM5HJWXKT"]
        webOrigins: ["https://account.yeetus.net"]
        attributes:
          pkce.code.challenge.method: S256
        authenticationFlowBindingOverrides:
          browser: gate matrix
      # Gitea (git.yeetus.net, #61). Its side is the `keycloak` login source,
      # added by an init container in gitea/staged.yaml. Gitea links a first
      # sign-in to the existing account with the same username (then email),
      # so repos, keys and issues stay where they are. The groups claim gives
      # Gitea admin to gitea-admins (and takes it away from everyone else at
      # sign-in). No PKCE: Gitea doesn't send it; the client secret covers
      # the code exchange.
      - clientId: gitea
        name: Git
        description: git.yeetus.net
        enabled: true
        publicClient: false
        secret: $(env:GITEA_OIDC_SECRET)
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://git.yeetus.net/user/oauth2/keycloak/callback"]
        webOrigins: ["https://git.yeetus.net"]
        attributes:
          post.logout.redirect.uris: "https://git.yeetus.net/*"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "false"
              userinfo.token.claim: "true"
              introspection.token.claim: "false"
        authenticationFlowBindingOverrides:
          browser: gate gitea
    roles:
      client:
        audiobookshelf:
          - name: access
            description: May sign in to Audiobookshelf
        joplin:
          - name: access
            description: May sign in to Joplin
        vaultwarden:
          - name: access
            description: May sign in to Vaultwarden
        matrix:
          - name: access
            description: May sign in to Matrix
        gitea:
          - name: access
            description: May sign in to Gitea
    authenticatorConfig:
      - alias: audiobookshelf no access
        config: {condUserRole: audiobookshelf.access, negate: "true"}
      - alias: audiobookshelf deny
        config: {denyErrorMessage: yeetusNoAccess}
      - alias: joplin no access
        config: {condUserRole: joplin.access, negate: "true"}
      - alias: joplin deny
        config: {denyErrorMessage: yeetusNoAccess}
      - alias: vaultwarden no access
        config: {condUserRole: vaultwarden.access, negate: "true"}
      - alias: vaultwarden deny
        config: {denyErrorMessage: yeetusNoAccess}
      - alias: matrix no access
        config: {condUserRole: matrix.access, negate: "true"}
      - alias: matrix deny
        config: {denyErrorMessage: yeetusNoAccess}
      - alias: gitea no access
        config: {condUserRole: gitea.access, negate: "true"}
      - alias: gitea deny
        config: {denyErrorMessage: yeetusNoAccess}
    # Each gated app: Keycloak's browser flow, then "no access role, no entry"
    # (docs/ha/keycloak-sso.md, "Who gets into which app").
    authenticationFlows:
      - alias: gate audiobookshelf
        description: Sign in, then only with audiobookshelf's access role
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - {flowAlias: gate audiobookshelf sign in, requirement: REQUIRED, priority: 10, autheticatorFlow: true}
          - {flowAlias: gate audiobookshelf check, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate audiobookshelf sign in
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-cookie, requirement: ALTERNATIVE, priority: 10}
          - {flowAlias: gate audiobookshelf forms, requirement: ALTERNATIVE, priority: 20, autheticatorFlow: true}
      - alias: gate audiobookshelf forms
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-username-password-form, requirement: REQUIRED, priority: 10}
          - {flowAlias: gate audiobookshelf 2fa, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate audiobookshelf 2fa
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-configured, requirement: REQUIRED, priority: 10}
          - {authenticator: auth-otp-form, requirement: ALTERNATIVE, priority: 20}
      - alias: gate audiobookshelf check
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-role, authenticatorConfig: audiobookshelf no access, requirement: REQUIRED, priority: 10}
          - {authenticator: deny-access-authenticator, authenticatorConfig: audiobookshelf deny, requirement: REQUIRED, priority: 20}
      - alias: gate joplin
        description: Sign in, then only with joplin's access role
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - {flowAlias: gate joplin sign in, requirement: REQUIRED, priority: 10, autheticatorFlow: true}
          - {flowAlias: gate joplin check, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate joplin sign in
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-cookie, requirement: ALTERNATIVE, priority: 10}
          - {flowAlias: gate joplin forms, requirement: ALTERNATIVE, priority: 20, autheticatorFlow: true}
      - alias: gate joplin forms
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-username-password-form, requirement: REQUIRED, priority: 10}
          - {flowAlias: gate joplin 2fa, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate joplin 2fa
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-configured, requirement: REQUIRED, priority: 10}
          - {authenticator: auth-otp-form, requirement: ALTERNATIVE, priority: 20}
      - alias: gate joplin check
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-role, authenticatorConfig: joplin no access, requirement: REQUIRED, priority: 10}
          - {authenticator: deny-access-authenticator, authenticatorConfig: joplin deny, requirement: REQUIRED, priority: 20}
      - alias: gate vaultwarden
        description: Sign in, then only with vaultwarden's access role
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - {flowAlias: gate vaultwarden sign in, requirement: REQUIRED, priority: 10, autheticatorFlow: true}
          - {flowAlias: gate vaultwarden check, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate vaultwarden sign in
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-cookie, requirement: ALTERNATIVE, priority: 10}
          - {flowAlias: gate vaultwarden forms, requirement: ALTERNATIVE, priority: 20, autheticatorFlow: true}
      - alias: gate vaultwarden forms
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-username-password-form, requirement: REQUIRED, priority: 10}
          - {flowAlias: gate vaultwarden 2fa, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate vaultwarden 2fa
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-configured, requirement: REQUIRED, priority: 10}
          - {authenticator: auth-otp-form, requirement: ALTERNATIVE, priority: 20}
      - alias: gate vaultwarden check
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-role, authenticatorConfig: vaultwarden no access, requirement: REQUIRED, priority: 10}
          - {authenticator: deny-access-authenticator, authenticatorConfig: vaultwarden deny, requirement: REQUIRED, priority: 20}
      - alias: gate matrix
        description: Sign in, then only with matrix's access role
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - {flowAlias: gate matrix sign in, requirement: REQUIRED, priority: 10, autheticatorFlow: true}
          - {flowAlias: gate matrix check, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate matrix sign in
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-cookie, requirement: ALTERNATIVE, priority: 10}
          - {flowAlias: gate matrix forms, requirement: ALTERNATIVE, priority: 20, autheticatorFlow: true}
      - alias: gate matrix forms
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-username-password-form, requirement: REQUIRED, priority: 10}
          - {flowAlias: gate matrix 2fa, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate matrix 2fa
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-configured, requirement: REQUIRED, priority: 10}
          - {authenticator: auth-otp-form, requirement: ALTERNATIVE, priority: 20}
      - alias: gate matrix check
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-role, authenticatorConfig: matrix no access, requirement: REQUIRED, priority: 10}
          - {authenticator: deny-access-authenticator, authenticatorConfig: matrix deny, requirement: REQUIRED, priority: 20}
      - alias: gate gitea
        description: Sign in, then only with gitea's access role
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - {flowAlias: gate gitea sign in, requirement: REQUIRED, priority: 10, autheticatorFlow: true}
          - {flowAlias: gate gitea check, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate gitea sign in
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-cookie, requirement: ALTERNATIVE, priority: 10}
          - {flowAlias: gate gitea forms, requirement: ALTERNATIVE, priority: 20, autheticatorFlow: true}
      - alias: gate gitea forms
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-username-password-form, requirement: REQUIRED, priority: 10}
          - {flowAlias: gate gitea 2fa, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate gitea 2fa
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-configured, requirement: REQUIRED, priority: 10}
          - {authenticator: auth-otp-form, requirement: ALTERNATIVE, priority: 20}
      - alias: gate gitea check
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-role, authenticatorConfig: gitea no access, requirement: REQUIRED, priority: 10}
          - {authenticator: deny-access-authenticator, authenticatorConfig: gitea deny, requirement: REQUIRED, priority: 20}
    users:
      - username: service-account-yeetus-api
        serviceAccountClientId: yeetus-api
        enabled: true
        clientRoles:
          realm-management: [view-users, manage-users]
    # One group per app: being in it is what lets someone into that app (its
    # client role `access`, checked by the app's login flow) and what Home
    # shows as Open instead of Ask. Members are added in the admin UI.
    # share-uploaders (Send) was made by hand and stays as it is.
    groups:
      - name: audiobooks
        attributes: {description: [Audiobookshelf]}
        clientRoles:
          audiobookshelf: [access]
      - name: notes
        attributes: {description: [Joplin]}
        clientRoles:
          joplin: [access]
      - name: passwords
        attributes: {description: [Vaultwarden]}
        clientRoles:
          vaultwarden: [access]
      - name: chat
        attributes: {description: [Matrix]}
        clientRoles:
          matrix: [access]
      - name: git
        attributes: {description: [Gitea]}
        clientRoles:
          gitea: [access]
      # Gitea admin (through the groups claim; not an access group).
      - name: gitea-admins
        attributes: {description: [Gitea admins]}
      - name: calendar
        attributes: {description: [Baïkal, with app passwords]}
