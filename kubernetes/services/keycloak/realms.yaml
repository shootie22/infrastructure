# Keycloak's realms as code (#56), applied by config-cli.yaml every 10
# minutes. Only what's written here is managed: a realm setting, client or
# group left out stays as it was made in the admin UI. Nothing is ever
# deleted: take something out of here, then delete it in the admin UI.
#
# Client secrets don't go here: write $(env:SOME_SECRET) and put SOME_SECRET
# in config-cli.sops.yaml.
#
# Which realm a service goes in: docs/ha/keycloak-sso.md#realms.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realms
  namespace: keycloak
data:
  # Keycloak's own admin realm. Only the admin account and config-cli, never
  # apps or other users. Can't be renamed.
  master.yaml: |
    realm: master
    displayName: Keycloak Admin
  # Admin tools only I use: Grafana, Hub. Access by a role per app.
  network-admin.yaml: |
    realm: network-admin
    displayName: Network Admin
    enabled: true
  # Everyone else (friends, family, my everyday account) and the services
  # they use. Access by a group per app.
  network-yippie.yaml: |
    realm: network-yippie
    displayName: Yippie Network
    enabled: true
