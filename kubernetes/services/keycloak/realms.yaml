# Keycloak's realms as code (#56), applied by config-cli.yaml every 10
# minutes. Only what's written here is managed: a realm setting, client or
# group left out stays as it was made in the admin UI. Nothing is ever
# deleted: take something out of here, then delete it in the admin UI.
#
# Client secrets don't go here: write $(env:SOME_SECRET) and put SOME_SECRET
# in config-cli.sops.yaml.
#
# Which realm a service goes in: docs/ha/keycloak-sso.md#realms.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realms
  namespace: keycloak
data:
  # Keycloak's own admin realm. Only the admin account and config-cli, never
  # apps or other users. Can't be renamed.
  master.yaml: |
    realm: master
    displayName: Keycloak Admin
  # Admin tools only I use: Grafana, Hub. Access by a role per app.
  network-admin.yaml: |
    realm: network-admin
    displayName: Network Admin
    enabled: true
    # Same pages with a red card, so it never looks like the everyday account.
    loginTheme: yeetus
    accountTheme: yeetus
    rememberMe: false
    # Keycloak's default profile plus `picture`, set by yeetus-api like in
    # network-yeetus. Only I am in this realm, so the rest stays editable.
    attributes:
      userProfileEnabled: "true"
    userProfile:
      attributes:
        - name: username
          displayName: "${username}"
          validations:
            length: {min: 3, max: 255}
            username-prohibited-characters: {}
            up-username-not-idn-homograph: {}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: email
          displayName: "${email}"
          validations:
            email: {}
            length: {max: 255}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: firstName
          displayName: "${firstName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: lastName
          displayName: "${lastName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: picture
          displayName: Picture
          validations:
            length: {max: 2048}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
      groups:
        - name: user-metadata
          displayHeader: User metadata
          displayDescription: Attributes, which refer to user metadata
    clients:
      # yeetus-api.yaml, same as in network-yeetus (same secret).
      - clientId: yeetus-api
        name: yeetus-api
        enabled: true
        publicClient: false
        secret: $(env:YEETUS_API_SECRET)
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
    users:
      - username: service-account-yeetus-api
        serviceAccountClientId: yeetus-api
        enabled: true
        clientRoles:
          realm-management: [view-users, manage-users]
  # Everyone else (friends, family, my everyday account) and the services
  # they use. Access by a group per app.
  network-yeetus.yaml: |
    realm: network-yeetus
    displayName: Yeetus Network
    enabled: true
    # Everyone has a short username (the same as on Gitea) and can sign in
    # with it or their email. Apps go by the username, so it isn't the email.
    registrationEmailAsUsername: false
    # Lets admins rename users (Keycloak 26 locks usernames for admins too
    # without it). Users still can't: the profile below allows admins only.
    editUsernameAllowed: true
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    # The Yeetus login and account pages (git.yeetus.net/radu/yeetus).
    # Need the yeetus-keycloak image; without it Keycloak uses its own pages.
    loginTheme: yeetus
    accountTheme: yeetus
    rememberMe: true
    # Email and username: only an admin changes them. Joplin and the email
    # matching in the other apps trust the email Keycloak sends, so letting
    # people edit theirs would let them sign in as someone else
    # (docs/ha/sso-migration.md). The rest is Keycloak's default profile.
    attributes:
      userProfileEnabled: "true"
    userProfile:
      attributes:
        - name: username
          displayName: "${username}"
          validations:
            length: {min: 3, max: 255}
            username-prohibited-characters: {}
            up-username-not-idn-homograph: {}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
        - name: email
          displayName: "${email}"
          validations:
            email: {}
            length: {max: 255}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
        - name: firstName
          displayName: "${firstName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        - name: lastName
          displayName: "${lastName}"
          validations:
            length: {max: 255}
            person-name-prohibited-characters: {}
          required: {roles: [user]}
          permissions: {view: [admin, user], edit: [admin, user]}
          multivalued: false
        # Address of the profile picture, set by yeetus-api when someone
        # uploads one on the account page. The standard `picture` claim.
        - name: picture
          displayName: Picture
          validations:
            length: {max: 2048}
          permissions: {view: [admin, user], edit: [admin]}
          multivalued: false
      groups:
        - name: user-metadata
          displayHeader: User metadata
          displayDescription: Attributes, which refer to user metadata
    clients:
      # Home (kubernetes/services/home): signs people in quietly to show their
      # services first. Public, PKCE; the person's groups go in the ID token.
      # No gate: everyone in the realm may see Home.
      - clientId: home
        name: Home
        description: yeetus.net (Home)
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris: ["https://yeetus.net/*", "https://hub.yeetus.net/*", "https://hub.radunenu.com/*"]
        webOrigins: ["https://yeetus.net", "https://hub.yeetus.net", "https://hub.radunenu.com"]
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://yeetus.net/*##https://hub.yeetus.net/*##https://hub.radunenu.com/*"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "false"
              userinfo.token.claim: "true"
              introspection.token.claim: "false"
      # yeetus-api.yaml: profile pictures. Only a service account, which may
      # read and change users (to set `picture`).
      - clientId: yeetus-api
        name: yeetus-api
        enabled: true
        publicClient: false
        secret: $(env:YEETUS_API_SECRET)
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
        serviceAccountsEnabled: true
      # Audiobookshelf (books.yeetus.net, #59). Its OIDC settings live in its
      # own web UI (Settings, Authentication), with this client's secret.
      # Behind the gate below: only the audiobooks group gets in.
      - clientId: audiobookshelf
        name: Audiobooks
        description: books.yeetus.net
        enabled: true
        publicClient: false
        secret: $(env:AUDIOBOOKSHELF_SECRET)
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        redirectUris:
          - https://books.yeetus.net/auth/openid/callback
          - https://books.yeetus.net/auth/openid/mobile-redirect
          # Audiobookshelf puts its /audiobookshelf/ prefix in front by default
          # (it serves the same app there), and has no setting for it here.
          - https://books.yeetus.net/audiobookshelf/auth/openid/callback
          - https://books.yeetus.net/audiobookshelf/auth/openid/mobile-redirect
        webOrigins: ["https://books.yeetus.net"]
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: "https://books.yeetus.net/*"
        authenticationFlowBindingOverrides:
          browser: gate audiobookshelf
      # Joplin Server (n.yeetus.net, #231): SAML, since that's what it speaks.
      # It finds the user by the `email` attribute; `displayName` only names
      # an account it creates. Its side is in joplin/staged.yaml. Gated like
      # the others: only the notes group gets in.
      - clientId: joplin
        name: Notes
        description: n.yeetus.net
        protocol: saml
        enabled: true
        frontchannelLogout: true
        redirectUris: ["https://n.yeetus.net/api/saml"]
        attributes:
          saml.assertion.signature: "true"
          saml.server.signature: "true"
          saml.client.signature: "false"
          saml.authnstatement: "true"
          saml_name_id_format: email
          saml.force.name.id.format: "true"
          saml_assertion_consumer_url_post: https://n.yeetus.net/api/saml
          saml.signature.algorithm: RSA_SHA256
        protocolMappers:
          - name: email
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config: {user.attribute: email, attribute.name: email, attribute.nameformat: Basic}
          - name: displayName
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config: {user.attribute: firstName, attribute.name: displayName, attribute.nameformat: Basic}
        authenticationFlowBindingOverrides:
          browser: gate joplin
    roles:
      client:
        audiobookshelf:
          - name: access
            description: May sign in to Audiobookshelf
        joplin:
          - name: access
            description: May sign in to Joplin
    authenticatorConfig:
      - alias: audiobookshelf no access
        config: {condUserRole: audiobookshelf.access, negate: "true"}
      - alias: audiobookshelf deny
        config: {denyErrorMessage: yeetusNoAccess}
      - alias: joplin no access
        config: {condUserRole: joplin.access, negate: "true"}
      - alias: joplin deny
        config: {denyErrorMessage: yeetusNoAccess}
    # Each gated app: Keycloak's browser flow, then "no access role, no entry"
    # (docs/ha/keycloak-sso.md, "Who gets into which app").
    authenticationFlows:
      - alias: gate audiobookshelf
        description: Sign in, then only with audiobookshelf's access role
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - {flowAlias: gate audiobookshelf sign in, requirement: REQUIRED, priority: 10, autheticatorFlow: true}
          - {flowAlias: gate audiobookshelf check, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate audiobookshelf sign in
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-cookie, requirement: ALTERNATIVE, priority: 10}
          - {flowAlias: gate audiobookshelf forms, requirement: ALTERNATIVE, priority: 20, autheticatorFlow: true}
      - alias: gate audiobookshelf forms
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-username-password-form, requirement: REQUIRED, priority: 10}
          - {flowAlias: gate audiobookshelf 2fa, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate audiobookshelf 2fa
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-configured, requirement: REQUIRED, priority: 10}
          - {authenticator: auth-otp-form, requirement: ALTERNATIVE, priority: 20}
      - alias: gate audiobookshelf check
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-role, authenticatorConfig: audiobookshelf no access, requirement: REQUIRED, priority: 10}
          - {authenticator: deny-access-authenticator, authenticatorConfig: audiobookshelf deny, requirement: REQUIRED, priority: 20}
      - alias: gate joplin
        description: Sign in, then only with joplin's access role
        providerId: basic-flow
        topLevel: true
        builtIn: false
        authenticationExecutions:
          - {flowAlias: gate joplin sign in, requirement: REQUIRED, priority: 10, autheticatorFlow: true}
          - {flowAlias: gate joplin check, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate joplin sign in
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-cookie, requirement: ALTERNATIVE, priority: 10}
          - {flowAlias: gate joplin forms, requirement: ALTERNATIVE, priority: 20, autheticatorFlow: true}
      - alias: gate joplin forms
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: auth-username-password-form, requirement: REQUIRED, priority: 10}
          - {flowAlias: gate joplin 2fa, requirement: CONDITIONAL, priority: 20, autheticatorFlow: true}
      - alias: gate joplin 2fa
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-configured, requirement: REQUIRED, priority: 10}
          - {authenticator: auth-otp-form, requirement: ALTERNATIVE, priority: 20}
      - alias: gate joplin check
        providerId: basic-flow
        topLevel: false
        builtIn: false
        authenticationExecutions:
          - {authenticator: conditional-user-role, authenticatorConfig: joplin no access, requirement: REQUIRED, priority: 10}
          - {authenticator: deny-access-authenticator, authenticatorConfig: joplin deny, requirement: REQUIRED, priority: 20}
    users:
      - username: service-account-yeetus-api
        serviceAccountClientId: yeetus-api
        enabled: true
        clientRoles:
          realm-management: [view-users, manage-users]
    # One group per app: being in it is what lets someone into that app (its
    # client role `access`, checked by the app's login flow) and what Home
    # shows as Open instead of Ask. Members are added in the admin UI.
    # share-uploaders (Send) was made by hand and stays as it is.
    groups:
      - name: audiobooks
        attributes: {description: [Audiobookshelf]}
        clientRoles:
          audiobookshelf: [access]
      - name: notes
        attributes: {description: [Joplin]}
        clientRoles:
          joplin: [access]
      - name: passwords
        attributes: {description: [Vaultwarden]}
      - name: git
        attributes: {description: [Gitea]}
      - name: calendar
        attributes: {description: [Baïkal, with app passwords]}
