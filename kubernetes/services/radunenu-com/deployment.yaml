apiVersion: apps/v1
kind: Deployment
metadata:
  name: radunenu-com
  namespace: radunenu-com
spec:
  replicas: 2
  selector:
    matchLabels:
      app: radunenu-com
  template:
    metadata:
      labels:
        app: radunenu-com
    spec:
      containers:
        # Pinned to the release's version and digest; to roll out a release, change both
        # images to its tag once that tag's build is green. (:latest raced: an older tag's
        # build finishing last overwrote it.)
        - name: website
          image: git.radunenu.com/radu/radunenu.com-minimal:v0.1.58@sha256:3803f99b531b660ae4e311a109a982ada41509143bec0c313a3c411663a480df
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1310
              protocol: TCP
          volumeMounts:
            - name: live
              mountPath: /srv/live
          readinessProbe:
            httpGet:
              path: /
              port: 1310
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 1310
            initialDelaySeconds: 10
            periodSeconds: 30
          # Traefik needs a moment to stop sending requests here (#89).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
        - name: stats-updater
          image: git.radunenu.com/radu/radunenu.com-minimal-stats-updater:v0.1.58@sha256:8f9d78122706fea82605e2b49f136c84ff3f955951eeaf65edf2996b1f6b347c
          imagePullPolicy: IfNotPresent
          env:
            - name: STATUS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: radunenu-com-stats
                  key: STATUS_API_TOKEN
            - name: STATUS_API_BASE
              # status-api in monitoring (#151), from Prometheus; Pinga is retired.
              value: http://status-api.monitoring.svc:8080
            - name: STATUS_REFRESH_INTERVAL
              value: 300s
            - name: STATUS_REQUEST_TIMEOUT
              value: 10s
            - name: OUTPUT_PATH
              value: /data/status-live.json
            - name: FALLBACK_SNAPSHOT_PATH
              value: /app/status-snapshot.json
            - name: LEADERBOARDS_OUTPUT_PATH
              value: /data/leaderboards-live.json
            - name: STATUS_CHART_CURVE
              value: smooth
          volumeMounts:
            - name: live
              mountPath: /data
      volumes:
        - name: live
          emptyDir: {}
      # One copy per site, so either site can serve it alone (#89).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: radunenu-com
  # No third site for a surge pod, so replace one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
