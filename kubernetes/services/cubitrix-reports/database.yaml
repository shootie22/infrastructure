# GlitchTip's Postgres: the reports, which it deletes after 30 days, and its
# queue and cache (no Valkey). One instance in each site.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: glitchtip-pg
  namespace: cubitrix-reports
  annotations:
    # Where the primary belongs (docs/ha/decisions.md, 2026-10-21): GlitchTip
    # runs in RO when it can (deployment.yaml).
    placement.radunenu.com/home: ro
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  # The hourly dump reads the replica; without this the primary vacuums away
  # rows it's still reading (see joplin/database.yaml).
  postgresql:
    parameters:
      hot_standby_feedback: "on"
  bootstrap:
    initdb:
      database: glitchtip
      owner: glitchtip
  storage:
    size: 5Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
---
# Hourly dump into fuji's Borg folder (#32), as for the others.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: glitchtip-pg-dump
  namespace: cubitrix-reports
spec:
  schedule: "29 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: fuji
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=glitchtip-pg-ro
                  pg_isready -q -h $host || host=glitchtip-pg-r
                  pg_dump -h $host -U glitchtip -d glitchtip -Fc -f /backup/glitchtip.dump.tmp
                  mv /backup/glitchtip.dump.tmp /backup/glitchtip.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: glitchtip-pg-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/pg-dumps
                type: Directory
