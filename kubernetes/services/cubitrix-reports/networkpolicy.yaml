# GlitchTip reaches its Postgres and Keycloak (auth.yeetus.net, for the
# sign-in), nothing else: no mail is sent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: glitchtip-egress
  namespace: cubitrix-reports
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: glitchtip-pg
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
