# games-inbox.yeetus.net, all of it behind the games login. Two middlewares,
# in this order: drop any X-Auth-Request-* header the browser sent, then ask
# oauth2-proxy, whose 202 sets the username copyparty goes by
# (authResponseHeaders replaces it). /oauth2 goes to oauth2-proxy itself;
# Traefik ranks routers by rule length, so it wins over /.
#
# Its own name rather than a path on games.yeetus.net, so copyparty's pages
# never share an origin with GameVault's tokens. DNS only, like games, and
# no gethomepage.dev/name, so it stays off the public status page.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity
  namespace: games-inbox
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Preferred-Username: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login
  namespace: games-inbox
spec:
  forwardAuth:
    address: http://oauth2-proxy.games-inbox.svc.cluster.local/
    authResponseHeaders:
      - X-Auth-Request-Preferred-Username
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: copyparty
  namespace: games-inbox
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: games-inbox-strip-identity@kubernetescrd,games-inbox-login@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - games-inbox.yeetus.net
      secretName: games-inbox-yeetus-net-tls
  rules:
    - host: games-inbox.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: copyparty
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: games-inbox
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - games-inbox.yeetus.net
      secretName: games-inbox-yeetus-net-tls
  rules:
    - host: games-inbox.yeetus.net
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
