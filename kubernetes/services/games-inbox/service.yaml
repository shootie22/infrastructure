apiVersion: v1
kind: Service
metadata:
  name: copyparty
  namespace: games-inbox
spec:
  selector:
    app.kubernetes.io/name: copyparty
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: games-inbox
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
