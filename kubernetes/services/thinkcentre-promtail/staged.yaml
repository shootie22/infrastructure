apiVersion: v1
kind: Namespace
metadata:
  name: thinkcentre-promtail
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: thinkcentre-promtail
data:
  promtail.yml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /var/lib/promtail/positions.yml

    clients:
      - url: http://100.64.0.1:3101/loki/api/v1/push
        basic_auth:
          username: "${LOKI_PUSH_USERNAME}"
          password: "${LOKI_PUSH_PASSWORD}"

    scrape_configs:
      - job_name: auth
        journal:
          path: /run/log/journal
          max_age: 12h
          labels:
            job: auth
            host: thinkcentre
        relabel_configs:
          - source_labels: ['__journal_syslog_facility']
            regex: '4|10'
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promtail
  namespace: thinkcentre-promtail
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: thinkcentre
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: promtail
          image: grafana/promtail@sha256:45d54f0ebd7a19acbcd4693a3227d84d27d98abe1dc7ea3068d31d5d02dbe696
          args:
            - -config.file=/etc/promtail/promtail.yml
            - -config.expand-env=true
          env:
            - name: LOKI_PUSH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: promtail-env
                  key: LOKI_PUSH_USERNAME
            - name: LOKI_PUSH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: promtail-env
                  key: LOKI_PUSH_PASSWORD
          ports:
            - name: http
              containerPort: 9080
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/promtail.yml
              subPath: promtail.yml
              readOnly: true
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: journal
              mountPath: /run/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: positions
              mountPath: /var/lib/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: var-log
          hostPath:
            path: /var/log
            type: Directory
        - name: journal
          hostPath:
            path: /run/log/journal
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: positions
          hostPath:
            path: /home/main/services/monitoring/promtail-thinkcentre
            type: DirectoryOrCreate
