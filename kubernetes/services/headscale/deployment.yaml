apiVersion: apps/v1
kind: Deployment
metadata:
  name: headscale
  namespace: headscale
spec:
  replicas: 1
  # One SQLite database on a ReadWriteOnce volume: never run two pods at
  # once, not even briefly during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
      annotations:
        config-revision: "acl-policy-13"
    spec:
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of its database and keys and takes over when this
      # site is gone (dotfiles modules/nixos/site-failover).
      nodeSelector:
        ha.radunenu.com/headscale: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: headscale
          image: ghcr.io/juanfont/headscale:v0.29.3@sha256:0e7f1c6e4ce6c2a2a001103ecd3fa645a045adf30ac8a5234fe037b43000cd72
          args:
            - serve
          ports:
            - containerPort: 8080
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          # Generous: restarting the coordinator is worse than a slow reply.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/headscale
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale

      volumes:
        - name: config
          configMap:
            name: headscale-config
        # The local-path volume's folder (pvc.yaml) on fuji, the copy on the
        # thinkcentre.
        - name: data
          hostPath: {path: /srv/ha/headscale, type: Directory}
