apiVersion: v1
kind: ConfigMap
metadata:
  name: headscale-config
  namespace: headscale
data:
  config.yaml: |
    server_url: https://hs.radunenu.com
    listen_addr: 0.0.0.0:8080
    metrics_listen_addr: 0.0.0.0:9090

    database:
      type: sqlite
      sqlite:
        path: /var/lib/headscale/db.sqlite

    tls_cert_path: ""
    tls_key_path: ""

    noise:
      private_key_path: /var/lib/headscale/noise_private.key

    dns:
      magic_dns: true
      base_domain: tail.radunenu.com
      override_local_dns: true
      nameservers:
        global:
          - 1.1.1.1
          - 1.0.0.1
        split:
          # fuji and the thinkcentre each serve it (#149).
          infra.radunenu.com:
            - 100.64.0.1
            - 100.64.0.4

    # Default-deny access policy (acl.hujson below).
    policy:
      mode: file
      path: /etc/headscale/acl.hujson

    prefixes:
      v4: 100.64.0.0/10
      v6: fd7a:115c:a1e0::/48
      allocation: sequential

    derp:
      server:
        enabled: false

      urls:
        - https://controlplane.tailscale.com/derpmap/default

      paths: []

      auto_update_enabled: true
      update_frequency: 3h

  acl.hujson: |
    {
      // Tailnet access policy. Default deny: only the flows below are allowed.
      // Addresses are Headscale's sequential allocations (prefixes in config.yaml);
      // each node has an IPv4 and an IPv6 address, both listed.
      "hosts": {
        "fuji": "100.64.0.1",         "fuji6": "fd7a:115c:a1e0::1/128",
        "mixi": "100.64.0.2",         "mixi6": "fd7a:115c:a1e0::2/128",
        "macminim4": "100.64.0.3",    "macminim46": "fd7a:115c:a1e0::3/128",
        "thinkcentre": "100.64.0.4",  "thinkcentre6": "fd7a:115c:a1e0::4/128",
        "hetzy": "100.64.0.5",        "hetzy6": "fd7a:115c:a1e0::5/128",
        "phon": "100.64.0.6",         "phon6": "fd7a:115c:a1e0::6/128",
        "nixpad": "100.64.0.7",       "nixpad6": "fd7a:115c:a1e0::7/128",
        "minima": "100.64.0.8",       "minima6": "fd7a:115c:a1e0::8/128",
        "edge": "100.64.0.9",         "edge6": "fd7a:115c:a1e0::9/128",
        "workstation": "100.64.0.10", "workstation6": "fd7a:115c:a1e0::a/128",

        // Fuji's LAN API address (the kubernetes Service endpoint), routed via
        // Fuji for remote K3s nodes. Approved on the node:
        //   headscale nodes approve-routes -i 1 -r 192.168.100.136/32
        "fuji-lan": "192.168.100.136/32",
      },

      "acls": [
        // Cluster nodes and the Mac (VM host, Borg target) trust each other: K3s
        // API and kubelet, Flannel, pod traffic masqueraded to node addresses,
        // Borg over SSH, the raw game edge, SSH between servers.
        {
          "action": "accept",
          "src": [
            "fuji", "mixi", "macminim4", "thinkcentre", "minima",
            "fuji6", "mixi6", "macminim46", "thinkcentre6", "minima6",
          ],
          "dst": [
            "fuji:*", "mixi:*", "macminim4:*", "thinkcentre:*", "minima:*",
            "fuji6:*", "mixi6:*", "macminim46:*", "thinkcentre6:*", "minima6:*",
            "fuji-lan:*",
          ],
        },

        // Admin devices reach everything: nixpad, the phone, the workstation, and the
        // Mac, which doubles as one.
        {
          "action": "accept",
          "src": ["nixpad", "phon", "macminim4", "workstation", "nixpad6", "phon6", "macminim46", "workstation6"],
          "dst": ["*:*"],
        },

        // hetzy (Matrix VPS, outside the cluster) ships logs to Loki's tailnet
        // proxy (listens on 100.64.0.1 only), and Prometheus (fuji, and the second
        // one on the thinkcentre, #148) scrapes its exporters (the scrape targets
        // are IPv4).
        { "action": "accept", "src": ["hetzy", "hetzy6"], "dst": ["fuji:3101"] },
        { "action": "accept", "src": ["fuji", "thinkcentre"], "dst": ["hetzy:9100-9103"] },

        // The edge passes web traffic through to Traefik at either site.
        { "action": "accept", "src": ["edge", "edge6"], "dst": ["fuji:80,443", "thinkcentre:80,443", "fuji6:80,443", "thinkcentre6:80,443"] },

        // The edge relays game ports to the thinkcentre during a failover
        // (dotfiles, modules/nixos/game-relay.nix).
        { "action": "accept", "src": ["edge", "edge6"], "dst": ["thinkcentre:6767,51751,25565,19132,24545,5520,7777", "thinkcentre6:6767,51751,25565,19132,24545,5520,7777"] },

        // Prometheus (fuji and the thinkcentre) scrapes the edge's HAProxy and
        // comin metrics.
        { "action": "accept", "src": ["fuji", "fuji6", "thinkcentre", "thinkcentre6"], "dst": ["edge:8404,4243", "edge6:8404,4243"] },

        // Alerts go to the relay on the edge (docs/ha/alerting.md).
        { "action": "accept", "src": ["fuji", "mixi", "thinkcentre", "minima", "fuji6", "mixi6", "thinkcentre6", "minima6"], "dst": ["edge:9190", "edge6:9190"] },

        // Failover checkers read each other's votes (docs/ha/failover.md).
        { "action": "accept", "src": ["edge", "edge6"], "dst": ["mixi:9180", "mixi6:9180"] },
        { "action": "accept", "src": ["mixi", "mixi6"], "dst": ["edge:9180", "edge6:9180"] },

        // Tailnet DNS (split DNS for infra.radunenu.com, served on fuji and the
        // thinkcentre).
        { "action": "accept", "src": ["*"], "dst": ["fuji:53", "thinkcentre:53"] },
      ],
    }
