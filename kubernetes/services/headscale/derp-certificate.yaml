# The certificate for the tailnet's relay on the edge (#38). cert-manager
# renews it here (HTTP-01, through the edge); the edge copies it every 15
# minutes (dotfiles hosts/edge/haproxy.nix, edge-certs).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: derp
  namespace: headscale
spec:
  secretName: derp-tls
  dnsNames:
    - derp.radunenu.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
