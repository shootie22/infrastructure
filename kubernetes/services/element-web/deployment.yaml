# Element Web, develop channel (rebuilt on every merge upstream). The tag is
# deliberately not pinned: element-web-updater (updater.yaml) restarts the
# Deployment at 04:00 Europe/Berlin when the registry's develop digest differs
# from the running one, and the restart pulls the new build (pull Always).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: element-web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: element-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: element-web
      annotations:
        config-revision: "2"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: element-web
          image: docker.io/vectorim/element-web:develop
          imagePullPolicy: Always
          env:
            # The image runs as nginx (uid 101) and defaults to port 80.
            - name: ELEMENT_WEB_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /version
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: element-web
