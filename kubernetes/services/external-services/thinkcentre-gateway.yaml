apiVersion: v1
kind: ConfigMap
metadata:
  name: thinkcentre-http-relay
  namespace: external-services
data:
  Caddyfile: |
    {
        auto_https off
        admin off
    }

    :18081 {
        # Rybbit's Caddy through its Service, wherever it runs (#146).
        reverse_proxy http://caddy.rybbit.svc.cluster.local:8080
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkcentre-http-relay
  namespace: external-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thinkcentre-http-relay
  template:
    metadata:
      labels:
        app: thinkcentre-http-relay
      # Caddy reads its config at start; bump this when the Caddyfile changes.
      annotations:
        config-revision: "2"
    spec:
      # Any node: whatever it relays to is on the thinkcentre anyway (#149).
      containers:
        - name: caddy
          image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 18081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: thinkcentre-http-relay
        - name: data
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thinkcentre-http-gateway
  namespace: external-services
spec:
  selector:
    app: thinkcentre-http-relay
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 18081
