apiVersion: v1
kind: Service
metadata:
  name: thinkcentre-http-gateway
  namespace: external-services
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 18080
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: thinkcentre-http-gateway
  namespace: external-services
  labels:
    kubernetes.io/service-name: thinkcentre-http-gateway
addressType: IPv4
ports:
  - name: http
    protocol: TCP
    port: 18080
endpoints:
  - addresses:
      - 100.64.0.4
    conditions:
      ready: true
