apiVersion: v1
kind: Service
metadata:
  name: thinkcentre-http-gateway
  namespace: external-services
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 18080
---
# Transitional external backend while these workloads remain on ThinkCentre.
# Endpoints is deprecated upstream in favor of EndpointSlice, but Argo in this
# cluster is not applying our manually-managed EndpointSlice. Keep this explicit
# and small; replace it when the workloads move or the Argo exclusion is removed.
apiVersion: v1
kind: Endpoints
metadata:
  name: thinkcentre-http-gateway
  namespace: external-services
subsets:
  - addresses:
      - ip: 100.64.0.4
    ports:
      - name: http
        port: 18080
        protocol: TCP
