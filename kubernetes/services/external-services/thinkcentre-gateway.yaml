apiVersion: v1
kind: ConfigMap
metadata:
  name: thinkcentre-http-relay
  namespace: external-services
data:
  Caddyfile: |
    {
        auto_https off
        admin off
    }

    :18081 {
        # Rybbit's Caddy through its Service, wherever it runs (#146).
        reverse_proxy http://caddy.rybbit.svc.cluster.local:8080
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thinkcentre-http-relay
  namespace: external-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thinkcentre-http-relay
  template:
    metadata:
      labels:
        app: thinkcentre-http-relay
      # Caddy reads its config at start; bump this when the Caddyfile changes.
      annotations:
        config-hash: "801afc673151"
    spec:
      priorityClassName: service
      # Any node; moves 30 s after its node stops answering.
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: caddy
          image: caddy:2.11.8-alpine@sha256:3db3a09e418f86a8fce8de4bc0026fccd2b4cd925aef00cc7d843d9fdc75e442
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 18081
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /config
          resources:
            requests: {cpu: 5m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: thinkcentre-http-relay
        - name: data
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: thinkcentre-http-gateway
  namespace: external-services
spec:
  selector:
    app: thinkcentre-http-relay
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 18081
