apiVersion: v1
kind: Namespace
metadata:
  name: minecraft-hc
  # Hub reaches the game agent in namespaces with this label (infra-hub #8).
  labels:
    hub.radunenu.com/games: "true"
  annotations:
    hub.radunenu.com/description: Minecraft hardcore server, Java
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-hc
  namespace: minecraft-hc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-hc
  template:
    metadata:
      labels:
        app: minecraft-hc
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the world and takes over when this site is gone
      # (dotfiles modules/nixos/site-failover; the copies save over RCON
      # first, so they're never caught mid-save).
      nodeSelector:
        ha.radunenu.com/minecraft-hc: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      terminationGracePeriodSeconds: 60
      initContainers:
        # RCON on, for the copies' save step (dotfiles site-failover). Set at
        # every start, so it holds whatever happens to server.properties.
        - name: rcon
          image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command: [/bin/sh, -ec]
          args:
            - |
              f=/server/server.properties
              [ -f "$f" ] || exit 0
              set_prop() {
                if grep -q "^$1=" "$f"; then sed -i "s|^$1=.*|$1=$2|" "$f"; else echo "$1=$2" >> "$f"; fi
              }
              set_prop enable-rcon true
              set_prop rcon.port 25575
              set_prop rcon.password "$RCON_PASSWORD"
              set_prop broadcast-rcon-to-ops false
          env:
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef: {name: minecraft-rcon, key: password}
          volumeMounts:
            - name: server
              mountPath: /server
      containers:
        - name: minecraft
          image: git.radunenu.com/radu/spigotmc-docker:server-v0.0.9@sha256:a6c81e27cc2c17c97ecca246e05ac113a0c22fb6aa12d1b0046828675767e711
          stdin: true
          tty: true
          envFrom:
            - secretRef:
                name: minecraft-hc-env
          env:
            - name: EULA
              value: "true"
            - name: LEVEL_SEED
              value: "-2634042832057963959"
            - name: WHITE_LIST
              value: "false"
          ports:
            - name: minecraft
              containerPort: 25565
              hostPort: 6767
              protocol: TCP
          volumeMounts:
            - name: server
              mountPath: /server
      volumes:
        - name: server
          hostPath:
            path: /srv/ha/minecraft-hc
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-hc
  namespace: minecraft-hc
spec:
  selector:
    app: minecraft-hc
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-hc-fix-permissions
  namespace: minecraft-hc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-hc-fix-permissions
  template:
    metadata:
      labels:
        app: minecraft-hc-fix-permissions
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the world and takes over when this site is gone
      # (dotfiles modules/nixos/site-failover; the copies save over RCON
      # first, so they're never caught mid-save).
      nodeSelector:
        ha.radunenu.com/minecraft-hc: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: fix-permissions
          image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
          command:
            - sh
            - -c
            - while true; do chmod -R a+rwX /server; sleep 30; done
          volumeMounts:
            - name: server
              mountPath: /server
      volumes:
        - name: server
          hostPath:
            path: /srv/ha/minecraft-hc
            type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-hc-sftp
  namespace: minecraft-hc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-hc-sftp
  template:
    metadata:
      labels:
        app: minecraft-hc-sftp
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the world and takes over when this site is gone
      # (dotfiles modules/nixos/site-failover; the copies save over RCON
      # first, so they're never caught mid-save).
      nodeSelector:
        ha.radunenu.com/minecraft-hc: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: sftp
          image: atmoz/sftp:alpine@sha256:5eb757b2fac4d15e458ecec96f7edd9101b5efeefb16138b93e9f975075d8825
          args:
            - "$(SFTP_USERNAME):$(SFTP_PASSWORD):1000"
          envFrom:
            - secretRef:
                name: minecraft-hc-env
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: sftp
              containerPort: 22
              hostPort: 51751
              protocol: TCP
          volumeMounts:
            - name: server
              mountPath: /home/mcadmin/server
      volumes:
        - name: server
          hostPath:
            path: /srv/ha/minecraft-hc
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-hc-sftp
  namespace: minecraft-hc
spec:
  selector:
    app: minecraft-hc-sftp
  ports:
    - name: sftp
      port: 22
      targetPort: sftp
      protocol: TCP
