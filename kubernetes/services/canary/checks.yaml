# Checks that do what users do, through the public address, against a time
# limit (docs/ha/decisions.md, 2026-10-21). After 2026-10-20's failover every
# component was "up" for ten hours while CI took no job: Gitea answered the
# runners too slowly. Only someone trying to use it noticed.
#
# - canary-git: push a commit to radu/yeetusnet-canary and clone it back, every 10
#   minutes, within a minute. CanaryGitFailing after 30 minutes without a pass.
# - canary-ci: push a commit whose workflow has to be picked up by a runner
#   and pass, every 15 minutes. Allowed 25 minutes, since a runner can be
#   busy with a long build; CanaryCIFailing after 2 hours without a pass.
#   Still queued then, with every cluster linux-amd64 slot busy on a job,
#   counts as a pass: CI is full, which is normal on a day of many builds
#   (on 2026-11-01 cubitrix's builds held every runner for over two hours).
#
# Each push is a commit of its own on its own branch, force-pushed, so the
# repository doesn't grow. The workflow comes with the commit. The token is
# radu/yeetusnet-canary's only (scripts/create-canary-secret.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: canary
  namespace: canary
data:
  check.sh: |
    set -euo pipefail
    export GIT_TERMINAL_PROMPT=0 HOME=/tmp
    repo=radu/yeetusnet-canary
    api=https://git.yeetus.net/api/v1
    url="https://canary:${GITEA_TOKEN}@git.yeetus.net/${repo}.git"
    branch="canary-$MODE"
    took() { echo $(( $(date +%s) - $1 )); }

    work=$(mktemp -d) && cd "$work"
    git init -q -b "$branch"
    git config user.name canary
    git config user.email canary@radunenu.com
    mkdir -p .gitea/workflows
    cat > .gitea/workflows/canary.yaml <<'WORKFLOW'
    # Runs only for canary-ci (kubernetes/services/canary in infrastructure).
    on:
      push:
        branches: [canary-ci]
    jobs:
      ok:
        runs-on: linux-amd64
        steps:
          - run: echo "picked up and ran"
    WORKFLOW
    date -u +%FT%TZ > stamp
    git add -A
    git commit -qm "canary $(cat stamp)"
    sha=$(git rev-parse HEAD)

    t0=$(date +%s)
    timeout 60 git push -qf "$url" "HEAD:refs/heads/$branch"
    echo "pushed $sha to $branch in $(took $t0) s"

    if [ "$MODE" = git ]; then
      timeout 60 git clone -q --depth 1 -b "$branch" "$url" back
      [ "$(cat back/stamp)" = "$(cat stamp)" ] || { echo "cloned back something else"; exit 1; }
      total=$(took $t0)
      echo "push and clone back took $total s"
      [ "$total" -le 60 ] || { echo "slower than 60 s"; exit 1; }
      exit 0
    fi

    # ci: the run for exactly this commit, picked up and passed.
    deadline=$(( t0 + 1500 ))
    while [ "$(date +%s)" -lt "$deadline" ]; do
      run=$(curl -fsS -m 20 -H "Authorization: token $GITEA_TOKEN" \
        "$api/repos/$repo/actions/runs?head_sha=$sha&limit=1" | jq -c '.workflow_runs[0] // empty') || run=
      if [ -n "$run" ]; then
        status=$(echo "$run" | jq -r .status) conclusion=$(echo "$run" | jq -r .conclusion)
        if [ "$status" = completed ]; then
          echo "run $(echo "$run" | jq -r .id): $conclusion after $(took $t0) s"
          [ "$conclusion" = success ] && exit 0
          exit 1
        fi
      fi
      sleep 15
    done
    echo "no passing run for $sha within $(took $t0) s (last seen: ${run:-none})"

    # Given up on, so cancelled: otherwise it stays queued and takes a
    # runner later, after the builds it waited behind, for a check nobody
    # waits on any more. On a busy day that's one every 15 minutes. Only
    # logged if Gitea refuses; the check's result doesn't depend on it.
    status=$(echo "${run:-}" | jq -r '.status // empty' 2>/dev/null) || status=
    if [ -n "$status" ]; then
      id=$(echo "$run" | jq -r .id)
      if code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST \
          -H "Authorization: token $GITEA_TOKEN" "$api/repos/$repo/actions/runs/$id/cancel"); [ "${code:0:1}" = 2 ]; then
        echo "cancelled run $id"
      else
        echo "couldn't cancel run $id: ${code:-no answer}"
      fi
    fi

    # Still queued: every runner may just be busy with other builds, which
    # is normal. That passes if each of the cluster's linux-amd64 slots (the
    # dispatcher's, ci-runner) has a runner up and on a task it started less
    # than the runner's 3h timeout ago. An idle, missing or stuck slot while
    # this job waits means jobs aren't handed out (2026-10-20). A slot is
    # gone for a few seconds between two jobs, so it's looked at three times.
    busy() {
      local slots pod running started now
      slots=$(kubectl -n ci-runner get configmap dispatcher -o jsonpath='{.data.slots}' |
        awk '$2 ~ /(^|,)linux-amd64:/ { print "ci-" $1 }') || return 1
      [ -n "$slots" ] || { echo "no linux-amd64 slots in the dispatcher's ConfigMap"; return 1; }
      now=$(date +%s)
      for pod in $slots; do
        running=$(kubectl -n ci-jobs get pod "$pod" --ignore-not-found \
          -o jsonpath='{.status.containerStatuses[?(@.name=="runner")].state.running.startedAt}') || return 1
        [ -n "$running" ] || { echo "$pod: no runner running"; return 1; }
        started=$(kubectl -n ci-jobs logs "$pod" -c runner |
          sed -n 's/.*time="\([^"]*\)".*msg="task started".*/\1/p' | tail -n 1) || return 1
        [ -n "$started" ] || { echo "$pod: idle"; return 1; }
        started=$(jq -rn --arg t "$started" '$t | fromdateiso8601') || return 1
        [ $(( now - started )) -lt $(( 3 * 3600 + 600 )) ] ||
          { echo "$pod: still on a task it started $(( (now - started) / 60 )) min ago, past the runner's timeout"; return 1; }
        echo "$pod: on a task for $(( (now - started) / 60 )) min"
      done
    }
    if [ "$status" = queued ] || [ "$status" = waiting ]; then
      for try in 1 2 3; do
        if out=$(busy 2>&1); then
          echo "$out"
          echo "every linux-amd64 slot is busy: CI is full, not broken"
          exit 0
        fi
        [ "$try" = 3 ] || sleep 15
      done
      echo "$out"
    fi
    exit 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: canary-git
  namespace: canary
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        spec:
          priorityClassName: background
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: check
              image: docker.io/alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
              command: ["bash", "/canary/check.sh"]
              env:
                - {name: MODE, value: git}
                - name: GITEA_TOKEN
                  valueFrom: {secretKeyRef: {name: canary-gitea, key: token}}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: script, mountPath: /canary, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: canary}
            - name: tmp
              emptyDir: {sizeLimit: 32Mi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: canary-ci
  namespace: canary
spec:
  schedule: "7,22,37,52 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # 25 minutes for the run, then a minute or so looking at the slots.
      activeDeadlineSeconds: 1700
      template:
        spec:
          priorityClassName: background
          serviceAccountName: canary-ci
          enableServiceLinks: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: check
              image: docker.io/alpine/k8s:1.37.2@sha256:dcb7185e112a453aa72f426754849a97357727ef8f40168fb208c8cf59952042
              command: ["bash", "/canary/check.sh"]
              env:
                - {name: MODE, value: ci}
                - name: GITEA_TOKEN
                  valueFrom: {secretKeyRef: {name: canary-gitea, key: token}}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: script, mountPath: /canary, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap: {name: canary}
            - name: tmp
              emptyDir: {sizeLimit: 32Mi}
---
# canary-ci looks at the CI slots when its run is still queued: the
# dispatcher's slot list, and each job pod's runner state and log. Nothing
# else, and nothing it can change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: canary-ci
  namespace: canary
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-ci
  namespace: ci-runner
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["dispatcher"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-ci
  namespace: ci-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-ci
subjects:
  - kind: ServiceAccount
    name: canary-ci
    namespace: canary
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: canary-ci
  namespace: ci-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: canary-ci
  namespace: ci-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: canary-ci
subjects:
  - kind: ServiceAccount
    name: canary-ci
    namespace: canary
