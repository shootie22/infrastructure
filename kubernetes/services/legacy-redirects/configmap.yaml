apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-redirects
  namespace: legacy-redirects
data:
  Caddyfile: |
    {
        auto_https off
        admin off
    }

    :8080 {
        @radunenu_redirect host www.radunenu.com byradu.com www.byradu.com cubi.tube www.cubi.tube cubtube.lol www.cubtube.lol

        handle @radunenu_redirect {
            redir https://radunenu.com{uri} 301
        }

        @gitea_redirect host git.kronorite.com
        handle @gitea_redirect {
            redir https://git.radunenu.com{uri} 301
        }

        handle {
            respond "unknown host" 404
        }
    }
