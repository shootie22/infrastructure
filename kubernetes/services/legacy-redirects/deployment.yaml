apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-redirects
  namespace: legacy-redirects
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-redirects
  template:
    metadata:
      annotations:
        config-revision: "2"
      labels:
        app: legacy-redirects
    spec:
      containers:
        - name: caddy
          image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          # Traefik needs a moment to stop sending requests here (#89).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
      volumes:
        - name: config
          configMap:
            name: legacy-redirects
        - name: data
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
      # One copy per site, so either site can serve it alone (#89).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: legacy-redirects
  # No third site for a surge pod, so replace one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
