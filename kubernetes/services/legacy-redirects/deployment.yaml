apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-redirects
  namespace: legacy-redirects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-redirects
  template:
    metadata:
      annotations:
        config-revision: "2"
      labels:
        app: legacy-redirects
    spec:
      containers:
        - name: caddy
          image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: legacy-redirects
        - name: data
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
