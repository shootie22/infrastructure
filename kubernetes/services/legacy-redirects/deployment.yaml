apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-redirects
  namespace: legacy-redirects
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-redirects
  template:
    metadata:
      annotations:
        config-revision: "2"
      labels:
        app: legacy-redirects
    spec:
      containers:
        - name: caddy
          image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: legacy-redirects
        - name: data
          emptyDir: {}
        - name: runtime-config
          emptyDir: {}
