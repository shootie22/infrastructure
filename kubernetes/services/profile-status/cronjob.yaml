# Hourly: reads Prometheus (RO, the one with 15 days) and replaces the
# metrics branch of shootie22/shootie22 with one commit holding the card's
# two SVGs, as a GitHub App. Nothing goes to main, so the contribution graph
# is untouched. Source: git.radunenu.com/radu/profile-status.
#
# The App's ids and key are in github-app.sops.yaml
# (scripts/create-profile-status-app.sh). If runs stop, ProfileStatusStale
# fires (monitoring/prometheus-configmap.yaml): the card can't tell on its own.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: profile-status
  namespace: profile-status
spec:
  schedule: "7 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: profile-status
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          tolerations:
            - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
            - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          # A new pod is turned away for its first seconds, until the network
          # policy knows its address (kube-router), and the job would fail on
          # its first request: wait until Prometheus answers.
          initContainers:
            - name: wait-for-prometheus
              image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
              command: ["sh", "-c", "for i in $(seq 1 30); do wget -q -T 3 -O /dev/null http://prometheus.monitoring.svc:9090/-/ready && exit 0; sleep 2; done; exit 1"]
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
          containers:
            - name: profile-status
              image: git.radunenu.com/radu/profile-status:v0.1.5@sha256:0711e56c8a7c19f1876bd35a54cfd00050aef646257569c30b04bb00d2a48a3b
              env:
                - name: PROMETHEUS_URL
                  value: http://prometheus.monitoring.svc:9090
                - name: GITHUB_REPOSITORY
                  value: shootie22/shootie22
                - name: GITHUB_BRANCH
                  value: metrics
                - name: GITHUB_APP_ID
                  valueFrom:
                    secretKeyRef: {name: profile-status-github-app, key: app-id}
                - name: GITHUB_INSTALLATION_ID
                  valueFrom:
                    secretKeyRef: {name: profile-status-github-app, key: installation-id}
                - name: GITHUB_APP_KEY_FILE
                  value: /var/run/secrets/github-app/private-key.pem
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: github-app, mountPath: /var/run/secrets/github-app, readOnly: true}
          volumes:
            - name: github-app
              secret:
                secretName: profile-status-github-app
                defaultMode: 0440
                items:
                  - {key: private-key.pem, path: private-key.pem}
