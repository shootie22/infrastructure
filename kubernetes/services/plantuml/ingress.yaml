apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plantuml
  namespace: plantuml
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - puml.radunenu.com
      secretName: puml-radunenu-com-tls
  rules:
    - host: puml.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plantuml
                port:
                  number: 80
