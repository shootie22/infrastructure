apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plantuml
  namespace: plantuml
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Development
    gethomepage.dev/name: PlantUML
    gethomepage.dev/icon: plantuml.png
    gethomepage.dev/description: Text-based diagrams
    gethomepage.dev/weight: "200"
    gethomepage.dev/siteMonitor: http://plantuml.plantuml.svc.cluster.local
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - puml.yeetus.net
      secretName: puml-radunenu-com-tls
  rules:
    - host: puml.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plantuml
                port:
                  number: 80
---
# puml.radunenu.com moved to puml.yeetus.net: the old name redirects there
# with the path kept. The new name doesn't match, so it passes straight
# through.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-yeetus
  namespace: plantuml
spec:
  redirectRegex:
    regex: ^https?://puml\.radunenu\.com/(.*)$
    replacement: https://puml.yeetus.net/${1}
    permanent: true
---
# puml.radunenu.com, the old name: redirects to the new one (to-yeetus). No
# homepage annotation, so the status probes only check the new name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plantuml-old-name
  namespace: plantuml
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: plantuml-to-yeetus@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - puml.radunenu.com
      secretName: puml-radunenu-com-tls
  rules:
    - host: puml.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plantuml
                port:
                  number: 80
