apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Infrastructure
    theme: dark
    color: slate
    headerStyle: clean
    background:
      image: https://raw.githubusercontent.com/shootie22/infrastructure/main/kubernetes/services/homepage/assets/nordic-lake.webp
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 35
    target: _self
    statusStyle: dot
    hideVersion: true
    disableUpdateCheck: true
    disableIndexing: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: true
    layout:
      Overview:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4
      Websites:
        style: row
        columns: 4
      Media:
        style: row
        columns: 4
      Development:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      Legacy Web:
        style: row
        columns: 4
        initiallyCollapsed: true

  services.yaml: |
    - Overview:
        - Cluster:
            icon: mdi-server-network
            description: Current cluster health
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Nodes
                  query: count(kube_node_info{job="kube-state-metrics"})
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node!=""}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node!=""}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node!=""}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

        - Fuji:
            icon: mdi-server
            href: https://mon.radunenu.com/d/obs-nodes/nodes-hosts?var-node=fuji
            description: Kubernetes node
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * max(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node="fuji"})
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node="fuji"}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node="fuji"}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node="fuji"}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

        - ThinkCentre:
            icon: mdi-server
            href: https://mon.radunenu.com/d/obs-nodes/nodes-hosts?var-node=thinkcentre
            description: Kubernetes node
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * max(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node="thinkcentre"})
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node="thinkcentre"}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node="thinkcentre"}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node="thinkcentre"}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

        - Mixi:
            icon: mdi-server
            href: https://mon.radunenu.com/d/obs-nodes/nodes-hosts?var-node=mixi
            description: Kubernetes node
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * max(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node="mixi"})
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node="mixi"}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node="mixi"}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node="mixi"}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

    - Websites:
        - RaduNenu.com:
            icon: mdi-web
            href: https://radunenu.com
            description: Personal website
            siteMonitor: http://radunenu-com.radunenu-com.svc.cluster.local

        - Yeetus.net:
            icon: mdi-web
            href: https://yeetus.net
            description: Yeetus landing page
            siteMonitor: http://yeetus-net.yeetus-net.svc.cluster.local

    - Apps:
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://vw.yeetus.net
            description: Password vault
            siteMonitor: http://vaultwarden.vaultwarden.svc.cluster.local

        - PrivateBin:
            icon: privatebin.png
            href: https://pbin.radunenu.com
            description: Encrypted paste sharing
            siteMonitor: http://privatebin.privatebin.svc.cluster.local

        - Hemmelig:
            icon: hemmelig.png
            href: https://share.radunenu.com
            description: One-time secret sharing
            siteMonitor: http://hemmelig.hemmelig.svc.cluster.local

        - Picshare:
            icon: mdi-image-multiple-outline
            href: https://img.radunenu.com
            description: Private image sharing
            siteMonitor: http://picshare.picshare.svc.cluster.local

        - Element:
            icon: element.png
            href: https://nuke.zip
            description: Private messaging
            siteMonitor: https://nuke.zip

        - Element Call:
            icon: element.png
            href: https://call.nuke.zip
            description: Video meetings
            siteMonitor: http://element-call.element-call.svc.cluster.local

        - Joplin Server:
            icon: joplin.png
            href: https://n.yeetus.net
            description: Notes and sync
            siteMonitor: http://joplin.joplin.svc.cluster.local

        - Baïkal:
            icon: baikal.png
            href: https://cal.radunenu.com
            description: Calendars and contacts
            siteMonitor: http://baikal.baikal.svc.cluster.local

        - Pinga:
            icon: mdi-radar
            href: https://pinga.radunenu.com
            description: Network checks
            siteMonitor: http://pinga.pinga.svc.cluster.local

    - Media:
        - Audiobookshelf:
            icon: audiobookshelf.png
            href: https://books.yeetus.net
            description: Audiobooks and podcasts
            siteMonitor: http://audiobookshelf.audiobookshelf.svc.cluster.local

    - Development:
        - Gitea:
            icon: gitea.png
            href: https://git.radunenu.com
            description: Source and builds
            siteMonitor: http://gitea.gitea.svc.cluster.local

        - PlantUML:
            icon: plantuml.png
            href: https://puml.radunenu.com
            description: Text-based diagrams
            siteMonitor: http://plantuml.plantuml.svc.cluster.local

        - Rybbit:
            icon: mdi-chart-box-outline
            href: https://analytics.radunenu.com
            description: Private web analytics
            siteMonitor: http://caddy.rybbit.svc.cluster.local:8080/api/health

    - Infrastructure:
        - Grafana:
            icon: grafana.png
            href: https://mon.radunenu.com
            description: Metrics and logs
            siteMonitor: http://grafana.monitoring.svc.cluster.local:3000/api/health

        - Headlamp:
            icon: headlamp.png
            href: https://hl.infra.radunenu.com
            description: Cluster administration
            siteMonitor: http://headlamp.headlamp.svc.cluster.local

        - Keycloak:
            icon: keycloak.png
            href: https://auth.radunenu.com
            description: Identity administration
            siteMonitor: http://keycloak.keycloak.svc.cluster.local:9000/health/ready

    - Legacy Web:
        - Old Radu API:
            icon: mdi-api
            href: https://api-old.radunenu.com
            description: Original API endpoints
            siteMonitor: https://api-old.radunenu.com/health-check.html

        - ByRadu API:
            icon: mdi-api
            href: https://api.byradu.com
            description: Legacy ByRadu API
            siteMonitor: https://api.byradu.com/health-check.html

        - Kronorite News API:
            icon: mdi-newspaper-variant-outline
            href: https://news.kronorite.com
            description: Legacy news API

        - Kronorite Stats API:
            icon: mdi-chart-line
            href: https://stats.kronorite.com
            description: Legacy game statistics
            siteMonitor: https://stats.kronorite.com/health-check.html

        - Kronorite:
            icon: mdi-steam
            href: https://kronorite.com
            description: Redirect to Steam
            siteMonitor: https://kronorite.com

        - ByRadu:
            icon: mdi-link-variant
            href: https://byradu.com
            description: Redirect to RaduNenu.com
            siteMonitor: https://byradu.com

        - CubiTube:
            icon: mdi-link-variant
            href: https://cubi.tube
            description: Legacy site redirect
            siteMonitor: https://cubi.tube

        - CubTube:
            icon: mdi-link-variant
            href: https://cubtube.lol
            description: Legacy site redirect
            siteMonitor: https://cubtube.lol

  kubernetes.yaml: |
    mode: disabled

  widgets.yaml: |
    - datetime:
        text_size: md
        locale: da-DK
        format:
          hour: 2-digit
          minute: 2-digit
          hourCycle: h23
          timeZone: Europe/Copenhagen
          timeZoneName: short

    - openmeteo:
        label: Copenhagen
        latitude: 55.6761
        longitude: 12.5683
        timezone: Europe/Copenhagen
        units: metric
        cache: 10
        format:
          maximumFractionDigits: 0

    - openmeteo:
        label: Bucharest
        latitude: 44.4268
        longitude: 26.1025
        timezone: Europe/Bucharest
        units: metric
        cache: 10
        format:
          maximumFractionDigits: 0

    - datetime:
        text_size: md
        locale: ro-RO
        format:
          hour: 2-digit
          minute: 2-digit
          hourCycle: h23
          timeZone: Europe/Bucharest
          timeZoneName: short

  bookmarks.yaml: ""
  docker.yaml: ""
  proxmox.yaml: ""
  providers.yaml: ""
  custom.js: ""
  custom.css: |
    #page_container {
      max-width: 1600px;
    }

    .service-card {
      background-color: rgb(15 23 42 / 0.62) !important;
      border: 1px solid rgb(255 255 255 / 0.08);
      box-shadow: 0 12px 30px rgb(0 0 0 / 0.16);
    }

    #information-widgets-right {
      display: grid !important;
      grid-template-columns: max-content max-content minmax(2rem, 1fr) max-content max-content;
      align-items: center;
      column-gap: 0.75rem;
      width: 100%;
      flex-basis: 100%;
      margin: 0 !important;
    }

    #information-widgets-right > :nth-child(1) {
      grid-column: 1;
    }

    #information-widgets-right > :nth-child(2) {
      grid-column: 2;
    }

    #information-widgets-right > :nth-child(3) {
      grid-column: 4;
    }

    #information-widgets-right > :nth-child(4) {
      grid-column: 5;
    }

    @media (max-width: 639px) {
      #information-widgets-right {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 1rem;
        row-gap: 0.65rem;
      }

      #information-widgets-right > :nth-child(1) {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
      }

      #information-widgets-right > :nth-child(2) {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
      }

      #information-widgets-right > :nth-child(3) {
        grid-column: 1;
        grid-row: 2;
        justify-self: start;
      }

      #information-widgets-right > :nth-child(4) {
        grid-column: 2;
        grid-row: 2;
        justify-self: end;
      }

      #information-widgets-right .widget-container {
        min-width: 0;
      }

      #information-widgets-right .widget-inner-text {
        margin-left: 0.5rem;
      }

      #information-widgets-right .information-widget-icon {
        width: 2.25rem;
        height: 2.25rem;
      }
    }
