apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Infrastructure
    theme: dark
    color: slate
    headerStyle: clean
    background:
      image: https://raw.githubusercontent.com/shootie22/infrastructure/main/kubernetes/services/homepage/assets/nordic-lake.webp
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 35
    target: _self
    statusStyle: dot
    hideVersion: true
    disableUpdateCheck: true
    disableIndexing: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: true
    layout:
      Overview:
        style: row
        columns: 4
      Apps:
        style: row
        columns: 4
      Game Servers:
        style: row
        columns: 3
      Websites:
        style: row
        columns: 4
      Development:
        style: row
        columns: 4
      Infrastructure:
        style: row
        columns: 4
      Legacy Web:
        style: row
        columns: 4
        initiallyCollapsed: true

  services.yaml: |
    - Overview:
        - Cluster:
            icon: mdi-server-network
            description: Current cluster health
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Nodes
                  query: count(kube_node_info{job="kube-state-metrics"})
                  format:
                    type: number
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node!=""}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node!=""}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node!=""}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

        - Fuji:
            icon: mdi-server
            href: https://mon.radunenu.com/d/obs-nodes/nodes-hosts?var-node=fuji
            description: Kubernetes node
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * max(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node="fuji"})
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node="fuji"}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node="fuji"}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node="fuji"}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

        - ThinkCentre:
            icon: mdi-server
            href: https://mon.radunenu.com/d/obs-nodes/nodes-hosts?var-node=thinkcentre
            description: Kubernetes node
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * max(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node="thinkcentre"})
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node="thinkcentre"}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node="thinkcentre"}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node="thinkcentre"}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

        - Mixi:
            icon: mdi-server
            href: https://mon.radunenu.com/d/obs-nodes/nodes-hosts?var-node=mixi
            description: Kubernetes node
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * max(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node="mixi"})
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node="mixi"}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node="mixi"}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node="mixi"}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

        - Minima:
            icon: mdi-server
            href: https://mon.radunenu.com/d/obs-nodes/nodes-hosts?var-node=minima
            description: Kubernetes node
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * max(kube_node_status_condition{job="kube-state-metrics", condition="Ready", status="true", node="minima"})
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: CPU
                  query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle", node="minima"}[5m])))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0
                - label: Memory
                  query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="node-exporter", node="minima"}) / sum(node_memory_MemTotal_bytes{job="node-exporter", node="minima"}))
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

    - Apps:
        - Element:
            icon: element.png
            href: https://nuke.zip
            description: Private messaging
            siteMonitor: https://nuke.zip
            weight: 500

    - Game Servers:
        - Minecraft Hardcore:
            icon: minecraft.png
            description: Hardcore Java server
            weight: 100
            widget:
              type: minecraft
              url: udp://minecraft-hc.minecraft-hc.svc.cluster.local:25565

        - Minecraft Skyblock:
            icon: minecraft.png
            description: Java and Bedrock server
            weight: 200
            widget:
              type: minecraft
              url: udp://minecraft-skyblock.minecraft-skyblock.svc.cluster.local:25565

        - MegaBopl3D:
            icon: mdi-gamepad-variant-outline
            description: Private game server
            weight: 300
            widget:
              type: prometheusmetric
              url: http://prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Ready
                  query: 100 * clamp_max(kube_deployment_status_replicas_available{job="kube-state-metrics", namespace="megabopl3d", deployment="megabopl3d"} / clamp_min(kube_deployment_spec_replicas{job="kube-state-metrics", namespace="megabopl3d", deployment="megabopl3d"}, 1), 1)
                  format:
                    type: percent
                    options:
                      maximumFractionDigits: 0

    - Infrastructure:
        - Headlamp:
            icon: headlamp.png
            href: https://hl.infra.radunenu.com
            description: Cluster administration
            siteMonitor: http://headlamp.headlamp.svc.cluster.local
            weight: 200

    - Legacy Web:
        - Old Radu API:
            icon: mdi-api
            href: https://api-old.radunenu.com
            description: Original API endpoints
            siteMonitor: https://api-old.radunenu.com/health-check.html

        - ByRadu API:
            icon: mdi-api
            href: https://api.byradu.com
            description: Legacy ByRadu API
            siteMonitor: https://api.byradu.com/health-check.html

        - Kronorite News API:
            icon: mdi-newspaper-variant-outline
            href: https://news.kronorite.com
            description: Legacy news API

        - Kronorite Stats API:
            icon: mdi-chart-line
            href: https://stats.kronorite.com
            description: Legacy game statistics
            siteMonitor: https://stats.kronorite.com/health-check.html

        - Kronorite:
            icon: mdi-steam
            href: https://kronorite.com
            description: Redirect to Steam
            siteMonitor: https://kronorite.com

        - ByRadu:
            icon: mdi-link-variant
            href: https://byradu.com
            description: Redirect to RaduNenu.com
            siteMonitor: https://byradu.com

        - CubiTube:
            icon: mdi-link-variant
            href: https://cubi.tube
            description: Legacy site redirect
            siteMonitor: https://cubi.tube

        - CubTube:
            icon: mdi-link-variant
            href: https://cubtube.lol
            description: Legacy site redirect
            siteMonitor: https://cubtube.lol

  kubernetes.yaml: |
    mode: cluster
    ingress: true
    traefik: false
    gateway: false

  widgets.yaml: |
    - datetime:
        text_size: md
        locale: da-DK
        format:
          hour: 2-digit
          minute: 2-digit
          hourCycle: h23
          timeZone: Europe/Copenhagen
          timeZoneName: short

    - openmeteo:
        label: Copenhagen
        latitude: 55.6761
        longitude: 12.5683
        timezone: Europe/Copenhagen
        units: metric
        cache: 10
        format:
          maximumFractionDigits: 0

    - openmeteo:
        label: Bucharest
        latitude: 44.4268
        longitude: 26.1025
        timezone: Europe/Bucharest
        units: metric
        cache: 10
        format:
          maximumFractionDigits: 0

    - datetime:
        text_size: md
        locale: ro-RO
        format:
          hour: 2-digit
          minute: 2-digit
          hourCycle: h23
          timeZone: Europe/Bucharest
          timeZoneName: short

  bookmarks.yaml: ""
  docker.yaml: ""
  proxmox.yaml: ""
  providers.yaml: ""
  custom.js: ""
  custom.css: |
    #page_container {
      max-width: 1600px;
    }

    .service-card {
      background-color: rgb(15 23 42 / 0.62) !important;
      border: 1px solid rgb(255 255 255 / 0.08);
      box-shadow: 0 12px 30px rgb(0 0 0 / 0.16);
    }

    #information-widgets-right {
      display: grid !important;
      grid-template-columns: max-content max-content minmax(2rem, 1fr) max-content max-content;
      align-items: center;
      column-gap: 0.75rem;
      width: 100%;
      flex-basis: 100%;
      margin: 0 !important;
    }

    #information-widgets-right > :nth-child(1) {
      grid-column: 1;
    }

    #information-widgets-right > :nth-child(2) {
      grid-column: 2;
    }

    #information-widgets-right > :nth-child(3) {
      grid-column: 4;
    }

    #information-widgets-right > :nth-child(4) {
      grid-column: 5;
    }

    @media (max-width: 639px) {
      #information-widgets-right {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        column-gap: 1rem;
        row-gap: 0.65rem;
      }

      #information-widgets-right > :nth-child(1) {
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
      }

      #information-widgets-right > :nth-child(2) {
        grid-column: 2;
        grid-row: 1;
        justify-self: end;
      }

      #information-widgets-right > :nth-child(3) {
        grid-column: 1;
        grid-row: 2;
        justify-self: start;
      }

      #information-widgets-right > :nth-child(4) {
        grid-column: 2;
        grid-row: 2;
        justify-self: end;
      }

      #information-widgets-right .widget-container {
        min-width: 0;
      }

      #information-widgets-right .widget-inner-text {
        margin-left: 0.5rem;
      }

      #information-widgets-right .information-widget-icon {
        width: 2.25rem;
        height: 2.25rem;
      }
    }
