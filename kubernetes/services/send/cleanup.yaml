# Send only deletes a file when its download limit is reached. Files that
# expire by time (or lose their metadata to a Redis restart) stay on disk,
# unreachable, until this removes everything older than MAX_EXPIRE_SECONDS
# (14 days = 20160 min) plus an hour of slack.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: send-cleanup
  namespace: send
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: send-cleanup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: thinkcentre
          containers:
            - name: cleanup
              image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
              command:
                - find
                - /uploads
                - -mindepth
                - "1"
                - -maxdepth
                - "1"
                - -type
                - f
                - -mmin
                - "+20220"
                - -print
                - -delete
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  memory: 32Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - {name: uploads, mountPath: /uploads}
          volumes:
            - name: uploads
              hostPath: {path: /home/main/storage/send-uploads, type: Directory}
