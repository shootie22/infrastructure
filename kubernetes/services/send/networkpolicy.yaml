# Send and its cleanup job need no network egress at all (Redis is on
# localhost, which this does not affect). oauth2-proxy only needs DNS and
# HTTPS to reach Keycloak at auth.radunenu.com.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: send-no-egress
  namespace: send
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [send, send-cleanup]
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oauth2-proxy-egress
  namespace: send
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
