# Only the new server's own paths on games.yeetus.net: /v1 (the API and the
# websocket at /v1/events), /healthz and /download (the app's download page). Everything else still goes to the old
# GameVault (../gamevault/ingress.yaml) until the cutover, so the desktop app
# can be tried at the real address without a new DNS name. Traefik picks the
# longest matching path, so these win over the old one's /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games
  namespace: games
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # The old GameVault's ingress has the Home tile and the status check until
    # the cutover.
    radunenu.com/status: hidden
spec:
  ingressClassName: traefik
  tls:
    - hosts: [games.yeetus.net]
      secretName: games-yeetus-net-tls
  rules:
    - host: games.yeetus.net
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend: {service: {name: games, port: {number: 80}}}
          - path: /healthz
            pathType: Exact
            backend: {service: {name: games, port: {number: 80}}}
          # Exact, plus the page's fonts under /download/: a Prefix /download would also
          # take /downloads, which is the old GameVault's downloads page.
          - path: /download
            pathType: Exact
            backend: {service: {name: games, port: {number: 80}}}
          - path: /download/
            pathType: Prefix
            backend: {service: {name: games, port: {number: 80}}}
