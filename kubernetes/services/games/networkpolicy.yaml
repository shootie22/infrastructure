# In: Traefik, monitoring, CNPG's operator and the nodes (kubelet probes);
# out: DNS, its Postgres, and 443 for Keycloak's keys at auth.yeetus.net.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allowed-sources
  namespace: games
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        # Scraping (Prometheus) and the status page's probes (blackbox).
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        # CloudNativePG's operator, for the database here.
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
        # The nodes (kubelet probes), as in ../gamevault.
        - ipBlock: {cidr: 10.42.0.0/32}  # fuji
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}  # thinkcentre
        - ipBlock: {cidr: 10.42.1.1/32}
        - ipBlock: {cidr: 10.42.2.0/32}  # mixi
        - ipBlock: {cidr: 10.42.2.1/32}
        - ipBlock: {cidr: 10.42.3.0/32}  # minima-vm
        - ipBlock: {cidr: 10.42.3.1/32}
        - ipBlock: {cidr: 10.42.4.0/32}  # edge
        - ipBlock: {cidr: 10.42.4.1/32}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: games-egress
  namespace: games
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: games
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector: {matchLabels: {cnpg.io/cluster: games-pg}}
      ports:
        - {protocol: TCP, port: 5432}
    - ports:
        - {protocol: TCP, port: 443}
