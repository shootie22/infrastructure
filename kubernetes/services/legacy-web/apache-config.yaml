apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-api-apache
  namespace: legacy-web
data:
  # After changing this, run scripts/check-config-hash --fix: Apache only reads it
  # when it starts.
  000-default.conf: |
    # No Apache or Debian version in headers and error pages.
    ServerTokens Prod
    ServerSignature Off

    # The restored sites (#73) sit in the same data folder, under sites/,
    # mounted on their own at /var/www/sites. The old API's web root is the
    # whole folder, so it must never hand them out.
    <Directory /var/www/api-old.radunenu.com/sites>
        Require all denied
    </Directory>

    # The old API's folder came with .htaccess files that were never read
    # (AllowOverride None), so their rules are here, for every name it's
    # served under (the folder has symlinks like fsp -> v3/api/fsp).
    <Directory /var/www/api-old.radunenu.com>
        Options -Indexes +FollowSymLinks
        <FilesMatch "^\.|\.(env|log|ini|bak|sql|conf|sh|swp|old|txt)$">
            Require all denied
        </FilesMatch>
        # The stats endpoints write a file named after ?playername=, so no
        # ../ anywhere in the request, encoded or not.
        <If "%{THE_REQUEST} =~ m#(\.|%2e){2}(/|\\\\|%2f|%5c)#i">
            Require all denied
        </If>
    </Directory>
    # Never meant to be public: a .git folder, fsp's logs (webhook URLs
    # people sent it) and report screenshots, and fsp's upload panel.
    <DirectoryMatch "/(\.git|logs|screenshots)(/|$)">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "/fsp(/|$)">
        <Files ~ "^(a|panel)\.php$">
            Require all denied
        </Files>
    </DirectoryMatch>

    <VirtualHost *:80>
        ServerName api-old.radunenu.com
        DocumentRoot /var/www/api-old.radunenu.com

        <Directory /var/www/api-old.radunenu.com>
            Require all granted
            AllowOverride None
        </Directory>
    </VirtualHost>

    <VirtualHost *:80>
        ServerName api.byradu.com
        DocumentRoot /var/www/api-old.radunenu.com

        <Directory /var/www/api-old.radunenu.com>
            Require all granted
            AllowOverride None
        </Directory>
    </VirtualHost>

    <VirtualHost *:80>
        ServerName news.kronorite.com
        DocumentRoot /var/www/api-old.radunenu.com/v1

        <Directory /var/www/api-old.radunenu.com/v1>
            Require all granted
            AllowOverride None
        </Directory>
    </VirtualHost>

    <VirtualHost *:80>
        ServerName stats.kronorite.com
        DocumentRoot /var/www/api-old.radunenu.com

        Alias /mazegame /var/www/api-old.radunenu.com/v2/stats/mazegame
        Alias /mazegame/ /var/www/api-old.radunenu.com/v2/stats/mazegame/

        <Directory /var/www/api-old.radunenu.com>
            Require all granted
            AllowOverride None
        </Directory>

        <Directory /var/www/api-old.radunenu.com/v2/stats/mazegame>
            Require all granted
            AllowOverride None
        </Directory>
    </VirtualHost>

    # cats.yeetus.net: the landing page (cats-landing.yaml) at /, the gallery
    # page (cats-gallery.yaml) at /aki/ and /kairi/, which reads each cat's
    # manifest.json, thumbnails, photos and videos from sites/cats/<cat>/.
    # Only files: PHP is off here, and the old file browser and the
    # originals (still in files/, with their metadata) aren't served.
    <VirtualHost *:80>
        ServerName cats.yeetus.net
        DocumentRoot /var/www/sites/cats
        AliasMatch "^/$" "/var/www/cats-landing/index.html"
        AliasMatch "^/index\.html$" "/var/www/cats-landing/index.html"
        AliasMatch "^/(aki|kairi)/$" "/var/www/cats-gallery/index.html"
        Alias "/_gallery/" "/var/www/cats-gallery/"
        RedirectMatch permanent "^/(aki|kairi)$" "/$1/"

        <Directory /var/www/sites/cats>
            Require all granted
            AllowOverride None
            Options -Indexes
            <IfModule php_module>
                php_admin_flag engine off
            </IfModule>
            <FilesMatch "\.(php|phtml|phar|md)$">
                Require all denied
            </FilesMatch>
        </Directory>
        <DirectoryMatch "^/var/www/sites/cats/[^/]+/(files|assets)(/|$)">
            Require all denied
        </DirectoryMatch>
        <Directory /var/www/cats-landing>
            Require all granted
            AllowOverride None
        </Directory>
        <Directory /var/www/cats-gallery>
            Require all granted
            AllowOverride None
        </Directory>
    </VirtualHost>

    # analytics.byradu.com: one page about Analytix (analytics-archive.yaml),
    # the app itself is gone. Any old link lands on the page.
    <VirtualHost *:80>
        ServerName analytics.byradu.com
        DocumentRoot /var/www/analytics-archive
        AliasMatch "^/.+" "/var/www/analytics-archive/index.html"
        <Directory /var/www/analytics-archive>
            Require all granted
            AllowOverride None
            Options -Indexes
        </Directory>
    </VirtualHost>

    # The galleries' old names go to their new place, keeping the path.
    <VirtualHost *:80>
        ServerName cats.radunenu.com
        Redirect permanent / https://cats.yeetus.net/
    </VirtualHost>
    <VirtualHost *:80>
        ServerName aki.kronorite.com
        Redirect permanent / https://cats.yeetus.net/aki/
    </VirtualHost>
    <VirtualHost *:80>
        ServerName kairi.kronorite.com
        Redirect permanent / https://cats.yeetus.net/kairi/
    </VirtualHost>

    # Săptămâna celor 7 arte, made for Costin: static, as it was.
    <VirtualHost *:80>
        ServerName archive.radunenu.com
        ServerAlias 7zile7arte.byradu.com
        DocumentRoot /var/www/sites/costin

        <Directory /var/www/sites/costin>
            Require all granted
            AllowOverride None
            Options -Indexes
        </Directory>
    </VirtualHost>

    # kronorite.com's /atestat and /bbtom, which had real pages and files.
    # kronorite.com itself is Caddy (redirects); it hands these two paths to
    # this name inside the cluster.
    <VirtualHost *:80>
        ServerName kronorite-pages.legacy-web
        DocumentRoot /var/www/sites/kronorite

        <Directory /var/www/sites/kronorite>
            Require all granted
            AllowOverride None
            Options -Indexes
        </Directory>
    </VirtualHost>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-api-php
  namespace: legacy-web
data:
  # The image has no php.ini, so PHP showed its errors (with file paths) on
  # the page and named its version in every response.
  zz-legacy.ini: |
    display_errors = Off
    display_startup_errors = Off
    log_errors = On
    expose_php = Off
