apiVersion: apps/v1
kind: Deployment
metadata:
  name: kronorite
  namespace: legacy-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kronorite
  template:
    metadata:
      labels:
        app: kronorite
    spec:
      priorityClassName: service
      containers:
        - name: caddy
          image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
          args:
            - caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
            # Picks up a changed ConfigMap by itself, no restart needed.
            - --watch
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # Traefik needs a moment to stop sending requests here (#89).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: kronorite-caddy
      # One copy per site, so either site can serve it alone (#89).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: kronorite
  # No third site for a surge pod, so replace one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
