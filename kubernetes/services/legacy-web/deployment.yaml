apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api
  namespace: legacy-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-api
  template:
    metadata:
      labels:
        app: legacy-api
      annotations:
        # Apache reads apache-config.yaml only when it starts: bump this
        # whenever that file changes.
        config-revision: "2"
    spec:
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy and takes over when this site is gone (dotfiles
      # modules/nixos/site-failover).
      nodeSelector:
        ha.radunenu.com/legacy-web: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: apache-php
          image: php:8.5.12-apache-trixie@sha256:4cc63b3d4e05c40da73e7af5d39364ca2678ac07208919497bda3bbab975be95
          command:
            - bash
            - -lc
          args:
            - a2enmod rewrite >/dev/null && exec apache2-foreground
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health-check.html
              port: http
              httpHeaders:
                - name: Host
                  value: api-old.radunenu.com
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/www/api-old.radunenu.com
            - name: apache-sites
              mountPath: /etc/apache2/sites-enabled
              readOnly: true
            - name: php-ini
              mountPath: /usr/local/etc/php/conf.d/zz-legacy.ini
              subPath: zz-legacy.ini
              readOnly: true
            # The restored sites (#73), read-only.
            - name: data
              mountPath: /var/www/sites
              subPath: sites
              readOnly: true
            - name: cats-landing
              mountPath: /var/www/cats-landing
              readOnly: true
            - name: cats-gallery
              mountPath: /var/www/cats-gallery
              readOnly: true
            - name: analytics-archive
              mountPath: /var/www/analytics-archive
              readOnly: true
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 64Mi
      volumes:
        - name: cats-landing
          configMap:
            name: cats-landing
        - name: cats-gallery
          configMap:
            name: cats-gallery
        - name: analytics-archive
          configMap:
            name: analytics-archive
        # The local-path volume's folder (pvc.yaml) on fuji, the copy on the
        # thinkcentre.
        - name: data
          hostPath: {path: /srv/ha/legacy-web, type: Directory}
        - name: apache-sites
          configMap:
            name: legacy-api-apache
        - name: php-ini
          configMap:
            name: legacy-api-php
