apiVersion: v1
kind: ConfigMap
metadata:
  name: kronorite-caddy
  namespace: legacy-web
data:
  Caddyfile: |
    {
      auto_https off
      admin off
    }

    :8080 {
      @root path /
      redir @root https://store.steampowered.com/app/876780 302

      # /atestat and /bbtom had real pages and files: Apache serves them
      # (sites/kronorite in legacy-web's data folder, #73).
      # In a handle so it runs before the respond 404 below (Caddy orders
      # respond ahead of reverse_proxy).
      @pages path /atestat /atestat/* /bbtom /bbtom/*
      handle @pages {
        reverse_proxy legacy-api.legacy-web.svc.cluster.local:80 {
          header_up Host kronorite-pages.legacy-web
        }
      }

      # The old site's other pages (#73). On the OVH box each was an
      # index.html with a meta refresh; these are the same targets.
      @steam path /kronorite-has-released /kronorite-has-released/ /play-kronorite /play-kronorite/ /steam-store-page /steam-store-page/
      redir @steam https://store.steampowered.com/app/876780/Kronorite/ 302
      @discord path /discord-server /discord-server/ /contact-us /contact-us/ /august-open-beta-join-our-discord /august-open-beta-join-our-discord/ /open-beta-live-come-grab-your-key /open-beta-live-come-grab-your-key/
      redir @discord https://discord.kronorite.com 302
      # /service-status went to status.kronorite.com, which is gone.
      @home path /home /home/ /about-us /about-us/ /newsletter /newsletter/ /privacy-policy /privacy-policy/ /service-status /service-status/
      redir @home / 302

      respond 404
    }
