apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-api
  namespace: legacy-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api-old.radunenu.com
        - api.byradu.com
        - news.kronorite.com
        - stats.kronorite.com
      secretName: legacy-api-tls
  rules:
    - host: api-old.radunenu.com
      http: &legacy_api_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-api
                port:
                  number: 80
    - host: api.byradu.com
      http: *legacy_api_paths
    - host: news.kronorite.com
      http: *legacy_api_paths
    - host: stats.kronorite.com
      http: *legacy_api_paths
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kronorite
  namespace: legacy-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kronorite.com
        - www.kronorite.com
      secretName: kronorite-tls
  rules:
    - host: kronorite.com
      http: &kronorite_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kronorite
                port:
                  number: 80
    - host: www.kronorite.com
      http: *kronorite_paths
---
# The restored sites (#73): the cat galleries, their old names (redirects),
# and the 7 arte site under both its names.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-sites
  namespace: legacy-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cats.yeetus.net
        - cats.radunenu.com
        - aki.kronorite.com
        - kairi.kronorite.com
        - archive.radunenu.com
        - 7zile7arte.byradu.com
      secretName: legacy-sites-tls
  rules:
    - host: cats.radunenu.com
      http: &legacy_sites_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-api
                port:
                  number: 80
    - host: aki.kronorite.com
      http: *legacy_sites_paths
    - host: kairi.kronorite.com
      http: *legacy_sites_paths
    - host: archive.radunenu.com
      http: *legacy_sites_paths
    - host: 7zile7arte.byradu.com
      http: *legacy_sites_paths
---
# cats.yeetus.net on its own, for its security headers (cats-headers below).
# Its certificate is legacy-sites-tls, made for the Ingress above.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cats
  namespace: legacy-web
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: legacy-web-cats-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cats.yeetus.net
      secretName: legacy-sites-tls
  rules:
    - host: cats.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-api
                port:
                  number: 80
---
# analytics.byradu.com: the Analytix page, with the same headers as the cats.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: analytics
  namespace: legacy-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: legacy-web-cats-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - analytics.byradu.com
      secretName: analytics-tls
  rules:
    - host: analytics.byradu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-api
                port:
                  number: 80
---
# Only our own files: scripts, styles, pictures, video. No framing, no
# referrer to other sites, no camera or location.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cats-headers
  namespace: legacy-web
spec:
  headers:
    contentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
---
# The FeedbackSurvey pages from 2022 (v3/api/fsp, also reachable as /fsp
# through a symlink in the webroot): a.php takes screenshot uploads into the
# webroot and, like panel.php, writes what it's sent straight into SQL; the
# only check is a key that ships inside the game. Nothing but the downloads
# has been used lately (one request in two weeks, 2026-11-19), so the rest is
# 403 on every name this Apache answers to. downloads/ stays public.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-all
  namespace: legacy-web
spec:
  ipAllowList:
    sourceRange: [127.0.0.1/32]
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: legacy-fsp-blocked
  namespace: legacy-web
spec:
  entryPoints: [websecure]
  routes:
    - match: (Host(`api-old.radunenu.com`) || Host(`api.byradu.com`) || Host(`news.kronorite.com`) || Host(`stats.kronorite.com`)) && (PathPrefix(`/v3/api/fsp`) || PathPrefix(`/fsp`)) && !PathPrefix(`/v3/api/fsp/downloads`) && !PathPrefix(`/fsp/downloads`)
      priority: 1000
      middlewares:
        - {name: deny-all}
      services:
        - {name: legacy-api, port: 80}
  tls:
    secretName: legacy-api-tls
