apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-api
  namespace: legacy-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api-old.radunenu.com
        - api.byradu.com
        - news.kronorite.com
        - stats.kronorite.com
      secretName: legacy-api-tls
  rules:
    - host: api-old.radunenu.com
      http: &legacy_api_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: legacy-api
                port:
                  number: 80
    - host: api.byradu.com
      http: *legacy_api_paths
    - host: news.kronorite.com
      http: *legacy_api_paths
    - host: stats.kronorite.com
      http: *legacy_api_paths
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kronorite
  namespace: legacy-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kronorite.com
        - www.kronorite.com
      secretName: kronorite-tls
  rules:
    - host: kronorite.com
      http: &kronorite_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kronorite
                port:
                  number: 80
    - host: www.kronorite.com
      http: *kronorite_paths
