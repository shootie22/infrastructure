# One-time test that the hourly dump restores (#32): the dump on fuji goes
# into a scratch database, then the thinkcentre counts the rows into
# /home/main/services/vaultwarden-migration/restore-test.log. Removed after.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: vw-restore-test
  namespace: vaultwarden
spec:
  cluster: {name: vaultwarden-db}
  name: vw_restore_test
  owner: vaultwarden
  databaseReclaimPolicy: delete
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vw-restore-test
  namespace: vaultwarden
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: fuji
      containers:
        - name: restore
          image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
          command: ["/bin/sh", "-ec"]
          args:
            - |
              # The first dump taken after the move to Postgres (12:29 UTC+2).
              until [ -e /backup/vaultwarden.dump ] && [ $(stat -c %Y /backup/vaultwarden.dump) -gt $(date -d 2026-10-06T10:35:00Z +%s) ]; do sleep 30; done
              pg_restore -h vaultwarden-db-rw -U vaultwarden -d vw_restore_test --no-owner --exit-on-error /backup/vaultwarden.dump
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: vaultwarden-db-app, key: password}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: backup, mountPath: /backup, readOnly: true}
      volumes:
        - name: backup
          hostPath:
            path: /var/lib/pg-dumps
            type: Directory
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vw-restore-test-count
  namespace: vaultwarden
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: thinkcentre
      containers:
        - name: count
          image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
          command: ["/bin/sh", "-c"]
          args:
            - |
              exec >>/result/restore-test.log 2>&1
              echo "== waiting for the restore $(date -Is)"
              q() { psql -h vaultwarden-db-rw -U vaultwarden -At -d "$@"; }
              until [ "$(q vw_restore_test -c 'select count(*) from devices' 2>/dev/null)" -gt 0 ] 2>/dev/null; do sleep 30; done
              sleep 30
              echo "== table, live, restored $(date -Is)"
              for t in users ciphers folders folders_ciphers devices sends twofactor; do
                echo "$t $(q vaultwarden -c "select count(*) from $t") $(q vw_restore_test -c "select count(*) from $t")"
              done
              echo "== done"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: vaultwarden-db-app, key: password}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - {name: result, mountPath: /result}
      volumes:
        - name: result
          hostPath:
            path: /home/main/services/vaultwarden-migration
            type: Directory
