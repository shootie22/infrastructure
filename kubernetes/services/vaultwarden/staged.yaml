apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vaultwarden}
  template:
    metadata:
      labels: {app: vaultwarden}
    spec:
      automountServiceAccountToken: false
      # Runs in either site (#88). Nothing on disk matters any more: the
      # database is in Postgres and the key that signs logins comes from a
      # secret. The old folder on the thinkcentre still has db.sqlite3.
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.3@sha256:1587c45feaa479f1f5e8af3b00eded36bff77bcf1880cf8dbf0541706dd470e0
          envFrom:
            - secretRef: {name: vaultwarden-env}
          env:
            # Postgres since Oct 2026 (#31).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: vaultwarden-db-app, key: uri}
            # Attachments and file Sends would be stored on the node's disk,
            # so they're off. Files go through Send (share.radunenu.com).
            - {name: USER_ATTACHMENT_LIMIT, value: "0"}
            - {name: ORG_ATTACHMENT_LIMIT, value: "0"}
            - {name: USER_SEND_LIMIT, value: "0"}
          ports:
            - {name: http, containerPort: 80}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: rsa-key, mountPath: /data/rsa_key.pem, subPath: rsa_key.pem, readOnly: true}
      volumes:
        # Only the icon cache ends up here.
        - name: data
          emptyDir: {}
        - name: rsa-key
          secret:
            secretName: vaultwarden-rsa-key
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector: {app: vaultwarden}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vw-yeetus-net
  namespace: vaultwarden
spec:
  secretName: vw-yeetus-net-tls
  dnsNames: [vw.yeetus.net]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: Vaultwarden
    gethomepage.dev/icon: vaultwarden.png
    gethomepage.dev/description: Password vault
    gethomepage.dev/weight: "100"
    gethomepage.dev/siteMonitor: http://vaultwarden.vaultwarden.svc.cluster.local
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - vw.yeetus.net
      secretName: vw-yeetus-net-tls
  rules:
    - host: vw.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
