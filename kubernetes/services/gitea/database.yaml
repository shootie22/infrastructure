# Gitea's Postgres: one instance in each site (#31, #144). Imported on 6 Oct
# from the old single Postgres 14, removed on 11 Oct (#162).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-pg
  namespace: gitea
  annotations:
    # Where the primary belongs (docs/ha/decisions.md, 2026-10-21): Gitea runs on one node at a time (site-failover).
    # site-failover switches it back there by itself.
    placement.radunenu.com/follows: gitea
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  # The hourly dump reads the replica. Without this the primary vacuums away
  # rows the dump is still reading, and the replica cancels it ("conflict
  # with recovery"): every hour while the primaries sat across the WAN after
  # 2026-10-20's failover. Reloads without a restart.
  postgresql:
    parameters:
      hot_standby_feedback: "on"
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
  # Requests only, no limits: a CPU share that a build on the same node
  # can't take away, without throttling Postgres when the node is idle.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
  storage:
    size: 20Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
  # runner_view: yeetus-api's login for git.yeetus.net's runner count. It
  # reads a runner's name, labels and last check-in and nothing else
  # (runner-view.yaml grants those columns). Password in gitea-env's
  # SopsSecret (gitea-pg-runner-view) and in yeetus-api's GITEA_DB_URL.
  managed:
    roles:
      - name: runner_view
        ensure: present
        login: true
        connectionLimit: 2
        passwordSecret:
          name: gitea-pg-runner-view
---
# Hourly dump into fuji's Borg folder (#32), as for the others.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gitea-pg-dump
  namespace: gitea
spec:
  schedule: "25 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: fuji
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=gitea-pg-ro
                  pg_isready -q -h $host || host=gitea-pg-r
                  pg_dump -h $host -U gitea -d gitea -Fc -f /backup/gitea.dump.tmp
                  mv /backup/gitea.dump.tmp /backup/gitea.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: gitea-pg-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/pg-dumps
                type: Directory
