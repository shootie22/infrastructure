# Who may connect into gitea (security audit, 2026-11-03): its database holds
# every account and repository, and only Traefik, a few named services and
# Gitea itself need it.
# Taken from a week of Beyla's flow metrics (direction="request") and the
# in-cluster addresses in this repo. Incoming only; what gitea connects to is
# unchanged. Like monitoring/networkpolicy.yaml: the nodes are allowed through
# their flannel and cni0 addresses (health checks, host-network proxies), and
# a new node needs its two addresses here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allowed-sources
  namespace: gitea
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        # Scraping (Prometheus) and the status page's probes (blackbox).
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        # CloudNativePG's operator, for the databases here.
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
        # cubitrix fetches its site package; yeetus-api reads Gitea and its
        # database (avatars); the CI canary.
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cubitrix}}
          podSelector: {matchLabels: {app.kubernetes.io/name: cubitrix}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: keycloak}}
          podSelector: {matchLabels: {app: yeetus-api}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: canary}}
        - ipBlock: {cidr: 10.42.0.0/32}  # fuji
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}  # thinkcentre
        - ipBlock: {cidr: 10.42.1.1/32}
        - ipBlock: {cidr: 10.42.2.0/32}  # mixi
        - ipBlock: {cidr: 10.42.2.1/32}
        - ipBlock: {cidr: 10.42.3.0/32}  # minima-vm
        - ipBlock: {cidr: 10.42.3.1/32}
        - ipBlock: {cidr: 10.42.4.0/32}  # edge
        - ipBlock: {cidr: 10.42.4.1/32}
