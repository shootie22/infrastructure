# What runner_view (database.yaml) may read: in Gitea's action_runner table,
# a runner's name, labels, last check-in and whether it's deleted or
# disabled. Not its token, and nothing else in Gitea. yeetus-api uses it
# for the runner count on git.yeetus.net's front page.
#
# A grant on a table goes when Gitea rebuilds the table in an upgrade, so
# this sets it again every 15 minutes. Run by Gitea's own database owner.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: runner-view-grant
  namespace: gitea
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          priorityClassName: background
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 26
            runAsGroup: 26
            seccompProfile:
              type: RuntimeDefault
          # A new pod is turned away for its first seconds, until the network
          # policy knows its address (kube-router): wait for the database.
          initContainers:
            - name: wait-for-db
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["sh", "-c", "for i in $(seq 1 30); do pg_isready -q -h gitea-pg-rw && exit 0; sleep 2; done; exit 1"]
          containers:
            - name: grant
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "gitea-pg-rw", "-U", "gitea", "-d", "gitea", "-c"]
              args:
                - GRANT SELECT (name, last_online, agent_labels, deleted, is_disabled) ON action_runner TO runner_view
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: gitea-pg-app, key: password}}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
