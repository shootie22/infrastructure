apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-postgres
  namespace: gitea
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gitea-postgres}
  template:
    metadata:
      labels: {app: gitea-postgres}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: thinkcentre
      containers:
        - name: postgres
          image: postgres:14.24-trixie@sha256:156f0b253fd61366d5fc2107ad45955027d5612f695a8436ce20167f3fa79bff
          envFrom:
            - secretRef: {name: gitea-env}
          ports:
            - {name: postgres, containerPort: 5432}
          volumeMounts:
            - {name: postgres, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: postgres
          hostPath:
            path: /home/main/services/gitea/postgres
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: gitea
spec:
  selector: {app: gitea-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
      # Bump to restart Gitea (e.g. after its folder's mounts change).
      annotations: {restart: "1"}
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the repos and packages and takes over when this
      # site is gone (dotfiles modules/nixos/site-failover).
      nodeSelector:
        ha.radunenu.com/gitea: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:1.27.3@sha256:87a67ee09d3ae0d1df5fda5dcda3e2a1f9236a45b0a59025d6e00e46adc43bef
          envFrom:
            - secretRef: {name: gitea-env}
          # Postgres on CNPG since Oct 2026 (#31); overrides the database settings
          # in gitea-env, and Gitea writes them into app.ini at start.
          env:
            - {name: GITEA__database__HOST, value: "gitea-pg-rw:5432"}
            - {name: GITEA__database__NAME, value: gitea}
            - name: GITEA__database__USER
              valueFrom: {secretKeyRef: {name: gitea-pg-app, key: username}}
            - name: GITEA__database__PASSWD
              valueFrom: {secretKeyRef: {name: gitea-pg-app, key: password}}
            # SSH for git: Traefik's gitssh entrypoint (2022 on fuji and the
            # thinkcentre) passes it to the image's own sshd on 22, so Gitea
            # can still move. Its own name, DNS only, since Cloudflare's proxy
            # in front of git.radunenu.com only carries HTTP. The host keys
            # are in /data/ssh and go along with the standby copy.
            - {name: GITEA__server__DISABLE_SSH, value: "false"}
            - {name: GITEA__server__SSH_DOMAIN, value: ssh.git.radunenu.com}
            - {name: GITEA__server__SSH_PORT, value: "2022"}
            # sshd checks keys against /data/git/.ssh/authorized_keys, which
            # Gitea writes from the database. Write it again at every start:
            # keys added while SSH was off never got in, and after a failover
            # the standby copy can be older than the database (CNPG).
            - {name: GITEA__cron_0X2E_resync_all_sshkeys__ENABLED, value: "true"}
            - {name: GITEA__cron_0X2E_resync_all_sshkeys__RUN_AT_START, value: "true"}
            # The instance-wide runner registration token, shared with the CI
            # runner (kubernetes/services/ci-runner). Gitea adds it at start.
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom: {secretKeyRef: {name: runner-registration, key: token}}
          ports:
            - {name: http, containerPort: 3000}
            - {name: ssh, containerPort: 22}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: localtime, mountPath: /etc/localtime, readOnly: true}
      volumes:
        - name: data
          hostPath:
            path: /srv/ha/gitea
            type: Directory
        - name: localtime
          hostPath: {path: /etc/localtime, type: File}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: ssh, port: 22, targetPort: ssh}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitea-ssh
  namespace: gitea
spec:
  entryPoints: [gitssh]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gitea
          port: 22
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: git-radunenu-com
  namespace: gitea
spec:
  secretName: git-radunenu-com-tls
  dnsNames: [git.radunenu.com]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: gitea
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Development
    gethomepage.dev/name: Gitea
    gethomepage.dev/icon: gitea.png
    gethomepage.dev/description: Source and builds
    gethomepage.dev/weight: "100"
    gethomepage.dev/siteMonitor: http://gitea.gitea.svc.cluster.local
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - git.radunenu.com
      secretName: git-radunenu-com-tls
  rules:
    - host: git.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 80
