apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
      # Bump to restart Gitea (e.g. after its folder's mounts change).
      annotations: {restart: "1"}
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the repos and packages and takes over when this
      # site is gone (dotfiles modules/nixos/site-failover).
      nodeSelector:
        ha.radunenu.com/gitea: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:28.1.0@sha256:f505a0d3a41323b786e05942fc7a4075e07ae7c169fd9485649aa55ee543a21a
          envFrom:
            - secretRef: {name: gitea-env}
          # Postgres on CNPG since Oct 2026 (#31); overrides the database settings
          # in gitea-env, and Gitea writes them into app.ini at start.
          env: &gitea-env
            - {name: GITEA__database__HOST, value: "gitea-pg-rw:5432"}
            - {name: GITEA__database__NAME, value: gitea}
            - name: GITEA__database__USER
              valueFrom: {secretKeyRef: {name: gitea-pg-app, key: username}}
            - name: GITEA__database__PASSWD
              valueFrom: {secretKeyRef: {name: gitea-pg-app, key: password}}
            # SSH for git: Traefik's gitssh entrypoint (2022 on fuji and the
            # thinkcentre) passes it to the image's own sshd on 22, so Gitea
            # can still move. Its own name, DNS only, since Cloudflare's proxy
            # in front of git.radunenu.com only carries HTTP. The host keys
            # are in /data/ssh and go along with the standby copy.
            - {name: GITEA__server__DISABLE_SSH, value: "false"}
            - {name: GITEA__server__SSH_DOMAIN, value: ssh.git.yeetus.net}
            # Its main address; git.radunenu.com keeps answering (Ingress) for old
            # clones, remotes and image names.
            - {name: GITEA__server__DOMAIN, value: git.yeetus.net}
            - {name: GITEA__server__ROOT_URL, value: "https://git.yeetus.net/"}
            - {name: GITEA__server__SSH_PORT, value: "2022"}
            # LFS objects over the SSH connection too (git-lfs-transfer), so
            # they skip Cloudflare's 100 MB upload limit. Over HTTPS they
            # still go through Cloudflare.
            - {name: GITEA__server__LFS_ALLOW_PURE_SSH, value: "true"}
            # sshd checks keys against /data/git/.ssh/authorized_keys, which
            # Gitea writes from the database. Write it again at every start:
            # keys added while SSH was off never got in, and after a failover
            # the standby copy can be older than the database (CNPG).
            - {name: GITEA__cron_0X2E_resync_all_sshkeys__ENABLED, value: "true"}
            - {name: GITEA__cron_0X2E_resync_all_sshkeys__RUN_AT_START, value: "true"}
            # The instance-wide runner registration token, shared with the CI
            # runner (kubernetes/services/ci-runner). Gitea adds it at start.
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom: {secretKeyRef: {name: runner-registration, key: token}}
            # Sign-in through Keycloak (#61, login source `keycloak`, see
            # oidc-source.sh below). A first Keycloak sign-in links to the
            # existing account with the same username, or email (auto),
            # someone new gets an account named after their Keycloak username.
            # The password form is off, so the web sign-in is Keycloak only.
            # Git over HTTPS still takes a password or a token. OIDC_* are for
            # the init container; the client secret is in gitea-env.
            - {name: GITEA__service__ENABLE_PASSWORD_SIGNIN_FORM, value: "false"}
            - {name: GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION, value: "true"}
            - {name: GITEA__oauth2_client__ACCOUNT_LINKING, value: auto}
            - {name: GITEA__oauth2_client__USERNAME, value: preferred_username}
            - {name: GITEA__oauth2_client__UPDATE_AVATAR, value: "true"}
            - {name: OIDC_CLIENT_ID, value: gitea}
            - {name: OIDC_DISCOVERY_URL, value: "https://auth.yeetus.net/realms/network-yeetus/.well-known/openid-configuration"}
            # The look (look.yaml copies it into the custom folder): our themes
            # next to Gitea's own, Yeetus for everyone who hasn't picked one
            # (Settings, Appearance).
            - {name: GITEA__ui__THEMES, value: "yeetus,github-auto,github-light,github-dark,minecraft,doom,gitea-auto,gitea-light,gitea-dark"}
            - {name: GITEA__ui__DEFAULT_THEME, value: yeetus}
            # /metrics, for the repository count on the front page (yeetus-api),
            # behind GITEA__metrics__TOKEN in gitea-env.
            - {name: GITEA__metrics__ENABLED, value: "true"}
            # /assets for 10 minutes instead of 6 hours, in browsers and at
            # Cloudflare: the theme files keep their names, so a new look
            # would otherwise take hours to show.
            - {name: GITEA__server__STATIC_CACHE_TIME, value: 10m}
          ports:
            - {name: http, containerPort: 3000}
            - {name: ssh, containerPort: 22}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: localtime, mountPath: /etc/localtime, readOnly: true}
      initContainers:
        # Sign-in through Keycloak (#61): adds Gitea's `keycloak` login source,
        # or brings it in line with oidc-source.sh, before Gitea starts. Same
        # image, data and settings as Gitea itself.
        - name: oidc-source
          image: docker.gitea.com/gitea:28.1.0@sha256:f505a0d3a41323b786e05942fc7a4075e07ae7c169fd9485649aa55ee543a21a
          command: ["/bin/sh", "/scripts/oidc-source.sh"]
          envFrom:
            - secretRef: {name: gitea-env}
          env: *gitea-env
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: oidc-source, mountPath: /scripts, readOnly: true}
      volumes:
        - name: data
          hostPath:
            path: /srv/ha/gitea
            type: Directory
        - name: localtime
          hostPath: {path: /etc/localtime, type: File}
        - name: oidc-source
          configMap:
            name: gitea-oidc-source
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: ssh, port: 22, targetPort: ssh}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitea-ssh
  namespace: gitea
spec:
  entryPoints: [gitssh]
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gitea
          port: 22
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: git-radunenu-com
  namespace: gitea
spec:
  secretName: git-radunenu-com-tls
  dnsNames: [git.radunenu.com, git.yeetus.net]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: gitea
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Development
    gethomepage.dev/name: Gitea
    gethomepage.dev/icon: gitea.png
    gethomepage.dev/description: Source and builds
    gethomepage.dev/weight: "100"
    gethomepage.dev/siteMonitor: http://gitea.gitea.svc.cluster.local
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - git.yeetus.net
      secretName: git-radunenu-com-tls
  rules:
    - host: git.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 80
---
# git.radunenu.com, the old name: still served as is, so old links, clones
# and apps keep working. No homepage annotation, so the status probes only
# check the new name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea-old-name
  namespace: gitea
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - git.radunenu.com
      secretName: git-radunenu-com-tls
  rules:
    - host: git.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitea
                port:
                  number: 80
---
# What the oidc-source init container runs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-oidc-source
  namespace: gitea
data:
  oidc-source.sh: |
    #!/bin/sh
    # Adds Gitea's Keycloak login source, or brings it in line with these
    # settings, before Gitea starts. Same data and settings as Gitea itself.
    set -eu
    cfg=/data/gitea/conf/app.ini
    run() { su-exec git gitea --config "$cfg" "$@"; }
    su-exec git environment-to-ini --config "$cfg"
    set -- \
      --name keycloak \
      --provider openidConnect \
      --key "$OIDC_CLIENT_ID" \
      --secret "$OIDC_CLIENT_SECRET" \
      --auto-discover-url "$OIDC_DISCOVERY_URL" \
      --scopes "email profile" \
      --group-claim-name groups \
      --admin-group gitea-admins \
      --skip-local-2fa
    id=$(run admin auth list --vertical-bars | awk -F'|' 'NR > 1 { gsub(/[[:space:]]/, "", $1); gsub(/[[:space:]]/, "", $2); if ($2 == "keycloak") print $1 }')
    if [ -z "$id" ]; then
      run admin auth add-oauth "$@"
      echo "keycloak login source added"
    else
      run admin auth update-oauth --id "$id" "$@"
      echo "keycloak login source $id updated"
    fi
