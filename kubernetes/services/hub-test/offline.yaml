# Throwaway test for infra-hub #53, removed with hub-test: the server gets
# DNS and nothing else out, as if Modrinth and SpigotMC were down, to see
# whether it still starts from what's in its folder.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-test-offline
  namespace: hub-test
spec:
  podSelector:
    matchLabels:
      app: hub-test
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
