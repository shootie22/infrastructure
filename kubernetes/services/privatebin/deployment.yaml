apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatebin
  namespace: privatebin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the pastes and takes over when this site is gone
      # (dotfiles modules/nixos/site-failover).
      nodeSelector:
        ha.radunenu.com/privatebin: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      securityContext:
        runAsUser: 65534
        runAsGroup: 82
        fsGroup: 82
      containers:
        - name: privatebin
          image: privatebin/unit-pdo:2.1.0@sha256:69e88f1035aeaf2e4186a3d7359e98c0783de026e068fd7c9eea16523fec3a24
          env:
            - name: TZ
              value: UTC+1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /srv/data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 48Mi
      volumes:
        - name: data
          hostPath:
            path: /srv/ha/privatebin
            type: Directory
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
