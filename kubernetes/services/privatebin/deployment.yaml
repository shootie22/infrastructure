apiVersion: apps/v1
kind: Deployment
metadata:
  name: privatebin
  namespace: privatebin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: privatebin
  template:
    metadata:
      labels:
        app: privatebin
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the pastes and takes over when this site is gone
      # (dotfiles modules/nixos/site-failover).
      nodeSelector:
        ha.radunenu.com/privatebin: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      securityContext:
        runAsUser: 65534
        runAsGroup: 82
        fsGroup: 82
      containers:
        - name: privatebin
          image: privatebin/unit-pdo:2.0.6@sha256:b990915e4621d1eabd4a83df773dbde6c434616e371124c90c74d058e25209b0
          env:
            - name: TZ
              value: UTC+1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /srv/data
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /srv/ha/privatebin
            type: Directory
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
