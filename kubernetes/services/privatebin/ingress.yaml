apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privatebin
  namespace: privatebin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: PrivateBin
    gethomepage.dev/icon: privatebin.png
    gethomepage.dev/description: Encrypted paste sharing
    gethomepage.dev/weight: "200"
    gethomepage.dev/siteMonitor: http://privatebin.privatebin.svc.cluster.local
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pbin.yeetus.net
      secretName: pbin-radunenu-com-tls
  rules:
    - host: pbin.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privatebin
                port:
                  number: 80
---
# pbin.radunenu.com moved to pbin.yeetus.net: the old name redirects there
# with the path kept. The new name doesn't match, so it passes straight
# through.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-yeetus
  namespace: privatebin
spec:
  redirectRegex:
    regex: ^https?://pbin\.radunenu\.com/(.*)$
    replacement: https://pbin.yeetus.net/${1}
    permanent: true
---
# pbin.radunenu.com, the old name: redirects to the new one (to-yeetus). No
# homepage annotation, so the status probes only check the new name.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: privatebin-old-name
  namespace: privatebin
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: privatebin-to-yeetus@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - pbin.radunenu.com
      secretName: pbin-radunenu-com-tls
  rules:
    - host: pbin.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: privatebin
                port:
                  number: 80
