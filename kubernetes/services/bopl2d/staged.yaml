# Bopl 2D dedicated server. Players connect to games.radunenu.com:24567/udp
# (or any game name, e.g. bopl.yeetus.net); fuji relays that port over
# Nebula to the hostPort here (modules/nixos/game-relay.nix in dotfiles). No
# state to keep. The tag is :latest on purpose: updater.yaml restarts it when
# a new build is pushed, and pullPolicy Always makes the restart fetch it.
apiVersion: v1
kind: Namespace
metadata:
  name: bopl2d
  annotations:
    hub.radunenu.com/description: Bopl 2D game server, follows its newest build
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bopl2d
  namespace: bopl2d
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bopl2d
  template:
    metadata:
      labels:
        app: bopl2d
    spec:
      automountServiceAccountToken: false
      # On whichever of fuji and the thinkcentre holds the label; the other
      # takes over when this site is gone, and the game relay follows
      # (dotfiles site-failover, stateless: nothing to copy).
      nodeSelector:
        ha.radunenu.com/bopl2d: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bopl2d
          image: git.radunenu.com/radu/bopl-2d-server:latest
          imagePullPolicy: Always
          ports:
            - name: game
              containerPort: 24567
              hostPort: 24567
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # HOME, XDG_DATA_HOME and BOPL_RUNTIME_DIR are all under /tmp in
            # the image.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bopl2d
  namespace: bopl2d
spec:
  selector:
    app: bopl2d
  ports:
    - name: game
      port: 24567
      targetPort: game
      protocol: UDP
