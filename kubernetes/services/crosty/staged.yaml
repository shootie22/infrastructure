# Crosty dedicated server (Godot, headless). Players connect to
# crosty.yeetus.net:7777/udp; fuji relays that port over Nebula to the
# hostPort here (hosts/fuji/raw-edge.nix in dotfiles). No state to keep.
# The tag is :latest on purpose: updater.yaml restarts it when a new build is
# pushed, and pullPolicy Always makes the restart fetch it.
apiVersion: v1
kind: Namespace
metadata:
  name: crosty
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crosty
  namespace: crosty
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crosty
  template:
    metadata:
      labels:
        app: crosty
    spec:
      automountServiceAccountToken: false
      # On whichever of fuji and the thinkcentre holds the label; the other
      # takes over when this site is gone, and the game relay follows
      # (dotfiles site-failover, stateless: nothing to copy).
      nodeSelector:
        ha.radunenu.com/crosty: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crosty
          image: git.radunenu.com/crosty/crosty-game-server:latest
          imagePullPolicy: Always
          ports:
            - name: game
              containerPort: 7777
              hostPort: 7777
              protocol: UDP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # HOME=/tmp in the image; Godot writes user:// data there.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: crosty
  namespace: crosty
spec:
  selector:
    app: crosty
  ports:
    - name: game
      port: 7777
      targetPort: game
      protocol: UDP
