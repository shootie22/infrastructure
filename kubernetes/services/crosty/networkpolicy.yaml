# Who may connect into crosty (security audit, 2026-11-03). Players come through
# the game relays on fuji and the edge (dotfiles game-relay.nix), so the
# game's own ports stay open to every address. Everything else, RCON and
# the agent included, only from the namespace itself, monitoring and the
# nodes (flannel and cni0 addresses, as in monitoring/networkpolicy.yaml).
# The agent's own policy (hub → agent) still applies on top.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allowed-sources
  namespace: crosty
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: UDP, port: 7777}
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        - ipBlock: {cidr: 10.42.0.0/32}  # fuji
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}  # thinkcentre
        - ipBlock: {cidr: 10.42.1.1/32}
        - ipBlock: {cidr: 10.42.2.0/32}  # mixi
        - ipBlock: {cidr: 10.42.2.1/32}
        - ipBlock: {cidr: 10.42.3.0/32}  # minima-vm
        - ipBlock: {cidr: 10.42.3.1/32}
        - ipBlock: {cidr: 10.42.4.0/32}  # edge
        - ipBlock: {cidr: 10.42.4.1/32}
