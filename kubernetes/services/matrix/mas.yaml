# Matrix Authentication Service: the login for yeetus.net's Synapse
# (docs/matrix/architecture.md "Login"). Its only way in is Keycloak (realm
# network-yeetus, client "matrix", behind the gate): no passwords, no
# registration. Two replicas, one per site; nothing on disk, its state is in
# mas-db. secrets.sops.yaml adds the keys, the Synapse shared secret and the
# Keycloak provider, loaded after this config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mas
  namespace: matrix
data:
  config.yaml: |
    http:
      public_base: https://account.yeetus.net/
      # Traefik, so the visitor's address in the logs is the real one.
      trusted_proxies: [10.42.0.0/16]
      listeners:
        - name: web
          resources:
            - name: discovery
            - name: human
            - name: oauth
            - name: compat
            - name: graphql
            - name: assets
          binds:
            - address: "[::]:8080"
        - name: internal
          resources:
            - name: health
            - name: prometheus
          binds:
            - address: "[::]:8081"

    # CNPG's generated password, from its secret as a file.
    database:
      host: mas-db-rw.matrix.svc.cluster.local
      port: 5432
      username: mas
      database: mas
      password_file: /db/password

    passwords:
      enabled: false

    # What a user may change about their account here. Name and email come
    # from Keycloak at every sign-in; there are no passwords; leaving is done
    # by an admin (docs/matrix: offboarding).
    account:
      password_registration_enabled: false
      email_change_allowed: false
      displayname_change_allowed: false
      password_change_allowed: false
      password_recovery_enabled: false
      account_deactivation_allowed: false
      login_with_email_allowed: false

    email:
      transport: blackhole

    branding:
      service_name: Yeetus Network
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas
  namespace: matrix
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app: mas}
  template:
    metadata:
      labels: {app: mas}
      annotations:
        config-revision: "1"
        monitoring.radunenu.com/scrape: "true"
        monitoring.radunenu.com/port: "8081"
        monitoring.radunenu.com/path: /metrics
    spec:
      automountServiceAccountToken: false
      priorityClassName: matrix-critical
      # One per site: losing either leaves the other answering.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels: {app: mas}
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-db
          image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
          # -U: the pod's user ID has no name in this image, and without one
          # pg_isready doesn't even try ("no attempt").
          command: ["/bin/sh", "-c", "until pg_isready -q -h mas-db-rw -p 5432 -U mas -d mas; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: mas
          image: ghcr.io/element-hq/matrix-authentication-service:1.27.0@sha256:085e37263957b3b79be85de9cfda1980b97e9653f284fba0c902445e06c200b8
          # `server` migrates the database and syncs the Keycloak provider
          # from the config before it starts serving.
          args: [server, --config, /config/config.yaml, --config, /secrets/secrets.yaml]
          ports:
            - {name: http, containerPort: 8080}
            - {name: internal, containerPort: 8081}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: internal}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: internal}
            periodSeconds: 15
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
            - {name: db, mountPath: /db, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: mas
        - name: secrets
          secret:
            secretName: mas-secrets
            defaultMode: 0440
        - name: db
          secret:
            secretName: mas-db-app
            defaultMode: 0440
            items:
              - {key: password, path: password}
---
apiVersion: v1
kind: Service
metadata:
  name: mas
  namespace: matrix
spec:
  selector: {app: mas}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mas
  namespace: matrix
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: mas}
