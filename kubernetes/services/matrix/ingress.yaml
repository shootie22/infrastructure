# How Matrix is reached (docs/matrix/architecture.md "Names"). The names are
# DNS-only CNAMEs to element.radunenu.com (tofu/), the same front door as
# c.nuke.zip: the edge passes them through to fuji's Traefik, the
# thinkcentre's within 2 s if fuji's doesn't answer, and the front checker
# moves the name to RO if the edge itself dies (#160).
#
# HTTPS only. Not routed at all: /_synapse/admin (admin API, over the
# tailnet only), /_matrix/federation and /_matrix/key (no federation).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: matrix
  namespace: matrix
spec:
  secretName: matrix-tls
  dnsNames: [matrix.yeetus.net, account.yeetus.net, rtc.yeetus.net, sfu.yeetus.net, yeetus.net]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix
  namespace: matrix
spec:
  entryPoints: [websecure]
  routes:
    # MAS's compatibility layer: the old-style login, logout and refresh go
    # to MAS, not Synapse (MAS docs, reverse proxy).
    - match: Host(`matrix.yeetus.net`) && PathRegexp(`^/_matrix/client/[^/]+/(login|logout|refresh)`)
      priority: 100
      services:
        - {name: mas, port: 8080}
    - match: Host(`matrix.yeetus.net`) && (PathPrefix(`/_matrix/client`) || PathPrefix(`/_matrix/media`) || PathPrefix(`/_synapse/client`))
      priority: 50
      services:
        - {name: synapse, port: 8008}
    - match: Host(`account.yeetus.net`)
      services:
        - {name: mas, port: 8080}
    - match: Host(`yeetus.net`) && Path(`/.well-known/matrix/client`)
      priority: 100
      services:
        - {name: wellknown, port: 8080}
    # Element Call (livekit.yaml): the token service, and LiveKit's signalling,
    # which only reaches the SFU that is ready.
    - match: Host(`rtc.yeetus.net`)
      services:
        - {name: lk-jwt-service, port: 8080}
    - match: Host(`sfu.yeetus.net`)
      services:
        - {name: livekit, port: 7880}
  tls:
    secretName: matrix-tls
---
# Plain HTTP only ever gets a redirect (cert-manager's challenges are more
# specific routes, so they still get through).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-https
  namespace: matrix
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: matrix-http
  namespace: matrix
spec:
  entryPoints: [web]
  routes:
    - match: Host(`matrix.yeetus.net`) || Host(`account.yeetus.net`) || Host(`rtc.yeetus.net`) || Host(`sfu.yeetus.net`)
      middlewares:
        - {name: to-https}
      services:
        - {name: wellknown, port: 8080}
