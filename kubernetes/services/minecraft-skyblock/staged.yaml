apiVersion: v1
kind: Namespace
metadata:
  name: minecraft-skyblock
  # Hub reaches the game agent in namespaces with this label (infra-hub #8).
  labels:
    hub.radunenu.com/games: "true"
  annotations:
    hub.radunenu.com/description: Minecraft Skyblock server, Java and Bedrock
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-skyblock
  namespace: minecraft-skyblock
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-skyblock
  template:
    metadata:
      labels:
        app: minecraft-skyblock
    spec:
      automountServiceAccountToken: false
      # Runs on whichever of fuji and the thinkcentre holds the label; the
      # other has a copy of the world and takes over when this site is gone
      # (dotfiles modules/nixos/site-failover). The copies save over RCON
      # first, so they're never caught mid-save.
      nodeSelector:
        ha.radunenu.com/minecraft-skyblock: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      terminationGracePeriodSeconds: 60
      initContainers:
        # RCON on, for the copies' save step (dotfiles site-failover). Set at
        # every start, so it holds whatever happens to server.properties.
        - name: rcon
          image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
          command: [/bin/sh, -ec]
          args:
            - |
              f=/server/server.properties
              [ -f "$f" ] || exit 0
              set_prop() {
                if grep -q "^$1=" "$f"; then sed -i "s|^$1=.*|$1=$2|" "$f"; else echo "$1=$2" >> "$f"; fi
              }
              set_prop enable-rcon true
              set_prop rcon.port 25575
              set_prop rcon.password "$RCON_PASSWORD"
              set_prop broadcast-rcon-to-ops false
          env:
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef: {name: minecraft-rcon, key: password}
          volumeMounts:
            - name: server
              mountPath: /server
      containers:
        - name: minecraft
          image: git.radunenu.com/radu/spigotmc-docker:server-v0.0.8@sha256:889d4d2f2a5c6523bed74a54b19cf155c9042ab0686032b7d6504f5b0359b0ec
          stdin: true
          tty: true
          env:
            - name: EULA
              value: "true"
            - name: BEDROCK_PORT
              value: "19132"
            - name: JAVA_VERSION
              value: "25"
            - name: JVM_MAX_RAM
              value: 8G
            - name: JVM_MIN_RAM
              value: 8G
            - name: MC_VERSION
              value: "26.1.1"
            - name: MINECRAFT_DATA_DIR
              value: /home/main/game_servers/minecraft-skyblock-apr2026
            - name: MOTD
              value: "-=[mental asylum - skyblocky]=-"
            - name: SERVER_JAR
              value: /server/spigot.jar
            - name: SERVER_PORT
              value: "25565"
          ports:
            - name: java
              containerPort: 25565
              hostPort: 25565
              protocol: TCP
            - name: bedrock
              containerPort: 19132
              hostPort: 19132
              protocol: UDP
          volumeMounts:
            - name: server
              mountPath: /server
      volumes:
        - name: server
          hostPath:
            path: /srv/ha/minecraft-skyblock
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-skyblock
  namespace: minecraft-skyblock
spec:
  selector:
    app: minecraft-skyblock
  ports:
    - name: java
      port: 25565
      targetPort: java
      protocol: TCP
    - name: bedrock
      port: 19132
      targetPort: bedrock
      protocol: UDP
