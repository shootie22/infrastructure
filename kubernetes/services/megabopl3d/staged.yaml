apiVersion: v1
kind: Namespace
metadata:
  name: megabopl3d
  annotations:
    hub.radunenu.com/description: MegaBopl3D game server, private
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: megabopl3d
  namespace: megabopl3d
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: megabopl3d
  template:
    metadata:
      labels:
        app: megabopl3d
    spec:
      automountServiceAccountToken: false
      # On whichever of fuji and the thinkcentre holds the label; the other
      # takes over when this site is gone, and the game relay follows
      # (dotfiles site-failover, stateless: nothing to copy).
      nodeSelector:
        ha.radunenu.com/megabopl3d: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      terminationGracePeriodSeconds: 30
      containers:
        - name: megabopl3d
          image: git.radunenu.com/radu/megabopl3d-server:v0.1.40@sha256:0c6c38d32d11075ca19af960a84dbb77910331098144bc5b149a9255eadf9cf0
          ports:
            - name: game
              containerPort: 24545
              hostPort: 24545
              protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: megabopl3d
  namespace: megabopl3d
spec:
  selector:
    app: megabopl3d
  ports:
    - name: game
      port: 24545
      targetPort: game
      protocol: UDP
