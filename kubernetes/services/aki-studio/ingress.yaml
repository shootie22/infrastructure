apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aki
  namespace: aki-studio
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [aki.yeetus.net]
      secretName: aki-tls
  rules:
    - host: aki.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aki
                port:
                  number: 80
