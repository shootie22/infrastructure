# The agent's settings. Bump config-revision in deployment.yaml after a
# change: they're read only at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oncall-env
  namespace: oncall
data:
  # #oncall on nuke.zip (encrypted; @oncall:nuke.zip and me in it). Its ID,
  # from Element: room settings, Advanced.
  ONCALL_MATRIX_ROOM: "!JTmaRelGXZgcAgrnzM:nuke.zip"
  # The local model writes every first report from the collected evidence,
  # with no tools (models this size get tool calls wrong). Pulled once on
  # minima: kubectl -n ollama exec deploy/ollama -- ollama pull qwen3.5:9b
  ONCALL_OLLAMA_MODEL: "qwen3.5:9b"
  ONCALL_OLLAMA_CONTEXT: "16384"
  # Claude looks further when the alert pages or is critical, or the local
  # report isn't sure. Read-only tools; it stops at the per-investigation
  # cap, and nothing more is spent once a budget is used up.
  ONCALL_CLAUDE_MODEL: "claude-opus-5"
  ONCALL_CLAUDE_EFFORT: "high"
  ONCALL_CLAUDE_MAX_USD: "1.50"
  ONCALL_BUDGET_DAY_USD: "5"
  ONCALL_BUDGET_MONTH_USD: "30"
  # More than this many incidents in an hour is a storm: listed once, not
  # investigated one by one.
  ONCALL_MAX_PER_HOUR: "10"
  # The shadow week (docs/ha/runbooks/oncall-agent.md): reports go to the
  # room only, no Pushover from the agent. Remove once its causes have
  # been right often enough.
  ONCALL_PUSHOVER: "off"
  # Host labels that aren't the machine's name in the journal and Kubernetes:
  # comin and Nebula call minima's VM minima-vm.
  ONCALL_HOST_ALIASES: "minima-vm=minima"
