# steamhappy: Matrix bot (@steamhappy:nuke.zip) answering with Ollama.
# Source and image: git.radunenu.com/radu/steamhappy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steamhappy
  namespace: steamhappy
spec:
  replicas: 1
  # Exactly one client per E2EE session: two at once would corrupt it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: steamhappy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steamhappy
    spec:
      # On whichever of fuji and the thinkcentre holds the label (home: fuji,
      # in RO like the big Ollama); the other has a copy of its session and
      # keys and takes over when this site is gone (dotfiles site-failover,
      # #150). One pod, one node: it never answers twice.
      nodeSelector:
        ha.radunenu.com/steamhappy: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # First start only: restore the session the bot had on the Mac (already
        # verified), so it needs no new device verification. Never overwrites.
        - name: restore-session
          image: git.radunenu.com/radu/steamhappy:v1.2.0-rc5@sha256:041958227dbb481b2887a514d27971c4c5512001a1b9e34fe73fc9d7a91be446
          command:
            - sh
            - -c
            - |
              if [ -f /data/session.txt ]; then
                echo "session present, not restoring"
              else
                tar -xzf /seed/seed.tgz -C /data && echo "session restored"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: steamhappy
          image: git.radunenu.com/radu/steamhappy:v1.2.0-rc5@sha256:041958227dbb481b2887a514d27971c4c5512001a1b9e34fe73fc9d7a91be446
          env:
            # Python buffers stdout without a terminal: logs would never show.
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MATRIX_PASS
              valueFrom:
                secretKeyRef:
                  name: steamhappy-env
                  key: MATRIX_PASS
            - name: OLLAMA_API_URL
              value: http://ollama.ollama.svc.cluster.local:11434/api/generate
            - name: OLLAMA_MODEL
              value: huihui_ai/deepseek-r1-abliterated
          # The bot touches /tmp/healthy while it syncs and no reply has taken
          # over 15 minutes; restart it when that stops.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import os, sys, time; sys.exit(time.time() - os.path.getmtime("/tmp/healthy") > 120)
            initialDelaySeconds: 180
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Moved off the volume on minima (move.yaml, pvc.yaml).
        - name: data
          hostPath:
            path: /srv/ha/steamhappy
            type: Directory
        - name: seed
          secret:
            secretName: steamhappy-seed
