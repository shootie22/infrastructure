# One-time move of steamhappy's data from its volume on minima to fuji, where
# site-failover takes over (#150). Removed once it's done; the volume on minima
# stays as it was.
#
# The export runs next to the volume on minima and serves a tarball; the
# import, on fuji, unpacks it beside the target and renames it into place
# last: site-failover starts the bot as soon as /home/fuji/services/steamhappy
# exists, so it must never exist half-filled. It refuses to replace a folder
# that's already there.
apiVersion: batch/v1
kind: Job
metadata:
  name: steamhappy-export
  namespace: steamhappy
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: steamhappy-export
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: minima
      containers:
        - name: export
          image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: [/bin/sh, -ec]
          args:
            - |
              # The bot's old pod stops in the same rollout; give it time.
              sleep 45
              mkdir -p /tmp/www
              tar -czf /tmp/www/data.tgz -C /data .
              ls -l /tmp/www
              timeout 1500 httpd -f -p 8080 -h /tmp/www || true
          ports:
            - {name: http, containerPort: 8080}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: steamhappy-data
---
apiVersion: v1
kind: Service
metadata:
  name: steamhappy-export
  namespace: steamhappy
spec:
  selector:
    app.kubernetes.io/name: steamhappy-export
  ports:
    - {name: http, port: 8080, targetPort: http}
---
# Its own namespace: steamhappy's egress policy covers every pod there.
apiVersion: v1
kind: Namespace
metadata:
  name: steamhappy-move
---
apiVersion: batch/v1
kind: Job
metadata:
  name: steamhappy-import
  namespace: steamhappy-move
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: fuji
      containers:
        - name: import
          image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: [/bin/sh, -ec]
          args:
            - |
              if [ -e /target/steamhappy ]; then echo "already there, not touching it"; exit 0; fi
              rm -rf /target/.steamhappy-incoming
              mkdir /target/.steamhappy-incoming
              until wget -q -O /tmp/data.tgz http://steamhappy-export.steamhappy.svc.cluster.local:8080/data.tgz; do sleep 5; done
              tar -xzf /tmp/data.tgz -C /target/.steamhappy-incoming
              chmod 0755 /target/.steamhappy-incoming
              ls -ln /target/.steamhappy-incoming
              mv /target/.steamhappy-incoming /target/steamhappy
              echo moved
          volumeMounts:
            - {name: target, mountPath: /target}
      volumes:
        - name: target
          hostPath:
            path: /home/fuji/services
            type: Directory
