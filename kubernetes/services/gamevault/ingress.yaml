# All of it behind GameVault's own sign-in (Keycloak, network-yeetus, the
# games group). DNS only (grey cloud) in Cloudflare, like share.yeetus.net:
# downloads are whole games, which the proxy's terms don't allow, and it
# cuts uploads at 100 MB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gamevault
  namespace: gamevault
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: Games
    gethomepage.dev/icon: gamevault.png
    gethomepage.dev/description: Our game library
    gethomepage.dev/weight: "140"
    gethomepage.dev/siteMonitor: http://gamevault.gamevault.svc.cluster.local/api/status
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - games.yeetus.net
      secretName: games-yeetus-net-tls
  rules:
    - host: games.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gamevault
                port:
                  number: 80
