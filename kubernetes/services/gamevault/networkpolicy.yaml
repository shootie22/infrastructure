# Who may connect into gamevault: everyone's accounts and save files are
# here; only Traefik needs GameVault. Like joplin/networkpolicy.yaml: the
# nodes are allowed through their flannel and cni0 addresses (health checks,
# host-network proxies), and a new node needs its two addresses here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allowed-sources
  namespace: gamevault
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
        # Scraping (Prometheus) and the status page's probes (blackbox).
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        # CloudNativePG's operator, for the database here.
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
        - ipBlock: {cidr: 10.42.0.0/32}  # fuji
        - ipBlock: {cidr: 10.42.0.1/32}
        - ipBlock: {cidr: 10.42.1.0/32}  # thinkcentre
        - ipBlock: {cidr: 10.42.1.1/32}
        - ipBlock: {cidr: 10.42.2.0/32}  # mixi
        - ipBlock: {cidr: 10.42.2.1/32}
        - ipBlock: {cidr: 10.42.3.0/32}  # minima-vm
        - ipBlock: {cidr: 10.42.3.1/32}
        - ipBlock: {cidr: 10.42.4.0/32}  # edge
        - ipBlock: {cidr: 10.42.4.1/32}
---
# GameVault reaches its Postgres and, on 443, Keycloak (auth.yeetus.net, for
# the sign-in), IGDB and Twitch (metadata) and GitHub (the web UI, at start).
# No mail is sent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gamevault-egress
  namespace: gamevault
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gamevault
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: gamevault-pg
      ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
