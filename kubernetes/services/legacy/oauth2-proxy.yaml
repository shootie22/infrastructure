# The login in front of the page, used by Traefik forwardAuth (ingress.yaml).
# Its root has a static 202 upstream: a valid session answers 202 and Traefik
# passes the request on to Caddy; no session answers a redirect to Keycloak.
#
# Realm network-admin, client legacy, and only someone with its client role
# access gets in (that's me). Secrets come from legacy-oauth2 in
# secret.sops.yaml, made by scripts/create-legacy-oauth2-secret.sh. Sessions
# live in the cookie, so the two copies need nothing shared but its secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: legacy
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      automountServiceAccountToken: false
      # One per site (fuji, the thinkcentre), like the page itself.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [fuji, thinkcentre]}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: oauth2-proxy
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      # oauth2-proxy reads Keycloak's settings once at startup and exits if
      # Keycloak doesn't answer, then sits out the restart backoff. Start it
      # only once Keycloak answers (same as send).
      initContainers:
        - name: wait-for-keycloak
          image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
          command: ["sh", "-c"]
          args:
            - until wget -q -T 5 -O /dev/null "$OAUTH2_PROXY_OIDC_ISSUER_URL/.well-known/openid-configuration"; do sleep 5; done
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://auth.yeetus.net/realms/network-admin
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --client-id=legacy
            - --code-challenge-method=S256
            - --allowed-role=legacy:access
            - --email-domain=*
            - --redirect-url=https://legacy.yeetus.net/oauth2/callback
            - --reverse-proxy=true
            - --upstream=static://202
            - --skip-provider-button=true
            - --cookie-name=_legacy_session
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --silence-ping-logging=true
          env:
            # Keycloak realm network-admin (docs/ha/keycloak-sso.md).
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://auth.yeetus.net/realms/network-admin
          envFrom:
            # OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
            - secretRef: {name: legacy-oauth2}
          ports:
            - {name: http, containerPort: 4180}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
  # No third site for a surge pod, so replace one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
