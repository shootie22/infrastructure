# legacy.yeetus.net: one page about the old pages and APIs that came back
# from the backups (#73) and run in legacy-web and legacy-redirects. Behind
# the network-admin login (ingress.yaml), so it's only for me.
#
# Jersey 10 and Monocraft (subset to ASCII) are inlined, both OFL, so the
# page needs nothing from elsewhere. After changing the page, bump
# config-revision in deployment.yaml: Caddy reads the files once at start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-site
  namespace: legacy
data:
  Caddyfile: |
    {
        auto_https off
        admin off
    }

    :8080 {
        respond /healthz 200

        header {
            Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; font-src data:; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
            X-Content-Type-Options nosniff
            Referrer-Policy no-referrer
            Cache-Control no-store
            -Server
        }

        root * /srv
        file_server
    }
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Legacy</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22-1%20-1%2018%2017%22%20shape-rendering%3D%22crispEdges%22%3E%3Crect%20x%3D%225%22%20y%3D%220%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%23c4e538%22%2F%3E%3Crect%20x%3D%220%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%238bac0f%22%2F%3E%3Crect%20x%3D%2210%22%20y%3D%229%22%20width%3D%226%22%20height%3D%226%22%20fill%3D%22%234d7a1f%22%2F%3E%3C%2Fsvg%3E">
    <meta name="description" content="The old pages and APIs that came back from the backups.">
    <style>
    @font-face { font-family: "Jersey 10"; src: url(data:font/woff2;base64,) format("woff2"); font-display: swap; }
    @font-face { font-family: "Jersey 10"; src: url(data:font/woff2;base64,) format("woff2"); font-display: swap; unicode-range: U+0102-0103, U+015E-0163, U+0218-021B; }
    @font-face { font-family: "Monocraft"; src: url(data:font/woff2;base64,) format("woff2"); font-display: swap; }
    :root { color-scheme: dark; --night: #0e0f1a; --panel: #161827; --edge: #2a2d48; --text: #e6e7f0; --dim: #a4a8c4; --mute: #8f93b3; --green: #c4e538; --orange: #ff9a3c; --gold: #ffd98a; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 24px; }
    body { margin: 0; min-height: 100vh; background: var(--night) radial-gradient(ellipse 90% 45% at 50% 110%, rgba(86, 104, 200, 0.25), transparent 72%) fixed; color: var(--text); font-family: "Jersey 10", ui-monospace, monospace; font-size: 22px; line-height: 1.3; -webkit-font-smoothing: none; display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 56px 16px 40px; }
    a { color: var(--gold); }
    p { margin: 0; }
    h1, h2, h3 { margin: 0; font-weight: 400; }
    code, pre, .mono { font-family: "Monocraft", ui-monospace, monospace; font-size: 15px; line-height: 1.5; }
    header { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; max-width: 620px; }
    h1 { font-size: 80px; line-height: 0.9; color: var(--green); text-shadow: 4px 4px 0 #1d2035; }
    .dim { color: var(--dim); }
    .chip { font-size: 16px; padding: 2px 10px; background: #23264a; color: var(--gold); white-space: nowrap; }
    .chip.green { color: var(--green); }
    nav { display: flex; gap: 12px; }
    .btn { display: inline-flex; align-items: center; padding: 6px 18px; background: #2c2f4f; color: var(--text); text-decoration: none; box-shadow: inset 3px 3px 0 #3d4170, inset -3px -3px 0 #1f2138; }
    .btn:hover, .btn:focus-visible { background: var(--orange); color: #2a1000; box-shadow: inset 3px 3px 0 #ffc98f, inset -3px -3px 0 #c8641a; outline: none; }
    main { width: 100%; max-width: 860px; display: flex; flex-direction: column; gap: 56px; }
    section { display: flex; flex-direction: column; gap: 20px; }
    .card { padding: 20px; background: var(--panel); box-shadow: 0 -4px 0 0 var(--edge), 0 4px 0 0 var(--edge), -4px 0 0 0 var(--edge), 4px 0 0 0 var(--edge); display: flex; flex-direction: column; gap: 12px; }
    .card h3 { font-size: 30px; color: #ffffff; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .stats .card { align-items: center; text-align: center; gap: 2px; padding: 14px 8px; }
    .stats b { font-weight: 400; font-size: 44px; line-height: 1; color: var(--green); }
    .stats span { font-size: 18px; color: var(--mute); }
    .head { display: flex; flex-direction: column; gap: 6px; }
    h2 { font-size: 48px; line-height: 1; color: var(--green); text-shadow: 3px 3px 0 #1d2035; }
    .versions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .versions div { background: #1c1f33; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
    .versions b { font-weight: 400; color: var(--green); font-size: 26px; }
    .versions code { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .ep { overflow-wrap: anywhere; }
    .ep a { text-decoration: none; }
    .ep a:hover, .ep a:focus-visible { text-decoration: underline; }
    dl { margin: 0; display: grid; grid-template-columns: 96px 1fr; gap: 8px 16px; }
    dt { color: var(--mute); font-size: 18px; padding-top: 2px; }
    dd { margin: 0; }
    pre { margin: 0; padding: 12px 14px; background: #0b0c16; color: #c9cce0; white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: inset 0 0 0 2px #1c1f33; }
    .pages { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
    .pages .card { transition: transform 0.15s ease-out; }
    .pages .card:hover { transform: translateY(-4px); box-shadow: 0 -4px 0 0 var(--orange), 0 4px 0 0 var(--orange), -4px 0 0 0 var(--orange), 4px 0 0 0 var(--orange); }
    .pages .state { font-size: 18px; color: var(--mute); margin-top: auto; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 20px; }
    th, td { padding: 6px 12px; text-align: left; border: 2px solid var(--edge); vertical-align: top; }
    th { background: #1c1f33; font-weight: 400; color: var(--green); }
    td code { font-size: 14px; }
    footer { font-size: 16px; color: var(--mute); text-align: center; display: flex; flex-direction: column; gap: 4px; }
    @media (max-width: 640px) {
      body { padding-top: 40px; font-size: 20px; }
      h1 { font-size: 64px; }
      h2 { font-size: 40px; }
      .stats, .versions { grid-template-columns: repeat(2, 1fr); }
      dl { grid-template-columns: 1fr; gap: 2px; }
      dd { margin-bottom: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .pages .card { transition: none; } }
    </style>
    </head>
    <body>
    <header>
    <span class="chip">admin only</span>
    <h1>Legacy</h1>
    <p class="dim">Old sites and APIs, pulled back out of the backups and running again.</p>
    <nav><a class="btn" href="#apis">APIs</a><a class="btn" href="#pages">Pages</a></nav>
    </header>
    <main>

    <section>
    <div class="stats">
    <div class="card"><b>10</b><span>API endpoints</span></div>
    <div class="card"><b>5</b><span>pages</span></div>
    <div class="card"><b>9</b><span>old names forwarded</span></div>
    <div class="card"><b>2 GB</b><span>of recovered files</span></div>
    </div>
    <div class="card">
    <h3>Where this came from</h3>
    <p>All of this lived on the Dell server and the old OVH box. The files came back out of the Dell's Borg archive on the 4 TB disk (#73), and it has all been online again since 23 September 2026.</p>
    <p>One Apache pod, <code>legacy-web</code>, serves every API and page here. It runs on fuji; the thinkcentre keeps a copy of the files and takes over if fuji's site goes away. The PHP and the data sit in <code>/srv/ha/legacy-web</code>, not in Git.</p>
    <p class="dim">Up or down right now: <a href="https://radunenu.com/status/">the status page</a>, under "Legacy API".</p>
    </div>
    </section>

    <section id="apis">
    <div class="head">
    <h2>APIs</h2>
    <p class="dim">Plain GETs, no keys, no login. Only the read side is listed: how the scores got written is in the PHP, which isn't in Git.</p>
    </div>
    <div class="versions">
    <div><b>v1</b><code>news.kronorite.com</code></div>
    <div><b>v2</b><code>stats.kronorite.com</code></div>
    <div><b>v2.5</b><code>stats.kronorite.com<wbr>/vtol</code></div>
    <div><b>v3</b><code>api.byradu.com</code></div>
    </div>
    <p class="dim">The version numbers are only how the status page groups them. On disk the leaderboards are in <code>v2/stats/</code> and also answer from the top of the folder, Dice Katana and the plugin check only sit at the top, and there never was a <code>v2.5/</code> folder. Every path below also works on <code>api-old.radunenu.com</code>, which points at the whole folder.</p>

    <article class="card">
    <div class="top"><h3>Kronorite news</h3><div class="chips"><span class="chip green">v1</span><span class="chip">JSON</span></div></div>
    <p class="ep mono"><a href="https://news.kronorite.com/news.php">news.kronorite.com/news.php</a></p>
    <dl>
    <dt>What it does</dt><dd>One message for the game to show, in a single field. Line breaks are inside the string.</dd>
    <dt>Returns</dt><dd><pre>{"News":"Preparing for the\nOpen Beta!"}</pre></dd>
    <dt>Used by</dt><dd><a href="https://store.steampowered.com/app/876780/Kronorite/">Kronorite</a>, the 5v5 arcade game from NOC-Studios, out on Steam on 21 September 2019. It still says that.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>Quick Maze</h3><div class="chips"><span class="chip green">v2</span><span class="chip">30 names</span></div></div>
    <p class="ep mono"><a href="https://stats.kronorite.com/mazegame/leaderboard.php">stats.kronorite.com/mazegame/leaderboard.php</a></p>
    <dl>
    <dt>What it does</dt><dd>The whole board in one response, name to score, sorted by name. Scores are strings, and it goes out as <code>text/html</code> even though it's JSON. POLYSPACE, both VTOL boards and DICE // KATANA use the same format.</dd>
    <dt>Returns</dt><dd><pre>{… "Axel":"3","GamerTime":"1","Kalinikovj":"1", …}</pre></dd>
    <dt>Used by</dt><dd><a href="https://shootie.itch.io/quick-maze">Quick Maze</a>, an Unreal maze runner made in 3 days, around 2020. amazinggaming is still first with 69.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>Cowo</h3><div class="chips"><span class="chip green">v2</span><span class="chip">9 people</span></div></div>
    <p class="ep mono"><a href="https://stats.kronorite.com/cowo/leaderboard.php">stats.kronorite.com/cowo/leaderboard.php</a></p>
    <dl>
    <dt>What it does</dt><dd>Not JSON. Discord mentions and points run together as <code>&lt;@id&gt; - points</code>, ready to drop into a message as is. Two empty slots trail at the end.</dd>
    <dt>Returns</dt><dd><pre>&lt;@1676…1872&gt; - 341&lt;@2105…3680&gt; - 141&lt;@1977…2145&gt; - 94 …</pre></dd>
    <dt>Used by</dt><dd>Cowo, a Discord bot. No public link for it yet.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>Cowo IGAD</h3><div class="chips"><span class="chip green">v2</span><span class="chip">3 people</span></div></div>
    <p class="ep mono"><a href="https://stats.kronorite.com/cowo-igad/leaderboard.php">stats.kronorite.com/cowo-igad/leaderboard.php</a></p>
    <dl>
    <dt>What it does</dt><dd>Same bot, its own board, same format. Nobody got past 2 points.</dd>
    <dt>Returns</dt><dd><pre>&lt;@1455…2448&gt; - 1&lt;@2109…0490&gt; - 1&lt;@2318…7122&gt; - 2 …</pre></dd>
    <dt>Used by</dt><dd>Cowo again. No public link.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>POLYSPACE</h3><div class="chips"><span class="chip green">v2</span><span class="chip">22 names</span></div></div>
    <p class="ep mono"><a href="https://stats.kronorite.com/polyspace/leaderboard.php">stats.kronorite.com/polyspace/leaderboard.php</a></p>
    <dl>
    <dt>What it does</dt><dd>Name to score, like Quick Maze. The game side was C++, this side PHP.</dd>
    <dt>Returns</dt><dd><pre>{… "Gobi":"83737", … "luca":"18273", … "shootie":"4919", …}</pre></dd>
    <dt>Used by</dt><dd><a href="https://nradu.itch.io/polyspace">POLYSPACE</a>, a UE4 speedrun platformer about grabbing orbs. Won week 1 of the BUas Intro to Unreal jam, October 2020. Gobi is more than four times ahead of second place.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>VTOL: Divided Skies</h3><div class="chips"><span class="chip green">v2.5</span><span class="chip">212 machines</span></div></div>
    <p class="ep mono"><a href="https://stats.kronorite.com/vtol/1/leaderboard.php">stats.kronorite.com/vtol/1/leaderboard.php</a></p>
    <dl>
    <dt>What it does</dt><dd>No names here: each score is keyed by the PC, its Windows computer name plus a hash, cut to 20 characters. No login needed, one score per machine.</dd>
    <dt>Returns</dt><dd><pre>{… "DESKTOP-K6RN68D-FC5E":"8408", … "rob-E26C2C9E47CCF0E6":"9696", …}</pre></dd>
    <dt>Used by</dt><dd><a href="https://store.steampowered.com/app/2163100/Divided_Skies/">Divided Skies</a>, the free hoverbike game by Our Sun, a BUas student team. Early access in May 2023, out in June. The biggest board here by far.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>VTOL</h3><div class="chips"><span class="chip green">v2.5</span><span class="chip">43 machines</span></div></div>
    <p class="ep mono"><a href="https://stats.kronorite.com/vtol/2/leaderboard.php">stats.kronorite.com/vtol/2/leaderboard.php</a></p>
    <dl>
    <dt>What it does</dt><dd>A second board in the same format. The top score came from a Steam Deck.</dd>
    <dt>Returns</dt><dd><pre>{… "melchior-24320334405":"9159", … "steamdeck-C3A0E4D44E":"10503", …}</pre></dd>
    <dt>Used by</dt><dd>Which build wrote to this one isn't written down. No link yet.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>DICE // KATANA</h3><div class="chips"><span class="chip green">v3</span><span class="chip">35 names</span></div></div>
    <p class="ep mono"><a href="https://api.byradu.com/dicekatana/leaderboard.php">api.byradu.com/dicekatana/leaderboard.php</a></p>
    <dl>
    <dt>What it does</dt><dd>The v2 format again, just on the newer <code>api.byradu.com</code> name.</dd>
    <dt>Returns</dt><dd><pre>{"ABE":"50375","Alucard":"28325","Avid Frog Enthusiast":"8400", …}</pre></dd>
    <dt>Used by</dt><dd><a href="https://nradu.itch.io/dice-katana">DICE // KATANA</a>, an arena FPS for the GMTK Game Jam 2022, where dice rolls pick your gun and the level.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>Feedback Survey Plugin</h3><div class="chips"><span class="chip green">v3</span><span class="chip">JSON</span></div></div>
    <p class="ep mono"><a href="https://api.byradu.com/fsp/downloads/latest.php">api.byradu.com/fsp/downloads/latest.php</a></p>
    <dl>
    <dt>What it does</dt><dd>The update check. The plugin compared its own version with this and told the developer when theirs was out of date.</dd>
    <dt>Returns</dt><dd><pre>{"LatestVersion":"1.5"}</pre></dd>
    <dt>Used by</dt><dd>The <a href="https://radunenu.com/posts/ue5_feedback_plugin/">UE4/5 feedback plugin</a> from June 2022: players send feedback and bug reports, with a screenshot, from inside the game. Never had a store page.</dd>
    </dl>
    </article>

    <article class="card">
    <div class="top"><h3>Health check</h3><div class="chips"><span class="chip green">root</span><span class="chip">text</span></div></div>
    <p class="ep mono"><a href="https://api-old.radunenu.com/health-check.html">api-old.radunenu.com/health-check.html</a></p>
    <dl>
    <dt>What it does</dt><dd>A static file. If Apache can hand it out, the rest is probably fine too.</dd>
    <dt>Returns</dt><dd><pre>yep that works</pre></dd>
    <dt>Used by</dt><dd>The pod's readiness probe and the status page.</dd>
    </dl>
    </article>
    </section>

    <section id="pages">
    <div class="head">
    <h2>Pages</h2>
    <p class="dim">Served the way they were, apart from the cats, which got a new gallery.</p>
    </div>
    <div class="pages">
    <article class="card">
    <div class="top"><h3>Aki &amp; Kairi</h3><span class="chip">rebuilt</span></div>
    <p class="ep mono"><a href="https://cats.yeetus.net">cats.yeetus.net</a></p>
    <p>Photos and videos of the two cats. The old file browser and the originals stay hidden; the gallery is new, from 13 October 2026.</p>
    <p class="state">Old names: cats.radunenu.com, aki.kronorite.com, kairi.kronorite.com</p>
    </article>
    <article class="card">
    <div class="top"><h3>Săptămâna celor 7 arte</h3><span class="chip">as it was</span></div>
    <p class="ep mono"><a href="https://archive.radunenu.com">archive.radunenu.com</a></p>
    <p>A site for a week of art workshops for students, made for Costin. The template's lorem ipsum is still in it.</p>
    <p class="state">Also on 7zile7arte.byradu.com</p>
    </article>
    <article class="card">
    <div class="top"><h3>Kronos: Rite of Passage</h3><span class="chip">as it was</span></div>
    <p class="ep mono"><a href="https://kronorite.com/atestat/">kronorite.com/atestat</a></p>
    <p>A launch page in Romanian for a game "out on 23 November 2020", made with Rareș Badea.</p>
    <p class="state">Static HTML</p>
    </article>
    <article class="card">
    <div class="top"><h3>Bring Back the old Minecraft</h3><span class="chip">as it was</span></div>
    <p class="ep mono"><a href="https://kronorite.com/bbtom/">kronorite.com/bbtom</a></p>
    <p>The download page for the old Minecraft server's world and files, put up as promised to the players.</p>
    <p class="state">The 934 MB zip still downloads</p>
    </article>
    <article class="card">
    <div class="top"><h3>Analytix</h3><span class="chip">data lost</span></div>
    <p class="ep mono"><a href="https://analytics.byradu.com">analytics.byradu.com</a></p>
    <p>A uni project from October 2021: games sent their playtest stats here and each team signed in to see theirs. The database didn't make it, so it's one page about what it was.</p>
    <p class="state">Code kept, data gone</p>
    </article>
    </div>

    <div class="card">
    <h3>Old names that forward</h3>
    <div class="scroll">
    <table>
    <tr><th>Old name</th><th>Goes to</th></tr>
    <tr><td><code>kronorite.com</code></td><td>Kronorite on Steam, and so do the old blog paths</td></tr>
    <tr><td><code>discord.kronorite.com</code></td><td>The Kronorite Discord invite</td></tr>
    <tr><td><code>git.kronorite.com</code></td><td><code>git.radunenu.com</code></td></tr>
    <tr><td><code>byradu.com</code>, <code>cubi.tube</code>, <code>cubtube.lol</code></td><td><code>radunenu.com</code>, path kept</td></tr>
    <tr><td><code>cats.radunenu.com</code>, <code>aki.kronorite.com</code>, <code>kairi.kronorite.com</code></td><td><code>cats.yeetus.net</code></td></tr>
    </table>
    </div>
    </div>
    </section>
    </main>
    <footer>
    <p>legacy.yeetus.net, part of the <a href="https://yeetus.net">Yeetus Network</a></p>
    <p>Responses captured on 14 October 2026</p>
    </footer>
    </body>
    </html>
