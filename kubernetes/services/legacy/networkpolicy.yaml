# The page needs no network egress at all. oauth2-proxy only needs DNS and
# HTTPS to reach Keycloak at auth.yeetus.net.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legacy-no-egress
  namespace: legacy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: legacy
  policyTypes:
    - Egress
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oauth2-proxy-egress
  namespace: legacy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
