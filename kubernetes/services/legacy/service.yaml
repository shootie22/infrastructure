apiVersion: v1
kind: Service
metadata:
  name: legacy
  namespace: legacy
spec:
  selector:
    app.kubernetes.io/name: legacy
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: legacy
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - {name: http, port: 80, targetPort: http}
