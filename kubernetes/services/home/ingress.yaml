apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  namespace: home
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: Home
    gethomepage.dev/description: Every service on Yeetus Network
    gethomepage.dev/weight: "100"
    gethomepage.dev/siteMonitor: http://home.home.svc.cluster.local:8080/healthz
spec:
  ingressClassName: traefik
  tls:
    - hosts: [yeetus.net]
      secretName: hub-radunenu-com-le
  rules:
    - host: yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home
                port:
                  number: 8080
---
# Every other name for Home (www, hub, and the easier ones on both domains)
# sends people to yeetus.net with the path kept.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-home
  namespace: home
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)$
    replacement: https://yeetus.net${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-aliases
  namespace: home
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: home-to-home@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [www.yeetus.net, hub.yeetus.net, apps.yeetus.net, net.yeetus.net, network.yeetus.net, services.yeetus.net, yippie.yeetus.net, hub.radunenu.com, apps.radunenu.com, net.radunenu.com, network.radunenu.com, services.radunenu.com, yippie.radunenu.com]
      secretName: hub-radunenu-com-le
  rules:
    - host: www.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home
                port:
                  number: 8080
