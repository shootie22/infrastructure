# One certificate for Home (yeetus.net) and every name that sends people
# to it. HTTP-01, like the other sites. Same name and secret as when Home
# was hub.radunenu.com, so the old certificate keeps serving until the new one
# is issued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hub-radunenu-com
  namespace: home
spec:
  secretName: hub-radunenu-com-le
  dnsNames:
    - yeetus.net
    - www.yeetus.net
    - hub.yeetus.net
    - apps.yeetus.net
    - net.yeetus.net
    - network.yeetus.net
    - services.yeetus.net
    - yippie.yeetus.net
    - hub.radunenu.com
    - apps.radunenu.com
    - net.radunenu.com
    - network.radunenu.com
    - services.radunenu.com
    - yippie.radunenu.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
