# maec.yeetus.net: everything behind the yeetus sign-in (oauth2-proxy.yaml).
# Headers a browser sends that look like oauth2-proxy's are dropped first,
# then forwardAuth sets the real ones; X-Auth-Request-Access-Token reaches
# the site, which gives it to the browser build (/session.json).
#
# DNS only (tofu/dns-records.tf): launcher downloads through Cloudflare's
# proxy would break its terms, and long game WebSockets get cut there.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-identity
  namespace: maec
spec:
  headers:
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Preferred-Username: ""
      X-Auth-Request-Email: ""
      X-Auth-Request-Groups: ""
      X-Auth-Request-Access-Token: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: login
  namespace: maec
spec:
  forwardAuth:
    address: http://oauth2-proxy.maec.svc.cluster.local/
    authResponseHeaders:
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Access-Token
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maec
  namespace: maec
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: maec-strip-identity@kubernetescrd,maec-login@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Games
    gethomepage.dev/name: Mental Asylum
    gethomepage.dev/icon: mdi-gamepad-variant-outline
    gethomepage.dev/description: Friends' minigame hub
    gethomepage.dev/siteMonitor: http://maec.maec.svc.cluster.local/healthz
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - maec.yeetus.net
      secretName: maec-yeetus-net-tls
  rules:
    - host: maec.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maec
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy
  namespace: maec
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - maec.yeetus.net
      secretName: maec-yeetus-net-tls
  rules:
    - host: maec.yeetus.net
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80
