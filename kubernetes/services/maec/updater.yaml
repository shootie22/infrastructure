# Every 2 minutes: compare the registry's :dev digest with what the pod runs
# and restart onto a new build, but only once nobody is playing, or after
# the new build has waited 30 minutes (players are then sent through the
# game's own update and straight back in). While it waits, the Deployment
# carries the annotation maec.radunenu.com/update-waiting-since.
# The image is private (organization maec): the registry is asked with the
# pull secret's credentials (registry-secret.sops.yaml).
# Run by hand: kubectl -n maec create job --from=cronjob/maec-updater manual-1
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maec-updater
  namespace: maec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maec-updater
  namespace: maec
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["maec"]
    verbs: ["get", "patch"]
  # rollout status watches the ReplicaSets and the Deployment (as in
  # crosty/updater.yaml: a list can't be limited to one name).
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maec-updater
  namespace: maec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maec-updater
subjects:
  - kind: ServiceAccount
    name: maec-updater
    namespace: maec
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maec-updater
  namespace: maec
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: maec-updater
          restartPolicy: Never
          containers:
            - name: updater
              image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  repo=maec/maec
                  auth=$(jq -r '.auths["git.radunenu.com"].auth' /etc/registry/.dockerconfigjson)
                  token=$(curl -fsS -H "Authorization: Basic $auth" \
                    "https://git.radunenu.com/v2/token?service=container_registry&scope=repository:$repo:pull" | jq -r .token)
                  latest=$(curl -fsSI \
                    -H "Authorization: Bearer $token" \
                    -H "Accept: application/vnd.oci.image.index.v1+json" \
                    -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
                    -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                    -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                    "https://git.radunenu.com/v2/$repo/manifests/dev" \
                    | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')
                  [ -n "$latest" ] || { echo "no digest from registry"; exit 1; }

                  running=$(kubectl get pods -l app=maec \
                    -o jsonpath='{range .items[*]}{.status.containerStatuses[0].imageID}{"\n"}{end}' \
                    | sed -n 's/.*@//p' | sort -u)
                  echo "registry dev: $latest"
                  echo "running: $(echo $running)"
                  if [ -z "$running" ]; then
                    echo "no running pod, nothing to compare"
                    exit 0
                  fi
                  if [ "$running" = "$latest" ]; then
                    kubectl annotate deployment/maec maec.radunenu.com/update-waiting-since- >/dev/null 2>&1 || true
                    echo "up to date"
                    exit 0
                  fi

                  # Who is playing (the hub's summary, served by the site).
                  online=$(curl -fsS --max-time 5 http://maec.maec.svc.cluster.local/status | jq -r '.online // 0' || echo 0)
                  now=$(date +%s)
                  since=$(kubectl get deployment/maec -o jsonpath='{.metadata.annotations.maec\.radunenu\.com/update-waiting-since}')
                  if [ "$online" -gt 0 ]; then
                    if [ -z "$since" ]; then
                      kubectl annotate deployment/maec maec.radunenu.com/update-waiting-since="$now" --overwrite
                      since=$now
                    fi
                    if [ $((now - since)) -lt 1800 ]; then
                      echo "new build waiting: $online playing, $(( (now - since) / 60 )) of 30 minutes"
                      exit 0
                    fi
                    echo "waited 30 minutes; restarting with $online playing"
                  fi
                  echo "new build, restarting"
                  kubectl annotate deployment/maec maec.radunenu.com/update-waiting-since- >/dev/null 2>&1 || true
                  kubectl rollout restart deployment/maec
                  kubectl rollout status deployment/maec --timeout=5m
              volumeMounts:
                - name: registry
                  mountPath: /etc/registry
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: registry
              secret:
                secretName: maec-registry
