# Every 2 minutes: compare the registry's :dev digest with what the pod runs.
# A new build is written to the ConfigMap maec-update (key "pending"), which
# the pod reads: the game tells its players an update is waiting. The game
# decides when it may restart (/status "restart_ok": nobody online, or an
# admin asked and no match is on; radu/maec docs/architecture.md), and only
# then does this restart the Deployment. Players come back on the new build.
# The image is private (organization mentalasylum): the registry is asked
# with the pull secret's credentials (registry-secret.sops.yaml).
# Run by hand: kubectl -n maec create job --from=cronjob/maec-updater manual-1
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maec-updater
  namespace: maec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: maec-updater
  namespace: maec
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["maec"]
    verbs: ["get", "patch"]
  # rollout status watches the ReplicaSets and the Deployment (as in
  # crosty/updater.yaml: a list can't be limited to one name).
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
  # The "a build is waiting" note for the game (created here, not in git).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["maec-update"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maec-updater
  namespace: maec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: maec-updater
subjects:
  - kind: ServiceAccount
    name: maec-updater
    namespace: maec
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: maec-updater
  namespace: maec
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 100
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          serviceAccountName: maec-updater
          restartPolicy: Never
          containers:
            - name: updater
              image: docker.io/alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
              command: ["/bin/sh", "-euc"]
              args:
                - |
                  repo=mentalasylum/maec
                  auth=$(jq -r '.auths["git.radunenu.com"].auth' /etc/registry/.dockerconfigjson)
                  token=$(curl -fsS -H "Authorization: Basic $auth" \
                    "https://git.radunenu.com/v2/token?service=container_registry&scope=repository:$repo:pull" | jq -r .token)
                  latest=$(curl -fsSI \
                    -H "Authorization: Bearer $token" \
                    -H "Accept: application/vnd.oci.image.index.v1+json" \
                    -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
                    -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                    -H "Accept: application/vnd.oci.image.manifest.v1+json" \
                    "https://git.radunenu.com/v2/$repo/manifests/dev" \
                    | tr -d '\r' | awk -F': ' 'tolower($1) == "docker-content-digest" { print $2 }')
                  [ -n "$latest" ] || { echo "no digest from registry"; exit 1; }

                  running=$(kubectl get pods -l app=maec \
                    -o jsonpath='{range .items[*]}{.status.containerStatuses[0].imageID}{"\n"}{end}' \
                    | sed -n 's/.*@//p' | sort -u)
                  echo "registry dev: $latest"
                  echo "running: $(echo $running)"
                  if [ -z "$running" ]; then
                    echo "no running pod, nothing to compare"
                    exit 0
                  fi
                  note() {
                    kubectl create configmap maec-update --from-literal=pending="$1" --dry-run=client -o yaml | kubectl apply -f - >/dev/null
                  }
                  if [ "$running" = "$latest" ]; then
                    note ""
                    echo "up to date"
                    exit 0
                  fi

                  # Tell the game (it reads the ConfigMap within a minute or two),
                  # then restart only when it says so.
                  note "$latest"
                  ok=$(curl -fsS --max-time 5 http://maec.maec.svc.cluster.local/status | jq -r '.restart_ok // false' || echo false)
                  if [ "$ok" != "true" ]; then
                    echo "new build waiting for the game to allow a restart"
                    exit 0
                  fi
                  echo "new build, the game allows it: restarting"
                  # Cleared first, so the new pod doesn't announce an update it already has.
                  note ""
                  kubectl rollout restart deployment/maec
                  kubectl rollout status deployment/maec --timeout=5m
              volumeMounts:
                - name: registry
                  mountPath: /etc/registry
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: registry
              secret:
                secretName: maec-registry
