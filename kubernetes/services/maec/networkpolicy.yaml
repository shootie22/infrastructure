# The game ports (UDP 24600-24615) are open to everyone: native players
# connect straight to them, and a server lets nobody in before their token
# checks out. The site only takes Traefik, oauth2-proxy only Traefik, and
# both take the namespace itself and monitoring (status probes).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allowed-sources
  namespace: maec
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: UDP, port: 24600, endPort: 24615}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - podSelector: {}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 4180}
