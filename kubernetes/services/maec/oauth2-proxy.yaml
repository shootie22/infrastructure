# Login gate for all of maec.yeetus.net, used by Traefik forwardAuth
# (ingress.yaml): nothing of the site, the browser build or the downloads is
# served without a yeetus sign-in. oauth2-proxy's root answers 202 for a valid
# session and a redirect to Keycloak otherwise.
#
# Only users with the maec client's access role pass (the maec group gives
# it; Keycloak's gate flow checks it too). The launcher downloads with its own
# access token (--skip-jwt-bearer-tokens: issuer and audience are checked).
# The browser build needs the session's access token for the game servers:
# --pass-access-token and --set-xauthrequest put it in
# X-Auth-Request-Access-Token, which Traefik forwards (ingress.yaml) and the
# site hands to the page at /session.json. --cookie-refresh keeps it fresh.
#
# Secrets (client secret, cookie secret) come from maec-secrets in
# secret.sops.yaml; scripts/create-maec-secrets.sh makes it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: maec
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
    spec:
      priorityClassName: service
      automountServiceAccountToken: false
      # With the game servers, so the site and the games move together.
      nodeSelector:
        ha.radunenu.com/maec: active
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      # oauth2-proxy reads Keycloak's settings once at startup and exits if
      # Keycloak doesn't answer (send/oauth2-proxy.yaml, drill on 2026-10-07).
      initContainers:
        - name: wait-for-keycloak
          image: docker.io/library/busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sh", "-c"]
          args:
            - until wget -q -T 5 -O /dev/null "$OAUTH2_PROXY_OIDC_ISSUER_URL/.well-known/openid-configuration"; do sleep 5; done
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://auth.yeetus.net/realms/network-yeetus
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {memory: 32Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6@sha256:c3415e8660af553f5e18f5d90db050614c02493c0ac6260ac59442f6d9b12048
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --client-id=maec
            - --code-challenge-method=S256
            - --allowed-role=maec:access
            - --email-domain=*
            - --redirect-url=https://maec.yeetus.net/oauth2/callback
            - --reverse-proxy=true
            - --upstream=static://202
            - --skip-provider-button=true
            - --skip-jwt-bearer-tokens=true
            - --extra-jwt-issuers=https://auth.yeetus.net/realms/network-yeetus=maec
            - --pass-access-token=true
            - --set-xauthrequest=true
            - --cookie-name=_maec_session
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-refresh=5m
            - --cookie-expire=720h
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_OIDC_ISSUER_URL
              value: https://auth.yeetus.net/realms/network-yeetus
          envFrom:
            # OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
            - secretRef: {name: maec-secrets}
          ports:
            - {name: http, containerPort: 4180}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: maec
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
