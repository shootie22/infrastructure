apiVersion: v1
kind: Namespace
metadata:
  name: joplin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin-postgres
  namespace: joplin
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: joplin-postgres}
  template:
    metadata:
      labels: {app: joplin-postgres}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: thinkcentre
      containers:
        - name: postgres
          image: postgres:15.17-trixie@sha256:f30e3de0ac9cc938dac627ef2231099867c694b5f949fadb924c8c977428c399
          envFrom:
            - secretRef: {name: joplin-env}
          ports:
            - {name: postgres, containerPort: 5432}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          hostPath: {path: /home/main/services/joplin/db, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: joplin-db
  namespace: joplin
spec:
  selector: {app: joplin-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joplin
  namespace: joplin
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: joplin}
  template:
    metadata:
      labels: {app: joplin}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: joplin
          image: joplin/server:3.5.2@sha256:5d9e7f9d31b436cb1b99d1a6a65d8c5bf760829094617e8ad1e956fd925de888
          envFrom:
            - secretRef: {name: joplin-env}
          ports:
            - {name: http, containerPort: 22300}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: POSTGRES_HOST
              value: joplin-pg-rw
            - name: POSTGRES_DATABASE
              value: joplin
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: joplin-pg-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: joplin-pg-app
                  key: password
      # Fuji or the thinkcentre, moving 30 s after its node stops answering.
      # Everything is in Postgres; the env above overrides the old database
      # settings in joplin-env.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - fuji
                      - thinkcentre
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: joplin
  namespace: joplin
spec:
  selector: {app: joplin}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: n-yeetus-net
  namespace: joplin
spec:
  secretName: n-yeetus-net-tls
  dnsNames: [n.yeetus.net]
  issuerRef: {name: letsencrypt-prod, kind: ClusterIssuer}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: joplin
  namespace: joplin
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: Joplin Server
    gethomepage.dev/icon: joplin.png
    gethomepage.dev/description: Notes and sync
    gethomepage.dev/weight: "700"
    gethomepage.dev/siteMonitor: http://joplin.joplin.svc.cluster.local
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - n.yeetus.net
      secretName: n-yeetus-net-tls
  rules:
    - host: n.yeetus.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: joplin
                port:
                  number: 80
