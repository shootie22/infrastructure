apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: headlamp-tailnet-proxy
  namespace: headlamp
spec:
  selector:
    matchLabels:
      app: headlamp-tailnet-proxy
  template:
    metadata:
      labels:
        app: headlamp-tailnet-proxy
    spec:
      # Both API servers, one copy each (#149).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/hostname, operator: In, values: [fuji, thinkcentre]}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              # This node's tailnet address, for the Caddyfile's binds. Fails
              # (and restarts) until tailscale0 has one.
              TAILNET_IP=$(ip -4 addr show dev tailscale0 | awk '/inet /{split($2, a, "/"); print a[1]; exit}')
              [ -n "$TAILNET_IP" ]
              export TAILNET_IP
              caddy run --config /etc/caddy/Caddyfile &
              proxy_pid=$!
              trap 'kill -TERM "$proxy_pid" 2>/dev/null || true; wait "$proxy_pid" 2>/dev/null || true; exit 0' TERM INT
              previous="$(sha256sum /etc/caddy/Caddyfile /certs/tls.crt /certs/tls.key)"
              while kill -0 "$proxy_pid" 2>/dev/null; do
                sleep 15
                current="$(sha256sum /etc/caddy/Caddyfile /certs/tls.crt /certs/tls.key)"
                if [ "$current" != "$previous" ]; then
                  # Caddy 2.10 does not reload on SIGUSR1. Use its admin API so
                  # ConfigMap updates and renewed certificate files take effect.
                  if caddy reload \
                    --config /etc/caddy/Caddyfile \
                    --adapter caddyfile \
                    --address 127.0.0.1:12019 \
                    --force; then
                    previous="$current"
                  fi
                fi
              done
              wait "$proxy_pid"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          # Caddy's admin endpoint; the listener's address differs per node.
          readinessProbe:
            httpGet: {host: 127.0.0.1, port: 12019, path: /config/}
            periodSeconds: 10
          livenessProbe:
            httpGet: {host: 127.0.0.1, port: 12019, path: /config/}
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              # The official Caddy binary carries this file capability.
              add: [NET_BIND_SERVICE]
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: cert
              mountPath: /certs
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: headlamp-tailnet-proxy
        - name: cert
          secret:
            secretName: headlamp-infra-tls
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
