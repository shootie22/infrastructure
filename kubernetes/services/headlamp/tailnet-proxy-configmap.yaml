apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-tailnet-proxy
  namespace: headlamp
data:
  Caddyfile: |
    {
      admin 127.0.0.1:12019
      auto_https disable_redirects
      # The host forwards tailnet TCP 443 to this internal listener
      # (dotfiles modules/nixos/tailnet-https.nix). One copy on fuji and one
      # on the thinkcentre (#149), each on its own node's tailnet address.
      https_port 8443
      servers {
        protocols h1 h2
      }
    }

    https://hl.infra.radunenu.com {
      bind {$TAILNET_IP}
      tls /certs/tls.crt /certs/tls.key
      reverse_proxy headlamp.headlamp.svc.cluster.local:80
    }

    https://hub.infra.radunenu.com {
      bind {$TAILNET_IP}
      tls /certs/tls.crt /certs/tls.key
      reverse_proxy homepage.homepage.svc.cluster.local:3000
    }
    https://ollama.infra.radunenu.com {
      bind {$TAILNET_IP}
      tls /certs/tls.crt /certs/tls.key
      # Model pulls and long generations stream for minutes.
      reverse_proxy ollama.ollama.svc.cluster.local:11434 {
        flush_interval -1
      }
    }
    https://sxng.infra.radunenu.com {
      bind {$TAILNET_IP}
      tls /certs/tls.crt /certs/tls.key
      reverse_proxy searxng.searxng.svc.cluster.local:8080
    }
