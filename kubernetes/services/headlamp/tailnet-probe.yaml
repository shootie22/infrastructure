apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tailnet-only
  namespace: headlamp
spec:
  ipAllowList:
    sourceRange:
      - 100.64.0.0/10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailnet-probe
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailnet-probe
  template:
    metadata:
      labels:
        app: tailnet-probe
    spec:
      nodeSelector:
        kubernetes.io/hostname: fuji
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whoami
          image: traefik/whoami:v1.12.0
          imagePullPolicy: IfNotPresent
          env:
            - name: WHOAMI_PORT_NUMBER
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-probe
  namespace: headlamp
spec:
  selector:
    app: tailnet-probe
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tailnet-probe
  namespace: headlamp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-tailnet-only@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hl.infra.radunenu.com
      secretName: headlamp-infra-tls
  rules:
    - host: hl.infra.radunenu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tailnet-probe
                port:
                  name: http
