# Hub's own data (sessions, snapshots, incidents, deploys): one instance in
# each site, like every other database here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hub-db
  namespace: hub
  annotations:
    # Changed to make CNPG look at the managed roles again; it gave up on
    # hub_public before its password secret existed.
    hub.radunenu.com/roles-recheck: "1"
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
  bootstrap:
    initdb:
      database: hub
      owner: hub
  storage:
    size: 5Gi
    storageClass: local-path
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      db: "true"
  probes:
    liveness:
      isolationCheck:
        enabled: true
  # hub-public's login: it may only read the two public views (Hub grants
  # that itself after its migrations).
  managed:
    roles:
      - name: hub_public
        ensure: present
        login: true
        passwordSecret:
          name: hub-public-db
---
# Hourly dump into a folder on fuji that its nightly Borg job picks up.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hub-db-dump
  namespace: hub
spec:
  schedule: "41 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/hostname: fuji
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  host=hub-db-ro
                  pg_isready -q -h $host || host=hub-db-r
                  pg_dump -h $host -U hub -d hub -Fc -f /backup/hub.dump.tmp
                  mv /backup/hub.dump.tmp /backup/hub.dump
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: {name: hub-db-app, key: password}
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - {name: backup, mountPath: /backup}
          volumes:
            - name: backup
              hostPath:
                path: /var/lib/pg-dumps
                type: Directory
