# Where Hub may connect: DNS, its database, the monitoring stack, the game
# agents, the Kubernetes API, Traefik and the checkers and relays on the Nebula mesh,
# plus HTTPS and DNS out (Keycloak, GitHub, the authoritative nameservers).
# Nothing else in the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-egress
  namespace: hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hub
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: hub-db}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
      ports:
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 9093}
        - {protocol: TCP, port: 3100}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: hub-writer}
      ports:
        - {protocol: TCP, port: 8080}
    # The game agents, one next to each Minecraft server (infra-hub #3).
    - to:
        - namespaceSelector:
            matchLabels: {hub.radunenu.com/games: "true"}
          podSelector:
            matchLabels: {app.kubernetes.io/name: game-agent}
      ports:
        - {protocol: TCP, port: 8080}
    - to:
        - ipBlock: {cidr: 10.99.0.0/24}
      ports:
        - {protocol: TCP, port: 6443}
        - {protocol: TCP, port: 9112}
        - {protocol: TCP, port: 9180}
        - {protocol: TCP, port: 9181}
        - {protocol: TCP, port: 9182}
        - {protocol: TCP, port: 9190}
    # Traefik's HTTPS entry point, for the DNS page asking it about each
    # name (the certificate it hands out, any redirect). Its Service listens
    # on 443 but the pods on 8443, and this policy sees the pod's port.
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8443}
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
