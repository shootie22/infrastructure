# hub-public (#181): the incident API anyone with a token can read, at
# https://status.radunenu.com/api/v1/incidents. Its own pods, its own
# database role that can only read two views, no Kubernetes token, no Hub
# session. Tokens come from Keycloak (realm infra): a client per consumer,
# with the role incidents:read of the hub-public client.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub-public
  namespace: hub
  annotations:
    hub.radunenu.com/description: The public incident API
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: hub-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub-public
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: hub-public
      tolerations:
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub-public
          image: git.radunenu.com/radu/infra-hub:main
          imagePullPolicy: Always
          args: [public]
          env:
            - {name: HUB_DATABASE_URL_FILE, value: /secrets/db/uri}
            - {name: HUB_PUBLIC_ISSUER, value: "https://auth.radunenu.com/realms/infra"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              sleep: {seconds: 3}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: db, mountPath: /secrets/db, readOnly: true}
      volumes:
        - name: db
          secret:
            secretName: hub-public-db
            items:
              - {key: uri, path: uri}
---
apiVersion: v1
kind: Service
metadata:
  name: hub-public
  namespace: hub
spec:
  selector:
    app.kubernetes.io/name: hub-public
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hub-public
  namespace: hub
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hub-public
---
# Out: DNS, its database, and HTTPS to Keycloak for the token keys.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hub-public-egress
  namespace: hub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hub-public
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {cnpg.io/cluster: hub-db}
      ports:
        - {protocol: TCP, port: 5432}
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: status-radunenu-com
  namespace: hub
spec:
  secretName: status-radunenu-com-tls
  dnsNames:
    - status.radunenu.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
# Only /api on the internet; Hub itself stays on the tailnet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-public
  namespace: hub
  annotations:
    radunenu.com/status: hidden
spec:
  ingressClassName: traefik
  tls:
    - hosts: [status.radunenu.com]
      secretName: status-radunenu-com-tls
  rules:
    - host: status.radunenu.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hub-public
                port:
                  number: 80
