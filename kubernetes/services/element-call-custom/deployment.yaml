apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-call
  namespace: element-call
spec:
  replicas: 2
  selector:
    matchLabels:
      app: element-call
  template:
    metadata:
      labels:
        app: element-call
    spec:
      priorityClassName: matrix-critical
      containers:
        - name: element-call
          image: ghcr.io/element-hq/element-call:v0.29.0@sha256:886e00047b4e1235fdf30e6eeeca379305d974345b8b74dff8c5146f24aa6f5a
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
          # Traefik needs a moment to stop sending requests here (#89).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
      volumes:
        - name: config
          configMap:
            name: element-call-config
      # One copy per site, so either site can serve it alone (#89).
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: topology.kubernetes.io/zone
              labelSelector:
                matchLabels:
                  app: element-call
  # No third site for a surge pod, so replace one at a time.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
