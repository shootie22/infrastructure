apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-call
  namespace: element-call
spec:
  replicas: 1
  selector:
    matchLabels:
      app: element-call
  template:
    metadata:
      labels:
        app: element-call
    spec:
      containers:
        - name: element-call
          image: ghcr.io/element-hq/element-call:v0.26.0@sha256:fadd44a69565b2db9320b011c2d0ab01f7305cac0a51ee196ba6ffcf8e226199
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: element-call-config
