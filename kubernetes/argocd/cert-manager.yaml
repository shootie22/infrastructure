apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds:
          enabled: true
        # Platform tier (priority-classes.yaml), and requests from what each
        # part used over a week (Prometheus, 7 days to 2026-11-08: 81, 53 and
        # 35 MiB at most).
        global:
          priorityClassName: platform-critical
        resources:
          requests: {cpu: 10m, memory: 128Mi}
          limits: {memory: 256Mi}
        cainjector:
          resources:
            requests: {cpu: 10m, memory: 96Mi}
            limits: {memory: 256Mi}
        webhook:
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 128Mi}
        startupapicheck:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
        # Lets Prometheus scrape the controller (certificate expiry alerts).
        serviceAnnotations:
          monitoring.radunenu.com/scrape: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    # Hub's description of the namespace (CreateNamespace makes it).
    managedNamespaceMetadata:
      annotations:
        hub.radunenu.com/description: "Gets and renews the TLS certificates"
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
