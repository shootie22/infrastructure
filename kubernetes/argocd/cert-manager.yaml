apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      valuesObject:
        crds:
          enabled: true
        # Lets Prometheus scrape the controller (certificate expiry alerts).
        serviceAnnotations:
          monitoring.radunenu.com/scrape: "true"

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    # Hub's description of the namespace (CreateNamespace makes it).
    managedNamespaceMetadata:
      annotations:
        hub.radunenu.com/description: "Gets and renews the TLS certificates"
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
