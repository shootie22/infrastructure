apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.1
    helm:
      valuesObject:
        # One operator per site, so a Postgres failover never waits on the
        # site that just went away (#29).
        replicaCount: 2
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cloudnative-pg
        # With one pod per site there's nowhere for an extra pod to go during
        # an upgrade, so replace them one at a time instead.
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        # Both pods started on minima before the nodes had site labels, and
        # the anti-affinity only applies when scheduling. Changing this
        # rolls them out again.
        podAnnotations:
          radunenu.com/rolled: "2026-10-06"

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  syncPolicy:
    # Hub's description of the namespace (CreateNamespace makes it).
    managedNamespaceMetadata:
      annotations:
        hub.radunenu.com/description: "CloudNativePG operator, runs every Postgres cluster and its failover"
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs are too big for a client-side apply.
      - ServerSideApply=true
