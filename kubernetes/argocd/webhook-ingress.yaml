apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-webhook
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: argocd-argocd-webhook@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argocd-webhook.radunenu.com
      secretName: argocd-webhook-tls
  rules:
    - host: argocd-webhook.radunenu.com
      http:
        paths:
          - path: /api/webhook
            pathType: Exact
            backend:
              service:
                name: argocd-server
                port:
                  number: 443
