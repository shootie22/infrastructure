apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-secrets-operator
  namespace: argocd
  annotations:
    # The chart has no setting for a priority class, so its pod gets the
    # default (priority-classes.yaml). Secrets it already made stay when it's
    # gone; only changes wait for it.
    radunenu.com/priority-class: service
spec:
  project: default

  source:
    repoURL: https://isindir.github.io/sops-secrets-operator/
    chart: sops-secrets-operator
    targetRevision: 0.30.0
    helm:
      valuesObject:
        secretsAsFiles:
          - name: sops-age-key-file
            secretName: sops-age-key-file
            mountPath: /etc/sops-age-key-file

        extraEnv:
          - name: SOPS_AGE_KEY_FILE
            value: /etc/sops-age-key-file/key

        # It used 68 MiB at most in the week to 2026-11-08.
        resources:
          requests: {cpu: 10m, memory: 96Mi}
          limits: {memory: 256Mi}

  destination:
    server: https://kubernetes.default.svc
    namespace: sops

  syncPolicy:
    # Hub's description of the namespace (CreateNamespace makes it).
    managedNamespaceMetadata:
      annotations:
        hub.radunenu.com/description: "Turns the SOPS-encrypted files in Git into Secrets"
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
