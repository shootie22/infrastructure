apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  # Never uninstall the ingress serving Headscale after a failed upgrade.
  failurePolicy: abort
  valuesContent: |-
    # One Traefik per site: fuji (RO) and thinkcentre (DK), so DK can serve its
    # own services when RO is down (the edge forwards to 100.64.0.4 then).
    # fuji keeps a copy, so Headscale always has an ingress in RO, which
    # remote workers need to find their tailnet paths.
    deployment:
      replicas: 2
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [fuji, thinkcentre]
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
    # Only two allowed nodes, each holding one copy, so there's no room for a
    # surge pod: replace one at a time instead.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    # Each node's port listener only uses its own Traefik, so RO traffic never
    # detours through DK, and Traefik sees the real client address.
    #
    # Both are needed. The port listener (svclb) is a pod, and kube-proxy sends
    # traffic from pods by the internal policy, not the external one. With
    # only externalTrafficPolicy Local, half of RO's visitors went through
    # the thinkcentre's Traefik, and hung for about 70 s when the thinkcentre
    # went away (infrastructure #158). Nothing in the cluster calls Traefik's
    # service address, so the internal policy costs nothing.
    service:
      spec:
        externalTrafficPolicy: Local
        internalTrafficPolicy: Local

    # Traefik cuts off a request body after 60 s by default. Image pushes to
    # Gitea's registry over Nebula (the CI runners, #150) take longer for a
    # big layer, so give uploads 30 minutes.
    ports:
      web:
        transport:
          respondingTimeouts:
            readTimeout: 30m
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 30m
    api:
      dashboard: true

    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - traefik

    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
          annotations:
            monitoring.radunenu.com/scrape: "true"
            monitoring.radunenu.com/path: /metrics

    # Error/slow requests go to stdout and the existing Alloy pod collector.
    # Keep request evidence out of Prometheus labels and drop all headers.
    additionalArguments:
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filters.statuscodes=400-599
      - --accesslog.filters.minduration=1s
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.names.StartUTC=keep
      - --accesslog.fields.names.RequestHost=keep
      - --accesslog.fields.names.RequestPath=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      - --accesslog.fields.names.OriginStatus=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.ServiceName=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.names.OriginDuration=keep
      - --accesslog.fields.names.entryPointName=keep
      - --accesslog.fields.names.RetryAttempts=keep
