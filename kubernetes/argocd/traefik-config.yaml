apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  # Never uninstall the ingress serving Headscale after a failed upgrade.
  failurePolicy: abort
  valuesContent: |-
    # One Traefik per site: fuji (RO) and thinkcentre (DK), so DK can serve its
    # own services when RO is down (the edge forwards to 100.64.0.4 then).
    # fuji keeps a copy, so Headscale always has an ingress in RO, which
    # remote workers need to find their tailnet paths.
    deployment:
      replicas: 2
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values: [fuji, thinkcentre]
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: traefik
    # Only two allowed nodes, each holding one copy, so there's no room for a
    # surge pod: replace one at a time instead.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 0
    # Each Traefik takes 80 and 443 on its own node (hostPort), and the Service
    # is only for inside the cluster. With k3s' port listener (svclb) in front
    # instead, kube-proxy spread the listener's traffic over both Traefiks
    # whatever the traffic policies said: half of RO's visitors went through
    # DK, and hung for about 70 s when the thinkcentre went away
    # (infrastructure #158). This way RO's traffic stays in RO, DK's in DK,
    # and Traefik sees the real client address.
    service:
      spec:
        type: ClusterIP

    # Traefik cuts off a request body after 60 s by default. Image pushes to
    # Gitea's registry over Nebula (the CI runners, #150) take longer for a
    # big layer, so give uploads 30 minutes.
    ports:
      web:
        hostPort: 80
        # The edge's HAProxy says who the visitor is with a PROXY header
        # (#95). Only it may; from it, a connection without one still works.
        proxyProtocol:
          trustedIPs: [10.99.0.1/32]
        transport:
          respondingTimeouts:
            readTimeout: 30m
      websecure:
        hostPort: 443
        proxyProtocol:
          trustedIPs: [10.99.0.1/32]
        transport:
          respondingTimeouts:
            readTimeout: 30m
      # Git over SSH, passed on to Gitea's sshd (the gitea-ssh IngressRouteTCP).
      gitssh:
        port: 2022
        hostPort: 2022
        protocol: TCP
        proxyProtocol:
          trustedIPs: [10.99.0.1/32]
    # The address written into each Ingress's status. It used to come from the
    # LoadBalancer Service; the internal-only one has none, and Argo CD keeps
    # an Ingress without an address at Progressing. ro is where visitors
    # actually come in (the edge during a failover).
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
        ingressEndpoint:
          hostname: ro.radunenu.com
    api:
      dashboard: true

    ingressRoute:
      dashboard:
        enabled: true
        entryPoints:
          - traefik

    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        service:
          enabled: true
          annotations:
            monitoring.radunenu.com/scrape: "true"
            monitoring.radunenu.com/path: /metrics

    # Error/slow requests go to stdout and the existing Alloy pod collector.
    # Keep request evidence out of Prometheus labels. Of the headers only the
    # User-Agent and Cloudflare's visitor address are kept, with the
    # visitor's own address, so Hub's traffic page can say who sent what.
    # Only for these failed or slow requests, and Loki keeps 14 days.
    additionalArguments:
      # A pod that doesn't accept the connection within 2 s counts as gone,
      # and the retry middleware sends the request to another replica (#160).
      - --serversTransport.forwardingTimeouts.dialTimeout=2s
      - --entryPoints.web.http.middlewares=kube-system-retry@kubernetescrd
      - --entryPoints.websecure.http.middlewares=kube-system-retry@kubernetescrd
      - --accesslog=true
      - --accesslog.format=json
      - --accesslog.filters.statuscodes=400-599
      - --accesslog.filters.minduration=1s
      - --accesslog.fields.defaultmode=drop
      - --accesslog.fields.headers.defaultmode=drop
      - --accesslog.fields.names.StartUTC=keep
      - --accesslog.fields.names.RequestHost=keep
      - --accesslog.fields.names.RequestPath=keep
      - --accesslog.fields.names.RequestMethod=keep
      - --accesslog.fields.names.DownstreamStatus=keep
      - --accesslog.fields.names.OriginStatus=keep
      - --accesslog.fields.names.RouterName=keep
      - --accesslog.fields.names.ServiceName=keep
      - --accesslog.fields.names.Duration=keep
      - --accesslog.fields.names.OriginDuration=keep
      - --accesslog.fields.names.entryPointName=keep
      - --accesslog.fields.names.RetryAttempts=keep
      - --accesslog.fields.names.ClientHost=keep
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Cf-Connecting-Ip=keep
