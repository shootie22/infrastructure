# The front doors' readiness check (dotfiles modules/nixos/front-door.nix):
# https://traefik-ready.invalid/ping answers 200 only from a Traefik that has
# its routes loaded. It's an ordinary Ingress (Traefik's Kubernetes Ingress
# provider), and the request goes through the middlewares every entry point
# has (the outage page and retry, from the CRD provider), so a Traefik that
# hasn't loaded both answers 404, as every site would. Behind it, Traefik's
# own /ping on its traefik port: nothing but Traefik itself has to be up.
# .invalid can't be a real name, so this is never reachable from outside.
#
# Synced with the Middlewares (wave -1), before Traefik's config that moves
# its ports behind the front doors.
# Each Traefik must answer for itself. Traefik normally picks the Service's
# pods on its own, so fuji's check also landed on the thinkcentre's Traefik:
# when that one went away, half of fuji's checks failed, and the edge
# (fall 2 at 1 s) marked both sites down at once, for 15 s to 2 minutes, on
# 16, 18, 19 and 24 Nov (docs/matrix/failure-modes.md). nativelb makes
# Traefik go through the Service's cluster IP, and internalTrafficPolicy
# Local keeps that on the node it came in on.
apiVersion: v1
kind: Service
metadata:
  name: traefik-ping
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    traefik.ingress.kubernetes.io/service.nativelb: "true"
spec:
  internalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - {name: ping, port: 8080, targetPort: 8080}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-ready
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  rules:
    - host: traefik-ready.invalid
      http:
        paths:
          - path: /ping
            pathType: Exact
            backend:
              service: {name: traefik-ping, port: {number: 8080}}
