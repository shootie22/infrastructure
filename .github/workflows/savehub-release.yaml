name: Deploy tested SaveHub release
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: savehub-release
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Resolve the paired registry release
        id: release
        run: node scripts/savehub-release.mjs .
      - name: Commit immutable digests for ArgoCD
        if: steps.release.outputs.changed == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          git config user.name 'SaveHub release bot'
          git config user.email 'savehub-release@radunenu.com'
          git add kubernetes/services/savehub kubernetes/services/keycloak/keycloak.yaml
          git commit -m "Deploy tested SaveHub ${SOURCE_COMMIT}"
          git push origin HEAD:main
