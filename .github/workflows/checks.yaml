# Runs on every pull request to main, and the ruleset requires it, so a
# change Hub opens (or one by hand) can't land with a broken manifest, rule,
# dashboard or DNS file (infra-hub #44).
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # The .sops.yaml files too: sops encrypts only the values, so their shape
          # can be checked, and a comment sops turned into a list item breaks it.
          find kubernetes -name '*.yaml' ! -name hub.yaml -print0 |
            xargs -0 ./kubeconform -summary -strict -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pip install pyyaml
      - name: validate-monitoring.py
        run: python3 kubernetes/services/monitoring/validate-monitoring.py --prometheus-files-output /tmp/prom --promql-rules-output /tmp/dashboard-queries.yaml
      - name: Dashboards match their generator
        run: python3 kubernetes/services/monitoring/generate-dashboards.py --check
      - name: promtool, the version Prometheus runs
        run: |
          image=$(grep -ho 'quay.io/prometheus/prometheus:[^ ]*' kubernetes/services/monitoring/*.yaml | head -1)
          docker run --rm -v /tmp/prom:/prom:ro -v /tmp/dashboard-queries.yaml:/q.yaml:ro --entrypoint sh "$image" -c \
            'promtool check rules /prom/*.rules /q.yaml && cd /prom && promtool check config --syntax-only prometheus.yml'

  hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: infrastructure
      # A Hub deploy opens a dotfiles PR on the same branch name; render
      # against it, since dotfiles main doesn't have it until it's merged.
      - name: Dotfiles branch (Hub's twin PR, else main)
        id: dotfiles
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" == hub/* ]] && git ls-remote --exit-code --heads https://github.com/shootie22/dotfiles "$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          repository: shootie22/dotfiles
          ref: ${{ steps.dotfiles.outputs.ref }}
          path: dotfiles
      - name: Services match their hub.yaml
        run: |
          if [ -z "$(find infrastructure/kubernetes/services -name hub.yaml)" ]; then
            echo "no service has a hub.yaml yet"
            exit 0
          fi
          # Hub's image is on Gitea. When Gitea is down this can't run, and it
          # mustn't keep the fix for Gitea from being merged (#267).
          if ! curl -fsS -o /dev/null --max-time 20 https://git.radunenu.com/api/healthz; then
            echo "::warning::Gitea is down, so Hub's image can't be pulled. Skipped."
            exit 0
          fi
          docker run --rm -v "$PWD:/w:ro" git.radunenu.com/radu/infra-hub:main \
            render --check --infra /w/infrastructure --dotfiles /w/dotfiles

  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: opentofu/setup-opentofu@v1
      - name: fmt and validate
        working-directory: tofu
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate
