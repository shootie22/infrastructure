# Renovate (docs/updates.md): proposes update PRs when a new
# image or chart version is out, with release notes. It opens PRs and never
# merges them.
#
# It runs as the renovate-yeetus GitHub App, not with GitHub's built-in token:
# PRs opened with that token don't start CI, and it can't change files in
# .github/workflows. The app is installed on this repository only, and each
# run gets a token that expires within an hour.
name: Renovate

on:
  schedule:
    # Saturday early morning, same day as the NixOS update PR. This is the only
    # schedule: renovate.json had its own Saturday 01:00-08:00 window, and
    # GitHub starts scheduled runs hours late, so the grouped PR kept missing it.
    - cron: "30 0 * * 6"
  workflow_dispatch:

# The built-in token isn't used for anything.
permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits through the API, so they're made (and signed) as the app.
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: info
