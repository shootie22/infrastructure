# Renovate (docs/updates.md): proposes update PRs when a new
# image or chart version is out, with release notes. It merges the safe ones
# itself once their checks pass (image and action patches, rebuilds of the
# same version); the rest wait for a review.
#
# It runs as the renovate-yeetus GitHub App, not with GitHub's built-in token:
# PRs opened with that token don't start CI, and it can't change files in
# .github/workflows. The app is installed on this repository and dotfiles
# only, and each run gets a token that expires within an hour.
name: Renovate

on:
  schedule:
    # Every night, so a fixed CVE is proposed within a day (security audit,
    # 2026-11-03; it was Saturdays only). This is the only schedule:
    # renovate.json had its own Saturday 01:00-08:00 window, and GitHub starts
    # scheduled runs hours late, so the grouped PR kept missing it.
    - cron: "30 0 * * *"
  workflow_dispatch:

# The built-in token isn't used for anything.
permissions:
  contents: read

concurrency:
  group: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          repositories: infrastructure,dotfiles
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app.outputs.token }}
        env:
          # dotfiles only for its workflows' actions (its renovate.json); its
          # flake.lock is the weekly update's.
          RENOVATE_REPOSITORIES: shootie22/infrastructure,shootie22/dotfiles
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits through the API, so they're made (and signed) as the app.
          RENOVATE_PLATFORM_COMMIT: enabled
          LOG_LEVEL: info
