services:
  metrics-proxy:
    image: nginx:1.30.5-alpine
    container_name: hetzner-tailscale-metrics
    restart: unless-stopped

    # Host networking is required so the proxy can reach the existing
    # loopback-only metric listeners without changing Matrix/LiveKit.
    network_mode: host

    entrypoint:
      - nginx
    command:
      - -g
      - daemon off;

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx

    security_opt:
      - no-new-privileges:true
