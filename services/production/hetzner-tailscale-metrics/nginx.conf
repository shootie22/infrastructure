user nginx;
worker_processes 1;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    server_tokens off;
    access_log off;

    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_buffering off;

    server {
        # Tailscale only. Nothing is bound on Hetzner's public address.
        listen 100.64.0.5:9103;

        allow 100.64.0.1;
        deny all;

        location = /synapse/metrics {
            proxy_pass http://127.0.0.1:8008/_synapse/metrics;
        }

        location = /livekit/metrics {
            proxy_pass http://127.0.0.1:6789/metrics;
        }

        location = /livekit-quality/metrics {
            proxy_pass http://127.0.0.1:6790/metrics;
        }

        location / {
            return 404;
        }
    }
}
