services:
  gateway:
    image: caddy:2.10.0-alpine
    container_name: thinkcentre-tailnet-gateway
    restart: unless-stopped

    ports:
      - "100.64.0.4:18080:8080/tcp"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

    networks:
      - rybbit
      - tunnel

    read_only: true
    tmpfs:
      - /data
      - /config

    security_opt:
      - no-new-privileges:true

networks:
  rybbit:
    external: true
    name: rybbit_rybbit_internal

  tunnel:
    external: true
    name: tunnel_net
