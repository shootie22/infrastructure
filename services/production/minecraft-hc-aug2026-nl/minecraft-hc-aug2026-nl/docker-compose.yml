services:
  # server-latest does not build anything itself -- it just runs whatever
  # jar is already sitting in the volume. buildtools-latest compiles
  # /server/spigot.jar for MC_VERSION and, per its own entrypoint, skips
  # the (slow) compile if that jar already exists -- so it's safe to run
  # this automatically on every `up`, not just the first deploy.
  buildtools:
    image: git.radunenu.com/radu/spigotmc-docker:buildtools-latest
    container_name: buildtools-minecraft-hc-aug2026-nl
    pull_policy: always
    restart: "no"
    env_file:
      - runtime.env
    volumes:
      - ${MINECRAFT_DATA_DIR}:/server
    networks:
      - external

  minecraft-hc-aug2026-nl:
    image: git.radunenu.com/radu/spigotmc-docker:server-latest
    container_name: minecraft-hc-aug2026-nl
    pull_policy: always
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - runtime.env
    environment:
      EULA: "true"
    volumes:
      - ${MINECRAFT_DATA_DIR}:/server
    depends_on:
      buildtools:
        condition: service_completed_successfully
    networks:
      - internal
      - external

  frpc:
    image: ghcr.io/fatedier/frpc:v0.65.0
    command:
      - -c
      - /etc/frp/frpc.toml
    container_name: frpc-minecraft-hc-aug2026-nl
    restart: unless-stopped
    env_file:
      - runtime.env
    volumes:
      - ../../../utils/frp/frpc/frpc-tcp.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - minecraft-hc-aug2026-nl
    networks:
      - internal
      - external
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
