services:
  # server-latest does not build anything itself -- it just runs whatever
  # jar is already sitting in the volume. buildtools-latest compiles the
  # jar for MC_VERSION and writes it to /data/spigot.jar (its own mount
  # convention -- NOT /server, which is server-latest's convention). Same
  # host directory, mounted at different paths per image. Per its own
  # entrypoint, buildtools skips the (slow) compile if the jar already
  # exists, so it's safe to run this automatically on every `up`, not
  # just the first deploy.
  buildtools:
    image: git.radunenu.com/radu/spigotmc-docker:buildtools-latest
    container_name: buildtools-minecraft-hc-aug2026-nl
    pull_policy: always
    restart: "no"
    env_file:
      - runtime.env
    volumes:
      - ${MINECRAFT_DATA_DIR}:/data
    networks:
      - external

  minecraft-hc-aug2026-nl:
    image: git.radunenu.com/radu/spigotmc-docker:server-latest
    container_name: minecraft-hc-aug2026-nl
    pull_policy: always
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - runtime.env
    environment:
      EULA: "true"
    volumes:
      - ${MINECRAFT_DATA_DIR}:/server
    depends_on:
      buildtools:
        condition: service_completed_successfully
    networks:
      - internal
      - external

  frpc:
    image: ghcr.io/fatedier/frpc:v0.65.0
    command:
      - -c
      - /etc/frp/frpc.toml
    container_name: frpc-minecraft-hc-aug2026-nl
    restart: unless-stopped
    env_file:
      - runtime.env
    volumes:
      - ../../../utils/frp/frpc/frpc-tcp.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - minecraft-hc-aug2026-nl
    networks:
      - internal
      - external
    read_only: true
    security_opt:
      - no-new-privileges:true

  sftp:
    image: atmoz/sftp:alpine
    container_name: sftp-minecraft-hc-aug2026-nl
    restart: unless-stopped
    command:
      - ${SFTP_USERNAME}:${SFTP_PASSWORD}:1000
    env_file:
      - runtime.env
    volumes:
      # OpenSSH refuses to chroot into a directory writable by the chrooted
      # user, so the shared data dir is mounted as a subfolder of the user's
      # home rather than at the home/chroot root itself.
      - ${MINECRAFT_DATA_DIR}:/home/${SFTP_USERNAME}/server
      # Host keys persist here across restarts; generated on first boot if
      # these files don't already exist on the host.
      - ${SFTP_HOST_KEYS_DIR}/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key
      - ${SFTP_HOST_KEYS_DIR}/ssh_host_rsa_key:/etc/ssh/ssh_host_rsa_key
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  frpc-sftp:
    image: ghcr.io/fatedier/frpc:v0.65.0
    command:
      - -c
      - /etc/frp/frpc.toml
    container_name: frpc-sftp-minecraft-hc-aug2026-nl
    restart: unless-stopped
    env_file:
      - runtime.env
    environment:
      FRP_PROXY_NAME: ${FRP_SFTP_PROXY_NAME}
      FRP_LOCAL_IP: ${FRP_SFTP_LOCAL_IP}
      FRP_LOCAL_PORT: ${FRP_SFTP_LOCAL_PORT}
      FRP_REMOTE_PORT: ${FRP_SFTP_REMOTE_PORT}
    volumes:
      - ../../../utils/frp/frpc/frpc-tcp.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - sftp
    networks:
      - internal
      - external
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
