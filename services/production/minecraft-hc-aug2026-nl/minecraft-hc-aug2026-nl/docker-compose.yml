services:
  # NOTE: server-latest does not build anything itself -- it just runs
  # whatever jar is already sitting in the volume. On a fresh volume, run
  # the one-shot buildtools job in docker-compose.buildtools.yml FIRST
  # (see that file's header comment). It is intentionally NOT wired up via
  # depends_on here, since BuildTools is slow/resource-heavy and should
  # only run when you actually need a jar, not on every restart.
  minecraft-hc-aug2026-nl:
    image: git.radunenu.com/radu/spigotmc-docker:server-latest
    container_name: minecraft-hc-aug2026-nl
    pull_policy: always
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - runtime.env
    environment:
      EULA: "true"
    volumes:
      - ${MINECRAFT_DATA_DIR}:/server
    networks:
      - internal
      - external

  frpc:
    image: ghcr.io/fatedier/frpc:v0.65.0
    command:
      - -c
      - /etc/frp/frpc.toml
    container_name: frpc-minecraft-hc-aug2026-nl
    restart: unless-stopped
    env_file:
      - runtime.env
    volumes:
      - ../../../utils/frp/frpc/frpc-tcp.toml:/etc/frp/frpc.toml:ro
    depends_on:
      - minecraft-hc-aug2026-nl
    networks:
      - internal
      - external
    read_only: true
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge
