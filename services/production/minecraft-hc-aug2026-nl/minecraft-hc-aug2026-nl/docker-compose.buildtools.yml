# Not part of the normal stack -- this file is never picked up by a plain
# `docker compose up`. Run it manually, once, whenever the volume in
# MINECRAFT_DATA_DIR doesn't already have a /server/spigot.jar (e.g. first
# deploy, or bumping MC_VERSION in runtime.env to build a new version):
#
#   docker compose -f docker-compose.buildtools.yml --env-file runtime.env run --rm buildtools
#
# This compiles via BuildTools, which is slow and resource-heavy -- that's
# the whole point of keeping it out of the main docker-compose.yml, so a
# normal restart/redeploy of the game server never re-triggers it.
services:
  buildtools:
    image: git.radunenu.com/radu/spigotmc-docker:buildtools-latest
    container_name: buildtools-minecraft-hc-aug2026-nl
    pull_policy: always
    env_file:
      - runtime.env
    volumes:
      - ${MINECRAFT_DATA_DIR}:/server
    networks:
      - external

networks:
  external:
    driver: bridge
