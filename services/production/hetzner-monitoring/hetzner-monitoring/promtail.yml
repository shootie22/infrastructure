server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://100.64.0.1:3101/loki/api/v1/push
    basic_auth:
      username: "${LOKI_PUSH_USERNAME}"
      password: "${LOKI_PUSH_PASSWORD}"

scrape_configs:
  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          host: hetzner
          __path__: /var/log/auth.log

  - job_name: nginx_access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_access
          host: hetzner
          __path__: /var/log/nginx/*access.log

  - job_name: nginx_error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx_error
          host: hetzner
          __path__: /var/log/nginx/*error.log

  - job_name: livekit
    # Select the container with a Docker filter and set the stream's labels in
    # the pipeline: labels from relabel_configs did not reach Docker streams,
    # which were pushed label-less and Loki rejected the whole batch ("at least
    # one label pair is required per stream"), dropping every job's logs.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: name
            values: ["^/element-call-livekit$"]
    pipeline_stages:
      - static_labels:
          job: livekit
          host: hetzner
          container: element-call-livekit
      # Parse LiveKit's JSON log line. `level` stays a label (low cardinality).
      # participant/room/pID/reason are high cardinality: they stay in the
      # line and are queried with `| json`, never as labels. Not structured
      # metadata either: Loki 2.9 rejects it, and a rejected line fails the
      # whole push batch (all of this host's logs were being dropped).
      # NOTE: confirm these key names against real logs first — see
      # services/production/livekit-quality/README.md "Discovery". `reason` is
      # already known-good (the dashboard's Disconnect Reasons panel uses it).
      - json:
          expressions:
            level: level
            participant: participant
            room: room
            pid: pID
            reason: reason
      - labels:
          level:
      # Optional ingest guard for a debug-level window (used to capture the
      # selected ICE candidate pair + client media IP). promtail's drop stage
      # drops on match, so match the *noise*, not the signal: this drops only
      # debug stats/keepalive chatter while keeping ICE/candidate/disconnect
      # lines. Uncomment while LiveKit runs at `log_level: debug`.
      # - match:
      #     selector: '{job="livekit", level="debug"}'
      #     stages:
      #       - drop:
      #           expression: "(?i)(stats|keepalive|periodic report)"
      #           drop_counter_reason: livekit_debug_noise
