services:
  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: node-exporter-thinkcentre
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
      - --web.listen-address=:9100
    network_mode: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    container_name: cadvisor-thinkcentre
    restart: unless-stopped
    command:
      - --port=9101
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --docker_only=true
    network_mode: host
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail-thinkcentre
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    network_mode: host
    env_file:
      - runtime.env
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/log:/var/log:ro
      - /etc/machine-id:/etc/machine-id:ro
      - promtail_positions:/var/lib/promtail

volumes:
  promtail_positions:
