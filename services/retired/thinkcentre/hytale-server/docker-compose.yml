#    driver: bridge
#
# disabled as I want to be able to connect through LAN

services:
  hytale:
    image: indifferentbroccoli/hytale-server-docker
    restart: unless-stopped
    container_name: hytale
    stop_grace_period: 30s
    ports:
      - ${HYTALE_HOST_PORT}:5520/udp
    env_file:
      - runtime.env
    volumes:
      - ${HYTALE_DATA_DIR}:/home/hytale/server-files
    stdin_open: true
    tty: true
    network_mode: host
